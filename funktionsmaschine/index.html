          const t = w == null ? (k === schritte.length ? M.zahl(y) : '?') : w.length ? w.map((v) => M.zahlCa(v)).join(' oder ') : '–';
          return `<div class="rw-wert${k === 0 ? ' rw-ein' : ''}${k === schritte.length ? ' rw-aus' : ''}${w != null && k < schritte.length ? ' ist-neu' : ''}" data-k="${k}">
            <span class="rw-l">${k === 0 ? 'Eingabe' : k === schritte.length ? 'Ausgabe' : ''}</span><b>${t}</b></div>`;
        };
        let h = st(0);
        schritte.forEach((s, i) => {
          h += `<div class="rw-schritt${ab != null && i >= ab ? ' ist-aktiv' : ''}" data-i="${i}"><span class="rw-vor">${U.chipHtml(s)}<em>→</em></span><span class="rw-zur"><em>←</em>${U.chipHtml(s, true)}</span></div>` + st(i + 1);
        });
        $('.rw-spur').innerHTML = h;
      }
      function glgZeile(k, werte, mitPfeil) {
        const T = M.zwischenterme(schritte)[k];
        const links = k === 0 ? '<i class="var">x</i>' : M.html(T);
        const rechts = werte.length ? werte.map((v) => `${links} = ${M.zahlCa(v)}`).join(' <span class="oder">oder</span> ') : `${links} = ? <span class="rw-nie">(keine Lösung)</span>`;
        const op = mitPfeil && k > 0 ? `<span class="glg-op">| ${U.chipHtml(schritte[k - 1], true)}</span>` : '';
        return `<li class="${k === 0 ? 'glg-ende' : ''}"><span class="glg-t">${rechts}</span>${op}</li>`;
      }
      function umkehr() {
        const baum = M.ausSchritten(schritte), f = M.fn(baum);
        const u = M.umkehrfunktion(schritte);
        let h = `<p class="rw-zeile"><span class="term"><i class="var">f</i>(<i class="var">x</i>) = </span>${M.html(baum)}</p>`;
        const serien = [{ fn: f, farbe: 'var(--f)', breite: 3.5 }];
        let leg = `<span class="leg"><span class="leg-strich" style="background:var(--f)"></span><i>f</i></span>`;
        if (u.baum) {
          const g = M.fn(u.baum);
          h += `<p class="rw-zeile"><span class="term"><i class="var">f</i><sup>−1</sup>(<i class="var">x</i>) = </span>${M.html(u.baum)}</p>
            <p class="rw-klein">Die Umkehrmaschine macht die Schritte rückwärts: ${schritte.slice().reverse().map((s) => `<span class="mf-chip">${U.chipHtml(s, true)}</span>`).join(' → ') || 'nichts'}.${u.nurPositiv ? ' Sie gilt nur für Zahlen, die f auch ausgeben kann.' : ''}</p>`;
          // nur dort zeichnen, wo f⁻¹ wirklich zurückführt
          serien.push({ fn: (x) => { const v = g(x); return Number.isFinite(v) && M.gleich(f(v), x) ? v : NaN; }, farbe: 'var(--h)', breite: 3.5 });
          leg += `<span class="leg"><span class="leg-strich" style="background:var(--h)"></span><span><i>f</i><sup>−1</sup></span></span>`;
        } else {
          h += `<p class="rw-zeile rw-nicht">Keine Umkehrfunktion: ${u.grund}</p>`;
        }
        const punkte = [];
        if (loesung) loesung.forEach((x0, i) => {
          punkte.push({ x: x0, y, farbe: 'var(--f)', id: 'f' + i });
          if (u.baum) punkte.push({ x: y, y: x0, farbe: 'var(--h)', id: 'u' + i });
        });
        $('.rw-umkehr').innerHTML = h;
        const achse = $('#rw-achse').checked;
        if (achse) leg += '<span class="leg"><span class="leg-strich gestrichelt"></span><span><i>y</i> = <i>x</i></span></span>';
        graph.zeichne({ serien, punkte, fenster: { xmin: -6, xmax: 10, ymin: -6, ymax: 10 }, quadratisch: true, linien: achse ? [{ art: 'diagonale', klasse: 'g-spiegel' }] : [] });
        $('.rw-legende').innerHTML = leg;
      }
      function meldung(text, art) {
        const m = $('.rw-meldung');
        m.hidden = !text; m.innerHTML = text || ''; m.className = 'rueckmeldung rw-meldung' + (art ? ' ist-' + art : '');
      }
      function neu(behalteY) {
        if (!behalteY) {
          // eine Ausgabe wählen, zu der eine ganze Zahl passt
          const f = M.fn(M.ausSchritten(schritte));
          const kandidaten = [];
          for (let x = -5; x <= 10; x++) { const v = f(x); if (Number.isFinite(v) && Number.isInteger(Math.round(v * 1000) / 1000) && Math.abs(v) < 1000) kandidaten.push(v); }
          y = kandidaten.length ? wahl(kandidaten) : 1;
        }
        $('.rw-y').value = M.zahl(y);
        $('.rw-x').value = '';
        loesung = null;
        meldung('');
        spur(null);
        $('.rw-glg').innerHTML = '';
        umkehr();
        melde();
      }
      async function rueckwaerts() {
        if (laeuft) return;
        if (!schritte.length) { meldung('Die Maschine hat noch keine Schritte.', 'noch'); return; }
        laeuft = true;
        const ebenen = M.rueckwaerts(schritte, y);
        const n = schritte.length, werte = new Array(n + 1).fill(null);
        werte[n] = [y];
        spur(werte);
        const glg = $('.rw-glg');
        glg.innerHTML = glgZeile(n, [y], true);
        for (let k = n - 1; k >= 0; k--) {
          spur(werte, k);
          await U.warte(650);
          werte[k] = ebenen[k].werte;
          spur(werte, k);
          glg.insertAdjacentHTML('beforeend', glgZeile(k, ebenen[k].werte, true));
          if (!ebenen[k].werte.length) { meldung(`Hier geht es nicht weiter: ${ebenen[k].hinweis} Zu dieser Ausgabe gibt es keine Eingabe.`, 'falsch'); laeuft = false; rueckZahl++; melde(); return; }
        }
        loesung = ebenen[0].werte;
        meldung(loesung.length > 1 ? `Zwei Zahlen passen: ${loesung.map((v) => M.zahlCa(v)).join(' und ')}. Beim Rückwärtsrechnen von □² gibt es zwei Möglichkeiten.` : `Eingeworfen wurde <b>${M.zahlCa(loesung[0])}</b>.`, 'gut');
        umkehr();
        laeuft = false;
        rueckZahl++;
        melde();
      }
      function pruefen() {
        const x = U.zahlLesen($('.rw-x').value);
        if (!Number.isFinite(x)) { meldung('Trag eine Zahl ein.', 'noch'); return; }
        const v = M.wert(M.ausSchritten(schritte), x);
        const alle = M.rueckwaerts(schritte, y)[0].werte;
        pruefZahl++;
        letzteRichtig = M.gleich(v, y);
        if (M.gleich(v, y)) {
          loesung = [x];
          spur(M.zwischenterme(schritte).map((T) => [M.wert(T, x)]));
          const andere = alle.filter((w) => !M.gleich(w, x));
          meldung(`Richtig: f(${M.zahl(x)}) = ${M.zahl(y)}.${andere.length ? ' Es gibt noch eine zweite Zahl. Findest du sie?' : ''}`, 'gut');
          umkehr();
        } else {
          meldung(`f(${M.zahl(x)}) = ${Number.isFinite(v) ? M.zahl(v) : 'nicht definiert'}, nicht ${M.zahl(y)}. Rechne Schritt für Schritt rückwärts.`, 'falsch');
        }
        melde();
      }
      $('.rw-y').addEventListener('change', () => { const v = U.zahlLesen($('.rw-y').value); if (Number.isFinite(v)) { y = v; neu(true); } else $('.rw-y').value = M.zahl(y); });
      $('.rw-x').addEventListener('keydown', (e) => { if (e.key === 'Enter') pruefen(); });
      wurzel.addEventListener('change', (e) => { if (e.target.id === 'rw-achse') umkehr(); });
      wurzel.addEventListener('click', (e) => {
        const a = e.target.closest('[data-akt]');
        if (!a || laeuft) return;
        if (a.dataset.akt === 'zufall') { const z = zufallsMaschine(); schritte = z.schritte; ed.setze({ schritte }); y = z.y; neu(true); }
        if (a.dataset.akt === 'neueAusgabe') neu();
        if (a.dataset.akt === 'pruefen') pruefen();
        if (a.dataset.akt === 'rueck') rueckwaerts();
      });
      // Für die Einführung (js/einfuehrung-rueckwaerts.js)
      this.einfuehrung = {
        zuruecksetzen() { schritte = [{ op: 'mul', v: 2 }, { op: 'add', v: 1 }]; ed.setze({ schritte }); y = 13; $('#rw-achse').checked = true; neu(true); },
        get stand() { return { schritte, y, loesung, pruefZahl, rueckZahl, letzteRichtig, laeuft }; },
        pruefe(x) { $('.rw-x').value = M.zahl(x); pruefen(); },
        rueckwaerts: () => rueckwaerts(),
      };
      neu(true);
    },
  };
})(window.FW = window.FW || {});

</script>
<script >
/* Funktionswerkstatt · Modus „Blackbox“
   Eine Maschine mit geheimer Vorschrift: aus dem Pool (nach Jahrgang) oder verdeckt von der Lehrkraft eingegeben.
   Zahlen einwerfen, Muster in der Tabelle suchen (Differenzen, Quotienten, Symmetrie), Vermutung als Term prüfen. */
(function (FW) {
  'use strict';
  const M = FW.mathe, U = FW.ui;
  FW.modi = FW.modi || {};
  const POOL = {
    7: ['x + 4', 'x − 3', '3x', '2x + 1', '2x − 3', '10 − x', '4x − 5', '3x + 2', 'x : 2 + 1', '5x − 2'],
    8: ['0,5x + 2', '−2x + 3', '3x − 4', '−x − 1', '1,5x', '−0,5x + 4', '2(x − 1)', '−3x', '4 − 2x', '12 : x'],
    9: ['x²', 'x² + 1', 'x² − 4', '(x − 2)²', '−x² + 4', '2x²', '(x + 1)² − 2', '0,5x²', 'x² − 2x', '√x'],
    10: ['2^x', '3 · 2^x', '8 · 0,5^x', 'x³', '2 · 3^x', '3^x', '0,5 · 2^x', 'x³ − x', '√(x + 4)', '10 · 1,5^x'],
    E: ['x³ − 3x', '(x − 1)(x + 2)', '|x − 2|', '1 : x', '2^(x − 1)', 'x² − 4x + 3', '−x³', '2^x − 1', '|x| − 2', '4 : (x + 1)', 'e^x', '2 · e^x'],
  };
  const ART = { konstant: 'konstant', linear: 'linear', quadratisch: 'quadratisch', exponentiell: 'exponentiell' };

  FW.modi.blackbox = {
    titel: 'Blackbox',
    baue(wurzel) {
      wurzel.innerHTML = `<div class="raster raster-blackbox">
        <section class="karte k-buehne">
          <header class="k-kopf"><span class="bb-jg-t">Jg.</span>
            <div class="chips bb-jg" role="group" aria-label="Jahrgang">${['7', '8', '9', '10', 'E', 'Mix'].map((j) => `<button type="button" class="chip" data-jg="${j}" aria-label="${j === 'Mix' ? 'alle Jahrgänge gemischt' : j === 'E' ? 'Einführungsphase' : 'Jahrgang ' + j}">${j}</button>`).join('')}</div>
            <div class="k-aktionen"><button type="button" class="knopf klein haupt" data-akt="neu">Neue Maschine</button><button type="button" class="knopf klein" data-akt="raetsel">Rätsel der Lehrkraft</button></div>
          </header>
          <div class="bb-buehne"></div>
          <div class="bb-unten"><span class="bb-quelle"></span><button type="button" class="knopf" data-akt="alle">Alle einwerfen</button><button type="button" class="knopf" data-akt="leeren">Leeren</button></div>
        </section>
        <section class="karte k-vermutung">
          <header class="k-kopf"><h2>Deine Vermutung</h2><span class="bb-versuche"></span>
            <div class="k-aktionen"><button type="button" class="knopf haupt" data-akt="pruefen">Prüfen</button><button type="button" class="knopf" data-akt="aufloesen">Auflösen</button></div></header>
          <div class="bb-term"></div>
          <p class="rueckmeldung bb-meldung" hidden></p>
        </section>
        <section class="karte k-hilfen"><div class="bb-hilfen"><div class="k-kopf"><span class="bb-hilfen-t">Strategie-Hilfen</span><span class="k-aktionen">${U.schalter('bb-diff', 'Differenzen', false)}${U.schalter('bb-quot', 'Quotienten', false)}</span></div>
          <div class="chips bb-hilfe-knoepfe"></div><div class="bb-hilfe-text" hidden></div></div></section>
        <section class="karte k-graph"><div class="graph-kasten bb-graph"></div><div class="legende bb-legende"></div></section>
        <section class="karte k-tabelle"><div class="bb-tabelle"></div></section>
        <div class="bb-dialog" hidden><div class="bb-dialog-k karte">
          <h2>Rätsel der Lehrkraft</h2>
          <p>Gib eine geheime Vorschrift ein. Sie bleibt verdeckt, auch am Beamer.</p>
          <div class="bb-geheim"></div>
          <div class="bb-knoepfe"><button type="button" class="knopf haupt" data-akt="raetselStart">Rätsel starten</button><button type="button" class="knopf" data-akt="raetselZu">Abbrechen</button></div>
        </div></div>
      </div>`;
      const $ = (s) => U.$(s, wurzel);
      let jg = '7', ziel = null, quelle = '', xs = new Set(), vermutung = null, versuche = 0, geloest = false, beutel = [], auswahl = null, letzte = {};
      const HILFEN = [
        { t: 'Der Reihe nach', text: () => 'Wirf benachbarte Zahlen ein, zum Beispiel −1, 0, 1, 2, 3. Die Tabelle ordnet sie nach x. So siehst du, wie sich die Werte von Zahl zu Zahl verändern.' },
        { t: 'Teste x = 0', text: () => (xs.has(0) ? `Hier ist f(0) = ${wert(0)}. ` : 'Wirf die 0 ein. ') + 'f(0) ist der y-Achsenabschnitt: bei m · x + b ist das b, bei a · b<sup>x</sup> das a.' },
        { t: '1. Differenzen', schalter: 'bb-diff', text: () => 'In der Tabelle steht jetzt, um wie viel der Wert von einer Zahl zur nächsten wächst. Sind alle 1. Differenzen gleich, ist die Funktion linear, und die Differenz ist die Steigung m. ' + muster(1) },
        { t: '2. Differenzen', schalter: 'bb-diff', text: () => 'Sind erst die 2. Differenzen gleich, ist die Funktion quadratisch. Der Faktor vor x² ist dann die halbe 2. Differenz. ' + muster(2) },
        { t: 'Quotienten', schalter: 'bb-quot', text: () => 'Wird der Wert bei jedem Schritt mit derselben Zahl multipliziert, ist die Funktion exponentiell: f(x) = a · b<sup>x</sup> mit dem Faktor b und a = f(0). Ist der Faktor etwa 2,718, ist es die eulersche Zahl e (Taste e<sup>□</sup>). ' + muster(3) },
        { t: 'Symmetrie', text: () => 'Vergleiche f(1) mit f(−1) und f(2) mit f(−2). Sind sie gleich, ist der Graph symmetrisch zur y-Achse (wie bei x² oder |x|). ' + symmetrie() },
        { t: 'Funktionstyp', text: () => {
          const a = M.art(M.fn(ziel));
          if (a) return `Die Maschine ist <b>${ART[a]}</b>.`;
          if (M.hatTrig(ziel)) return 'Die Maschine ist <b>periodisch</b>: Ihre Werte wiederholen sich. Denk an Sinus, Kosinus oder Tangens (im Bogenmaß).';
          return 'Die Maschine ist weder linear noch quadratisch noch exponentiell. Denk an Wurzel, Betrag, Kehrwert oder höhere Potenzen.'; } },
      ];
      const benutzteHilfen = new Set();
      const wert = (x) => M.zahl(M.wert(ziel, x));
      const folge = () => [...xs].sort((a, b) => a - b).filter((x) => Number.isFinite(M.wert(ziel, x)));
      function laeufe() {   // aufeinanderfolgende x mit Werten
        const s = folge(), out = [];
        let lauf = [];
        s.forEach((x) => { if (lauf.length && x - lauf[lauf.length - 1] !== 1) { out.push(lauf); lauf = []; } lauf.push(x); });
        if (lauf.length) out.push(lauf);
        return out.filter((l) => l.length > 1);
      }
      function muster(stufe) {
        const f = M.fn(ziel), l = laeufe().sort((a, b) => b.length - a.length)[0];
        if (!l || l.length < (stufe === 2 ? 3 : 2)) return '<em>Wirf dafür mehr benachbarte Zahlen ein.</em>';
        const y = l.map(f);
        let reihe;
        if (stufe === 3) { if (y.some((v, i) => i < y.length - 1 && v === 0)) return '<em>Wegen der 0 geht das hier nicht.</em>'; reihe = y.slice(1).map((v, i) => v / y[i]); }
        else { reihe = y.slice(1).map((v, i) => v - y[i]); if (stufe === 2) reihe = reihe.slice(1).map((v, i) => v - reihe[i]); }
        if (!reihe.length) return '<em>Wirf dafür mehr benachbarte Zahlen ein.</em>';
        const gleich = reihe.every((v) => M.gleich(v, reihe[0]));
        return `<em>Bei dir: ${reihe.map((v) => (stufe === 3 ? '· ' : v > 0 ? '+' : '') + M.zahl(v)).join(', ')} – ${gleich ? (reihe.length > 1 ? 'alle gleich.' : 'wirf noch eine Nachbarzahl ein, um sicher zu sein.') : 'nicht alle gleich.'}</em>`;
      }
      function symmetrie() {
        const paare = [1, 2, 3].filter((x) => xs.has(x) && xs.has(-x));
        if (!paare.length) return '<em>Wirf dafür zum Beispiel 1 und −1 ein.</em>';
        return '<em>Bei dir: ' + paare.map((x) => `f(${x}) = ${wert(x)}, f(−${x}) = ${wert(-x)}`).join('; ') + '.</em>';
      }

      const buehne = U.buehne($('.bb-buehne'), {
        ohneW: true,
        rechne: (x) => M.wert(ziel, x),
        beiFertig(x, y) { xs.add(x); auswahl = x; U.ansage(`f(${M.zahl(x)}) = ${Number.isFinite(y) ? M.zahl(y) : 'nicht definiert'}`); aktualisiere(); },
        beiLauf(an) { FW.alleKnopf(U.$('.bb-unten [data-akt="alle"]', wurzel), an); },
      });
      buehne.setzeFarbe('var(--geheim)');
      const tf = U.termFeld($('.bb-term'), { name: 'f', platzhalter: 'deine Vermutung, z. B. 3x − 1', beiAenderung(b) { vermutung = b; aktualisiere(); }, beiEnter: () => pruefen() });
      const geheim = U.termFeld($('.bb-geheim'), { name: 'f', verdeckt: true, platzhalter: 'geheime Vorschrift', beiEnter: () => raetselStart() });
      const graph = new FW.Graph($('.bb-graph'), { beiPunkt(id) { auswahl = Number(id); aktualisiere(); } });
      const tabelle = U.tabelle($('.bb-tabelle'), { beiAuswahl(x) { auswahl = x; aktualisiere(); } });

      function meldung(text, art) { const m = $('.bb-meldung'); m.hidden = !text; m.innerHTML = text || ''; m.className = 'rueckmeldung bb-meldung' + (art ? ' ist-' + art : ''); }
      function neueMaschine(term, q) {
        ziel = M.lies(term);
        quelle = q;
        xs = new Set(); vermutung = null; versuche = 0; geloest = false; auswahl = null; benutzteHilfen.clear();
        tf.setze('', true);
        beutel = FW.zieheZahlen(true);
        $('.bb-hilfe-text').hidden = true;
        meldung('');
        aktualisiere();
      }
      function zufall() {
        const liste = jg === 'Mix' ? Object.values(POOL).flat() : POOL[jg];
        let t;
        do { t = liste[Math.floor(Math.random() * liste.length)]; } while (liste.length > 1 && t === letzte[jg]);
        letzte[jg] = t;
        neueMaschine(t, jg === 'Mix' ? 'Pool: gemischt' : `Pool: ${jg === 'E' ? 'Einführungsphase' : 'Jahrgang ' + jg}`);
      }
      function pruefen() {
        if (geloest) return;
        if (!vermutung) { meldung('Trag zuerst eine Vermutung als Term ein.', 'noch'); return; }
        if (!xs.size) { meldung('Wirf zuerst ein paar Zahlen ein und schau dir die Ausgaben an.', 'noch'); return; }
        versuche++;
        const f = M.fn(ziel), g = M.fn(vermutung);
        const gezogen = [...xs];
        const passt = gezogen.filter((x) => M.gleich(f(x), g(x)) || (!Number.isFinite(f(x)) && !Number.isFinite(g(x)))).length;
        const ueberall = M.vergleiche(f, g, [-5, -3.5, -2, -1.5, -0.5, 0, 0.25, 1, 1.5, 2.5, 3, 4, 7].concat(gezogen)).gleich;
        if (ueberall) {
          geloest = true;
          meldung(`Geknackt nach ${versuche} ${versuche === 1 ? 'Versuch' : 'Versuchen'}! Die Vorschrift lautet ${M.html(ziel)}${M.text(ziel) !== M.text(vermutung) ? `, und deine Schreibweise ${M.html(vermutung)} bedeutet dasselbe` : ''}.`, 'gut');
        } else if (passt === gezogen.length) {
          meldung('Deine Vermutung passt zu allen eingeworfenen Zahlen, aber nicht überall. Wirf weitere Zahlen ein, auch negative oder größere.', 'noch');
        } else {
          meldung(`Deine Vermutung passt bei ${passt} von ${gezogen.length} eingeworfenen Zahlen. In der Tabelle siehst du, wo sie abweicht.`, 'falsch');
        }
        aktualisiere();
      }
      function raetselStart() {
        if (!geheim.baum) { geheim.fokus(); return; }
        const b = geheim.baum;
        if (![-2, -1, 0, 1, 2, 3].some((x) => Number.isFinite(M.wert(b, x)))) return;
        $('.bb-dialog').hidden = true;
        const text = geheim.text;
        geheim.setze('', true);
        neueMaschine(text, 'Rätsel der Lehrkraft');
      }

      function aktualisiere() {
        U.$$('.bb-jg .chip', wurzel).forEach((c) => c.setAttribute('aria-pressed', c.dataset.jg === jg && quelle !== 'Rätsel der Lehrkraft' ? 'true' : 'false'));
        $('.bb-quelle').textContent = quelle;
        $('.bb-versuche').textContent = versuche ? `${versuche} ${versuche === 1 ? 'Versuch' : 'Versuche'}` : '';
        buehne.setzeMaschine(geloest ? FW.maschinenFenster('f', ziel) : '<span class="mf-name">f</span><span class="mf-geheim">?</span>', !geloest);
        buehne.setzeBeutel(beutel, xs);
        const f = M.fn(ziel);
        buehne.setzeAusgaben([...xs].map(f));
        buehne.markiere(auswahl, auswahl != null ? f(auswahl) : NaN);
        $('.bb-hilfe-knoepfe').innerHTML = HILFEN.map((h, i) => `<button type="button" class="chip${benutzteHilfen.has(i) ? ' ist-benutzt' : ''}" data-hilfe="${i}">${h.t}</button>`).join('');
        const g = vermutung ? M.fn(vermutung) : null;
        const serien = [];
        if (geloest) serien.push({ fn: f, farbe: 'var(--geheim)', breite: 4 });
        if (g) serien.push({ fn: g, farbe: 'var(--vermutung)', breite: 3, strich: '9 7' });
        const punkte = [...xs].map((x) => ({ x, y: f(x), farbe: 'var(--geheim)', id: String(x) }));
        // π-Achse nur nach der eigenen Vermutung oder nach dem Auflösen, damit sie nichts verrät
        graph.zeichne({ serien, punkte, xWerte: beutel, auswahl: auswahl != null ? String(auswahl) : null, piAchse: M.hatTrig(vermutung) || (geloest && M.hatTrig(ziel)) });
        $('.bb-legende').innerHTML = '<span class="leg"><span class="leg-punkt" style="background:var(--geheim)"></span>eingeworfen</span>' +
          (g ? `<span class="leg"><span class="leg-strich gestrichelt" style="--lf:var(--vermutung)"></span>Vermutung ${M.html(vermutung)}</span>` : '') +
          (geloest ? `<span class="leg"><span class="leg-strich" style="background:var(--geheim)"></span><span class="term"><i>f</i>(<i>x</i>) = </span>${M.html(ziel)}</span>` : '');
        const zeilen = [{ name: '<i>f</i>(<i>x</i>)', farbe: 'var(--geheim)', wert: f }];
        if (g && versuche) zeilen.push({ name: 'Vermutung', farbe: 'var(--vermutung)', wert: g, klasse: (x) => (M.gleich(f(x), g(x)) || (!Number.isFinite(f(x)) && !Number.isFinite(g(x))) ? 'ist-gut' : 'ist-falsch') });
        tabelle.setze({
          xs: [...xs].sort((a, b) => a - b), zeilen, auswahl: auswahl != null ? { x: auswahl, zeile: 0 } : null,
          diff: $('#bb-diff').checked, quot: $('#bb-quot').checked, leer: 'Wirf Zahlen ein und beobachte, was herauskommt.',
        });
        wurzel.dispatchEvent(new CustomEvent('fw-stand', { bubbles: true }));
      }

      function zeigeHilfe(i) {
        const H = HILFEN[i];
        benutzteHilfen.add(i);
        if (H.schalter) $('#' + H.schalter).checked = true;
        const t = $('.bb-hilfe-text');
        t.hidden = false; t.innerHTML = `<b>${H.t}:</b> ${H.text()}`;
        aktualisiere();
      }
      wurzel.addEventListener('change', (e) => { if (e.target.id === 'bb-diff' || e.target.id === 'bb-quot') aktualisiere(); });
      wurzel.addEventListener('click', async (e) => {
        const j = e.target.closest('.bb-jg .chip');
        if (j) { jg = j.dataset.jg; zufall(); return; }
        const h = e.target.closest('[data-hilfe]');
        if (h) { zeigeHilfe(Number(h.dataset.hilfe)); return; }
        const a = e.target.closest('[data-akt]');
        if (!a) return;
        const akt = a.dataset.akt;
        if (akt === 'neu') zufall();
        if (akt === 'raetsel') { $('.bb-dialog').hidden = false; geheim.fokus(); }
        if (akt === 'raetselZu') { $('.bb-dialog').hidden = true; geheim.setze('', true); }
        if (akt === 'raetselStart') raetselStart();
        if (akt === 'pruefen') pruefen();
        if (akt === 'aufloesen' && !geloest) { geloest = true; meldung(`Die Vorschrift lautet ${M.html(ziel)}.`, 'noch'); aktualisiere(); }
        if (akt === 'leeren') { xs.clear(); auswahl = null; aktualisiere(); }
        if (akt === 'alle') {
          if (buehne.beschaeftigt) { buehne.ueberspringen(); return; }
          await FW.alleEinwerfen(buehne, beutel.filter((x) => !xs.has(x)));
        }
      });
      this.neueZahlen = () => { beutel = FW.zieheZahlen(true); xs.clear(); auswahl = null; aktualisiere(); };
      // Für die Einführung (js/einfuehrung-blackbox.js): eine feste geheime Maschine aus dem Pool von Jahrgang 7
      this.einfuehrung = {
        zuruecksetzen() {
          jg = '7'; $('#bb-diff').checked = false; $('#bb-quot').checked = false; $('.bb-dialog').hidden = true;
          neueMaschine('3x + 2', 'Pool: Jahrgang 7');
          beutel = [-3, -2, -1, 0, 1, 2, 3, 4, 5, 6, 7, 8];
          aktualisiere();
        },
        get stand() { return { xs: [...xs], ziel, vermutung, versuche, geloest, hilfen: [...benutzteHilfen], diff: $('#bb-diff').checked }; },
        async einwerfen(liste) {
          const tempo = U.tempo;
          U.tempo = tempo ? 0.5 : 0;
          for (const x of liste) await buehne.einwerfen(x);
          U.tempo = tempo;
        },
        hilfe: (i) => zeigeHilfe(i),
        vermute(text) { tf.setze(text); },
        pruefe: () => pruefen(),
      };
      zufall();
    },
  };
})(window.FW = window.FW || {});

</script>
<script >

  const punkt = (x, y) => [(f) => M.gleich(f(x), y), `Die Maschine muss ${M.zahl(x)} auf ${M.zahl(y)} abbilden. Bei dir: f(${M.zahl(x)}) = ${'{f' + x + '}'}.`];

  const AUFGABEN = [

        : M.vergleiche(f, g).gleich ? nein('Beide Maschinen rechnen gleich. Sie sollen verschieden sein.') : ok('Stimmt! Zwei verschiedene Maschinen, beide bilden 3 auf 10 ab.')),
      tipp: 'Probiere eine Maschine mit + und eine mit ·, zum Beispiel x + … und 3x + … .', loesung: `Zum Beispiel ${H('x + 7')} und ${H('3x + 1')}, oder ${H('x² + 1')}.` },

    { jg: '9', titel: 'Zwei Eingaben', art: 'zahlen', soll: [3, -5],
      auftrag: 'Die Maschine rechnet „+ 1, dann quadrieren“ und gibt 16 aus. Welche Zahlen können eingeworfen worden sein?',

    { jg: '9', titel: 'Gleichsetzen', art: 'zahlen', soll: [-1, 3], graph: ['x²', '2x + 3'],

    { jg: '9', titel: 'Hintereinander', art: 'zahlenFest', soll: [25, 11], felder: ['g(f(3))', 'f(g(3))'],

    // Jahrgang 10
    { jg: '10', titel: 'Verdoppeln', art: 'term', punkte: [[0, 3], [1, 6], [2, 12]],

    { jg: '10', titel: 'Prozentuales Wachstum', art: 'zahl', soll: 242,

    { jg: 'E', titel: 'Umkehrmaschine', art: 'term', name: 'f⁻¹', graph: ['2x − 6'],

      auftrag: `Die Maschinen ${H('x²')} und ${H('−2x')} werden addiert. Bei welchem x gibt die Summe ${H('x² − 2x')} den kleinsten Wert aus?`,

    { jg: 'E', titel: 'V-Form', art: 'term', punkte: [[2, 0]],
      auftrag: 'Baue mit dem Betrag eine Maschine, deren Graph ein V mit der Spitze in (2 | 0) ist.',

  AUFGABEN.forEach((a, i) => { a.nr = i + 1; });
  const JG_NAME = { 7: 'Jg. 7', 8: 'Jg. 8', 9: 'Jg. 9', 10: 'Jg. 10', E: 'E-Phase' };

  FW.modi.aufgaben = {
    titel: 'Aufgaben',
    baue(wurzel) {
      wurzel.innerHTML = `<div class="raster raster-aufgaben">

      const $ = (s) => U.$(s, wurzel);

      const geloest = new Set();
      const graph = new FW.Graph($('.af-graph'));

      function liste() {

      const gefiltert = () => AUFGABEN.filter((a) => filter === 'alle' || a.jg === filter);
      function karte() {
        const a = aktuell;
        let antwort = '';
        if (a.art === 'term') antwort = '<div class="af-t1"></div>';
        if (a.art === 'zweiTerme') antwort = '<div class="af-t1"></div><div class="af-t2"></div>';

            <button type="button" class="knopf" data-akt="weiter">Nächste Karte →</button></div>

        felder = [];

      }
      function zeichne() {

          const farbe = i ? 'var(--g)' : 'var(--f)';

        graph.zeichne({ serien, marken, fenster, quadratisch: Math.max(...ys.map(Math.abs), 0) < 20, piAchse: trig });

<script >
/* Funktionswerkstatt · Einführung für Lernende

   erlaubten Stellen werden abgefangen, damit niemand aus Versehen den Bereich wechselt.
   Touren je Modus: FW.einfuehrung.touren[modus] = { titel, dauer, vorbereiten(api), schritte: [ … ] }
   Schritt: titel, text (HTML oder fn(stand)), ziele [Selektoren], zeiger (Selektor oder fn(wurzel, stand)),
   aufgabe (Text oder fn(stand)), erlaubt (Selektor), fertig(stand), vormachen(api, stand), beimStart(api, stand),

(function (FW) {

  const wurzelVon = (modus) => U.$(`.modus[data-modus="${modus}"]`);
  const sichtbar = (r) => r && r.width > 2 && r.height > 2;
  /** sichtbarer Teil eines Elements: beschnitten von Karten, die selbst scrollen (kleine Bildschirme) */
  function sichtRechteck(el) {

  // ---------------------------------------------------------------------------
  // Willkommenskarte beim Start
  // ---------------------------------------------------------------------------
  E.willkommen = function (modus) {
    const T = E.touren[modus];

    const k = U.el(`<div class="ef-start" role="dialog" aria-modal="true" aria-labelledby="ef-start-titel">
      <div class="karte ef-start-k">
        <svg class="ef-start-bild" viewBox="0 0 120 64" aria-hidden="true">
          <rect x="34" y="10" width="52" height="44" rx="10" fill="#E9DED0" stroke="#3E3631" stroke-width="3"/>
          <rect x="34" y="10" width="52" height="10" rx="5" fill="#D9594F"/>
          <rect x="44" y="27" width="32" height="17" rx="4" fill="#fff" stroke="#3E3631" stroke-width="2"/>
          <path d="M8 36h22M90 36h22" stroke="#3E3631" stroke-width="3.5" stroke-linecap="round"/>
          <circle cx="10" cy="36" r="8" fill="#3D6A99"/><text x="10" y="40.5" text-anchor="middle" font-size="12" font-weight="800" fill="#fff">3</text>
          <circle cx="110" cy="36" r="8" fill="#3F8A57"/><text x="110" y="40.5" text-anchor="middle" font-size="12" font-weight="800" fill="#fff">7</text>
          <text x="60" y="40" text-anchor="middle" font-size="11" font-weight="800" fill="#3E3631">·2  +1</text>

        <div class="ef-start-knoepfe">
          <button type="button" class="knopf haupt" data-ef="los">Einführung starten</button>

      <div class="ef-hinweis-knoepfe"><button type="button" class="knopf klein haupt" data-ef="los">Einführung starten</button><button type="button" class="knopf klein" data-ef="zu">Nein danke</button></div></div>`);

  // Tour
  // ---------------------------------------------------------------------------

    if (!T || !api) return;

    E.schliesseHinweis();
    if (T.vorbereiten) T.vorbereiten(api);
    const el = U.el(`<div class="ef">
      <svg class="ef-schleier" aria-hidden="true"></svg>
      <div class="ef-zeiger" aria-hidden="true" hidden></div>
      <section class="ef-blase" role="dialog" aria-labelledby="ef-titel" tabindex="-1">
        <div class="ef-kopf"><span class="ef-nr"></span><button type="button" class="ef-zu" aria-label="Einführung beenden" title="Einführung beenden (Esc)">✕</button></div>
        <div class="ef-balken" aria-hidden="true"><span></span></div>
        <h2 id="ef-titel"></h2>
        <div class="ef-text"></div>
        <div class="ef-merke" hidden></div>
        <p class="ef-aufgabe" aria-live="polite" hidden></p>
        <div class="ef-knoepfe">
          <button type="button" class="knopf klein ef-zeig" hidden>Zeig es mir</button>
          <span class="ef-luecke"></span>
          <button type="button" class="knopf ef-zurueck">Zurück</button>
          <button type="button" class="knopf haupt ef-weiter">Weiter</button>
        </div>
      </section></div>`);
    document.body.appendChild(el);
    lauf = { modus, T, api, el, i: -1, ort: null, schluessel: '', zeigt: false, raf: 0 };

  E.beende = function () {

  };
  Object.defineProperty(E, 'laeuft', { get: () => !!lauf });

  const schritt = () => lauf.T.schritte[lauf.i];
  const wert = (v, stand) => (typeof v === 'function' ? v(stand) : v);

  function zuSchritt(i) {
    const S = lauf.T.schritte;

    lauf.basis = lauf.api.stand;

    U.$('.ef-balken span', b).style.width = `${((lauf.i + 1) / S.length) * 100}%`;
    U.$('#ef-titel', b).textContent = s.titel;

    const vorher = lauf.erledigt;
    lauf.erledigt = ok;

  // ---------------------------------------------------------------------------
  // Schleier, Zeiger und Sprechblase an die Ziele heften (jedes Bild neu, falls sich etwas verschiebt)
  // ---------------------------------------------------------------------------
  function schleife() {
    if (!lauf) return;

  function zeichne(neu) {

      `<rect class="ef-dunkel" width="${vw}" height="${vh}" mask="url(#${id})"/>` +
      loecher.map((r) => `<rect class="ef-loch" x="${r.l}" y="${r.o}" width="${r.b}" height="${r.h}" rx="20"/>`).join('');

  /** Sprechblase dorthin, wo sie keine hellen Stellen verdeckt; bleibt stehen, solange ihr Platz frei ist */
  function platziere(loecher, z) {

  // ---------------------------------------------------------------------------
  // Bedienung
  // ---------------------------------------------------------------------------
  async function klickInBlase(e) {

      const i = lauf.i;
      await schritt().vormachen(lauf.api, lauf.api.stand);
      if (lauf && lauf.i === i) { zeig.disabled = false; pruefe(); }
    }
  }

  /** Klicks nur in der Sprechblase und an den erlaubten Stellen des Schritts */
  function filter(e) {

  function start() {
    const nav = U.$('.modi'), inhalt = U.$('.inhalt');
    nav.innerHTML = REIHE.map((m, i) => `<button type="button" role="tab" data-modus="${m}" title="${FW.modi[m].titel} (Taste ${i + 1})">
      <svg viewBox="0 0 24 24" aria-hidden="true">${ICON[m]}</svg><span>${FW.modi[m].titel}</span></button>`).join('');
    const gebaut = {};
    let aktuell = null;
    function zeige(name, still) {
      if (!FW.modi[name]) name = 'maschine';
      REIHE.forEach((m) => { const c = U.$(`.modus[data-modus="${m}"]`); if (c) c.hidden = m !== name; });
      const erstesMal = !gebaut[name];
      if (erstesMal) {
        const c = U.el(`<div class="modus" data-modus="${name}"></div>`);
        inhalt.appendChild(c);
        FW.modi[name].baue(c);
        gebaut[name] = true;
      } else if (FW.modi[name].zeige) FW.modi[name].zeige();
      U.$$('button', nav).forEach((b) => b.setAttribute('aria-selected', b.dataset.modus === name ? 'true' : 'false'));
      U.$('.kopf-hilfe').hidden = !(FW.einfuehrung && FW.einfuehrung.touren[name]);
      // beim ersten Besuch eines weiteren Bereichs die Einführung anbieten (der erste Bereich bekommt die Willkommenskarte)
      if (FW.einfuehrung) { if (erstesMal && aktuell) FW.einfuehrung.hinweis(name); else FW.einfuehrung.schliesseHinweis(); }
      aktuell = name;
      document.body.className = 'modus-' + name;
      if (!still) history.replaceState(null, '', '#' + name);
      document.title = `Funktionswerkstatt · ${FW.modi[name].titel}`;
    }
    nav.addEventListener('click', (e) => { const b = e.target.closest('[data-modus]'); if (b) zeige(b.dataset.modus); });
    document.addEventListener('keydown', (e) => {
      if (e.metaKey || e.ctrlKey || e.altKey || /input|textarea|select/i.test(e.target.tagName)) return;
      const i = Number(e.key) - 1;
      if (i >= 0 && i < REIHE.length) zeige(REIHE[i]);
      if (e.key === 'Escape') { U.$('.einst').hidden = true; }
    });
    window.addEventListener('hashchange', () => zeige(location.hash.slice(1), true));

    // Einführung (js/einfuehrung.js): Fragezeichen oben; beim Start der Werkstatt wird sie angeboten
    U.$('.kopf-hilfe').addEventListener('click', () => FW.einfuehrung.starte(aktuell));

    // Einstellungen
    const einst = U.$('.einst');
    U.$('.kopf-einst').addEventListener('click', () => {
      U.$('#e-von').value = FW.einstellungen.von;
      U.$('#e-bis').value = FW.einstellungen.bis;
      U.$('#e-anzahl').value = FW.einstellungen.anzahl;
      U.$('#e-tempo').value = String(U.tempo);
      einst.hidden = false;
    });
    einst.addEventListener('click', (e) => {
      const a = e.target.closest('[data-akt]');
      if (!a) return;
      if (a.dataset.akt === 'zu') einst.hidden = true;
      if (a.dataset.akt === 'ok') {
        let von = Math.round(U.zahlLesen(U.$('#e-von').value)), bis = Math.round(U.zahlLesen(U.$('#e-bis').value));
        const meld = U.$('.einst-meldung');
        if (!Number.isFinite(von) || !Number.isFinite(bis)) { meld.textContent = 'Bitte ganze Zahlen eintragen.'; return; }
        if (von > bis) [von, bis] = [bis, von];
        if (bis - von < 3) { meld.textContent = 'Der Bereich braucht mindestens vier Zahlen.'; return; }
        if (Math.max(Math.abs(von), Math.abs(bis)) > 1000) { meld.textContent = 'Bitte Zahlen zwischen −1000 und 1000.'; return; }
        meld.textContent = '';
        FW.einstellungen = { von, bis, anzahl: Number(U.$('#e-anzahl').value) };
        U.tempo = Number(U.$('#e-tempo').value);
        REIHE.forEach((m) => { if (gebaut[m] && FW.modi[m].neueZahlen) FW.modi[m].neueZahlen(); });
        einst.hidden = true;
      }
    });
    zeige(location.hash.slice(1) || 'maschine', true);
    if (FW.einfuehrung && FW.einfuehrung.touren[aktuell]) FW.einfuehrung.willkommen(aktuell);
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', start); else start();
})(window.FW = window.FW || {});

</script>
</body>
</html>
