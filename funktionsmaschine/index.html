<!doctype html>
<html lang="de">
<head>
<meta name="robots" content="noindex, nofollow">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Funktionswerkstatt</title>
<!-- Funktionswerkstatt: Funktionen als Maschinen erkunden (Jg. 7 bis E). Läuft ohne Internet; Aufbau in js/werkstatt.js. -->
<style>
/* Funktionswerkstatt · Gestaltung im Stil der Schiller-App: warme Töne, Systemschrift, alles auf einen Blick am Beamer. */
:root {
  --app: #FBF7F1; --karte: #FFFDF9; --soft: #F1E9DE; --linie: #E7DDD0; --ink: #3E3631; --muted: #8E7F72; --leise: #6E6158;
  --rot: #D9594F; --gold: #F2B04A; --gold-d: #A86B0C;
  --f: #3D6A99; --g: #8A5BB8; --h: #3F8A57; --vermutung: #D08A1E; --geheim: #D9594F; --vergleich: #A89A8C;
  --gut-s: #E1EFE3; --gut-d: #2F6B3F; --falsch-s: #FBE4DF; --falsch-d: #9A352D; --noch-s: #FBEFD9; --noch-d: #8A5A12;
  --font: ui-rounded, "SF Pro Rounded", "Segoe UI", -apple-system, "Helvetica Neue", Arial, sans-serif;
  --r: 18px; --schatten: 0 10px 24px -18px rgba(62, 54, 49, .55);
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--app); color: var(--ink); font: 16px/1.4 var(--font); -webkit-text-size-adjust: 100%; }
button, input, select { font: inherit; color: inherit; }
[hidden] { display: none !important; }
.unsichtbar { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }

/* ---------- Rahmen ---------- */
.app { display: grid; grid-template-rows: auto minmax(0, 1fr); height: 100vh; }
.kopf { display: flex; align-items: center; gap: 14px; padding: 8px 14px; border-bottom: 1px solid var(--linie); }
.marke { display: flex; align-items: center; gap: 9px; font-weight: 800; font-size: 19px; white-space: nowrap; }
.marke-bild { width: 40px; height: 32px; }
.modi { min-width: 0; display: flex; gap: 3px; background: var(--soft); border-radius: 999px; padding: 4px; margin: 0 auto; overflow-x: auto; max-width: 100%; }
.modi button { border: 0; background: transparent; border-radius: 999px; padding: 7px 13px; font-weight: 700; color: var(--leise); display: flex; align-items: center; gap: 6px; cursor: pointer; white-space: nowrap; }
.modi button svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.modi button:hover { background: rgba(255, 255, 255, .6); }
.modi button[aria-selected="true"] { background: var(--ink); color: #FFF4E6; }
.kopf-einst svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; }
.inhalt { min-height: 0; overflow: auto; padding: 12px 14px 14px; }
.modus { height: 100%; }

/* ---------- Raster der Modi (Beamer: ein Bildschirm ohne Scrollen) ---------- */
.raster { display: grid; gap: 12px; height: 100%; min-height: 600px; }
.raster-maschine { grid-template-columns: minmax(0, 1.12fr) minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr) auto; grid-template-areas: "a graph" "b graph" "tab tab"; }
.raster-blackbox { grid-template-columns: minmax(0, 1.12fr) minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr) auto auto; grid-template-areas: "a graph" "b graph" "b hilfe" "tab tab"; }
.raster-blackbox .k-hilfen { grid-area: hilfe; }
.raster-blackbox .graph-kasten { min-height: 170px; }
.raster-blackbox .bb-hilfe-text { font-size: 14px; }
.raster-blackbox .wt td { padding: 3px 8px; font-size: 16px; }
.raster-blackbox .wt th { font-size: 15px; padding-top: 3px; padding-bottom: 3px; }
.raster-blackbox .wt .wt-diff td { padding: 2px 4px; }
.buehne.ohne-w { grid-template-columns: minmax(0, 1.7fr) minmax(220px, 1fr); }
.buehne.ohne-w > .b-sp:nth-child(3) { display: none; }
.buehne.ohne-w .b-beutel { min-height: 0; }
.raster-maschine .k-buehne, .raster-blackbox .k-buehne { grid-area: a; }
.raster-maschine .k-editor, .raster-blackbox .k-vermutung { grid-area: b; }
.raster-verkn { grid-template-columns: minmax(0, 1.12fr) minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr) auto; grid-template-areas: "a graph" "b graph" "tab tab"; }
.raster-verkn .k-def { grid-area: a; } .raster-verkn .k-kette { grid-area: b; }
.raster-regler { grid-template-columns: minmax(330px, .8fr) minmax(0, 1.35fr); grid-template-rows: minmax(0, 1fr) auto; grid-template-areas: "a graph" "a tab"; }
.raster-regler .k-regler { grid-area: a; }
.raster-rueck { grid-template-columns: minmax(0, 1.12fr) minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr); grid-template-areas: "a graph" "b graph"; }
.raster-rueck .k-masch { grid-area: a; } .raster-rueck .k-rueck { grid-area: b; }
.raster-aufgaben { grid-template-columns: minmax(240px, .62fr) minmax(0, 1.1fr) minmax(0, 1fr); grid-template-rows: minmax(0, 1fr); grid-template-areas: "a b graph"; }
.raster-aufgaben .k-liste { grid-area: a; } .raster-aufgaben .k-aufgabe { grid-area: b; }
.k-graph { grid-area: graph; }
.k-tabelle { grid-area: tab; }

/* ---------- Karten, Knöpfe, Chips ---------- */
.karte { background: var(--karte); border-radius: var(--r); box-shadow: var(--schatten); padding: 12px 14px; min-width: 0; min-height: 0; display: flex; flex-direction: column; gap: 9px; overflow: auto; }
.karte > * { flex-shrink: 0; }
.karte > .graph-kasten, .karte > .af-liste { flex-shrink: 1; }
.k-buehne { min-height: min-content; }   /* die Maschine nie zusammendrücken; lieber scrollen die anderen Karten */
.k-kopf { display: flex; align-items: center; gap: 8px 10px; flex-wrap: wrap; }
.k-kopf h2 { font-size: 16px; margin: 0; }
.k-aktionen { margin-left: auto; display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.k-tipp { color: var(--muted); font-size: 13px; }
.knopf { border: 0; border-radius: 999px; padding: 7px 14px; font-weight: 700; background: var(--soft); color: #5E5249; cursor: pointer; white-space: nowrap; }
.knopf:hover { background: #E9DFD2; }
.knopf.haupt { background: var(--rot); color: #fff; box-shadow: 0 8px 16px -12px rgba(217, 89, 79, .9); }
.knopf.haupt:hover { background: #C94E45; }
.knopf.klein { padding: 4px 10px; font-size: 14px; }
.knopf.rund { width: 36px; height: 36px; padding: 0; display: inline-grid; place-items: center; font-size: 18px; }
.knopf.rund.klein { width: 30px; height: 30px; font-size: 16px; }
.knopf:disabled { opacity: .5; cursor: default; }
.chips { display: flex; flex-wrap: wrap; gap: 5px; }
.chip, .fam { border: 0; border-radius: 999px; padding: 6px 12px; background: var(--soft); font-weight: 700; font-size: 14px; color: var(--leise); cursor: pointer; white-space: nowrap; }
.chip[aria-pressed="true"], .fam[aria-selected="true"] { background: var(--ink); color: #FFF4E6; }
.chip.ist-benutzt { box-shadow: inset 0 0 0 2px var(--gold); }
.slots { display: flex; gap: 5px; }
.slot { width: 44px; height: 34px; border-radius: 999px; border: 2px solid var(--sf); background: #fff; color: var(--sf); font-weight: 800; font-style: italic; font-size: 18px; cursor: pointer; }
.slot[aria-pressed="true"] { background: var(--sf); color: #fff; }
.schalter { display: inline-flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 700; color: var(--leise); cursor: pointer; padding: 4px 11px 4px 8px; background: var(--soft); border-radius: 999px; white-space: nowrap; }
.schalter input { accent-color: var(--rot); width: 16px; height: 16px; margin: 0; }
.zahlfeld { width: 86px; font-size: 18px; font-weight: 800; text-align: center; border: 2px solid var(--linie); border-radius: 10px; padding: 5px; background: #fff; }
.zahlfeld:focus { outline: none; border-color: var(--f); }
.rueckmeldung { margin: 0; padding: 8px 12px; border-radius: 12px; font-weight: 700; line-height: 1.45; }
.ist-gut { background: var(--gut-s); color: var(--gut-d); }
.ist-falsch { background: var(--falsch-s); color: var(--falsch-d); }
.ist-noch { background: var(--noch-s); color: var(--noch-d); }
.bb-knoepfe { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }

/* ---------- Mathematik wie im Heft ---------- */
sup { font-size: .68em; vertical-align: .6em; line-height: 0; }
sub { font-size: .68em; vertical-align: -.25em; line-height: 0; }
.term { white-space: nowrap; }
.term i, i.var, .r-form i, .vk-l i { font-style: italic; }
.term sup { font-size: .68em; vertical-align: .6em; line-height: 0; margin-left: .03em; }
.term sub { font-size: .68em; vertical-align: -.25em; line-height: 0; }
.bruch { display: inline-flex; flex-direction: column; vertical-align: middle; text-align: center; font-size: .9em; line-height: 1.15; margin: 0 .12em; }
.bruch .z { border-bottom: 1.6px solid currentColor; padding: 0 .25em .06em; }
.bruch .n { padding: .06em .25em 0; }
.wurzel { white-space: nowrap; }
.wurzel .wz { margin-right: .03em; }
.wurzel .rad { border-top: 1.6px solid currentColor; padding: .06em .1em 0 .06em; }
.wurzel .wi { font-size: .55em; vertical-align: .9em; margin-right: -.35em; }
.betrag { padding: 0 .05em; }
/* e und π aufrecht (Konstanten, keine Variablen); sin, cos, tan, ln aufrecht mit etwas Luft davor */
.konst { font-style: normal; }
.fkt { font-style: normal; margin-left: .08em; }
.term > .fkt:first-child { margin-left: 0; }

/* ---------- Termfeld, Tastenfeld, Baukasten, Editor ---------- */
.termfeld { display: flex; flex-direction: column; gap: 6px; }
.tf-zeile { display: flex; align-items: center; gap: 8px; }
.tf-name { font-size: 18px; font-weight: 800; font-style: italic; white-space: nowrap; }
.tf-ein { flex: 1; min-width: 0; font-size: 20px; font-weight: 700; padding: 7px 12px; border: 2px solid var(--linie); border-radius: 12px; background: #fff; }
.tf-ein:focus { outline: none; border-color: var(--f); box-shadow: 0 0 0 3px rgba(61, 106, 153, .15); }
.ist-fehler .tf-ein { border-color: var(--rot); }
.ist-verdeckt .tf-ein { -webkit-text-security: disc; }
.tf-meldung { color: var(--falsch-d); font-size: 13px; font-weight: 700; min-height: 0; }
.tf-meldung:empty { display: none; }
.tasten { display: flex; flex-wrap: wrap; gap: 5px; }
.taste { min-width: 40px; height: 36px; padding: 0 8px; border: 0; border-radius: 10px; background: var(--soft); font-weight: 700; font-size: 17px; cursor: pointer; }
.taste:hover { background: #E9DFD2; }
.taste:active { transform: translateY(1px); }
.taste-weg { background: #EADFD2; }
.tasten-umbruch { flex-basis: 100%; height: 0; }
.tasten:not(.mit-fkt) .taste-fkt, .tasten:not(.mit-fkt) .tasten-umbruch { display: none; }
.taste-mehr { font-size: 14px; color: var(--leise); background: #F6F0E8; box-shadow: inset 0 0 0 1.5px var(--soft); }
.taste-mehr[aria-expanded="true"] { background: var(--ink); color: #FFF4E6; box-shadow: none; }
.taste-fkt { font-size: 15px; background: #F6F0E8; box-shadow: inset 0 0 0 1.5px var(--soft); }
.taste sup { font-size: .7em; vertical-align: .55em; line-height: 0; }
.editor { display: flex; flex-direction: column; gap: 8px; }
.umschalter { display: inline-flex; align-self: flex-start; background: var(--soft); border-radius: 999px; padding: 3px; }
.umschalter button { border: 0; background: transparent; border-radius: 999px; padding: 5px 15px; font-weight: 700; color: var(--leise); cursor: pointer; }
.umschalter [aria-selected="true"] { background: #fff; color: var(--ink); box-shadow: 0 2px 6px rgba(0, 0, 0, .08); }
.ed-hinweis { margin: 0; background: var(--noch-s); color: var(--noch-d); border-radius: 10px; padding: 6px 10px; font-size: 14px; font-weight: 600; }
.baukasten { display: flex; flex-direction: column; gap: 8px; }
.bk-kette { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
.bk-ende { font-weight: 800; font-size: 19px; }
.bk-pfeil { color: var(--muted); }
.bk-chip { border: 2px solid var(--linie); background: #fff; border-radius: 12px; padding: 5px 12px; font-weight: 800; font-size: 19px; cursor: pointer; min-width: 54px; white-space: nowrap; }
.bk-chip sup, .mf-chip sup, .rw-vor sup, .rw-zur sup, .rk-schritt sup { font-size: .65em; vertical-align: .55em; line-height: 0; }
.bk-chip.ist-gewaehlt { border-color: var(--f); box-shadow: 0 0 0 3px rgba(61, 106, 153, .18); }
.bk-plus { width: 42px; height: 40px; border-radius: 12px; border: 2px dashed var(--muted); background: transparent; font-size: 22px; font-weight: 700; cursor: pointer; color: var(--muted); }
.bk-plus:hover { border-color: var(--f); color: var(--f); }
.bk-bearbeiten { background: var(--app); border-radius: 14px; padding: 8px 10px; }
.bk-bearbeiten.ist-leer { background: none; padding: 0 2px; }
.bk-zeile { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.bk-zeile + .bk-zeile { margin-top: 6px; }
.bk-nr { font-size: 12px; font-weight: 800; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; min-width: 66px; }
.bk-ops { display: flex; flex-wrap: wrap; gap: 4px; }
.bk-op { min-width: 40px; height: 34px; border: 0; border-radius: 9px; background: var(--soft); font-weight: 800; font-size: 16px; cursor: pointer; }
.bk-op sup { font-size: .65em; }
.bk-op.ist-an { background: var(--ink); color: #fff; }
.bk-wert { display: flex; align-items: center; gap: 4px; }
.bk-wert input { width: 72px; text-align: center; font-weight: 800; font-size: 18px; border: 2px solid var(--linie); border-radius: 10px; padding: 3px; background: #fff; }
.bk-pm { width: 32px; height: 32px; border-radius: 50%; border: 0; background: var(--soft); font-weight: 800; cursor: pointer; font-size: 18px; }
.bk-hinweis { color: var(--falsch-d); font-size: 13px; font-weight: 700; }
.bk-e { border: 0; border-radius: 999px; background: var(--soft); font-weight: 800; padding: 5px 11px; cursor: pointer; color: var(--leise); }
.bk-e.ist-an { background: var(--ink); color: #fff; }
.bk-weg { margin-left: auto; border: 0; background: transparent; color: var(--falsch-d); font-weight: 700; cursor: pointer; font-size: 14px; }
.bk-tipp { margin: 0; color: var(--muted); font-size: 14px; }

/* ---------- Bühne: Beutel → Maschine → Wertemenge ---------- */
.buehne { --mf: var(--f); position: relative; display: grid; grid-template-columns: minmax(150px, 1fr) minmax(250px, 1.5fr) minmax(130px, 1fr); gap: 10px; }
.b-sp { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
.b-titel { font-size: 12px; font-weight: 800; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
.b-titel i { text-transform: none; }
.b-beutel { flex: 1; position: relative; background: var(--soft); border-radius: 16px 16px 44px 44px; padding: 14px 10px 16px; min-height: 120px; }
.b-beutel::before { content: ""; position: absolute; top: -5px; left: 50%; width: 46%; height: 10px; transform: translateX(-50%); background: #E2D5C5; border-radius: 999px; }
.b-beutel-aus { background: #F7EFE6; border: 2px dashed #E2D5C5; }
.b-chips { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; align-content: flex-start; }
.b-chip { min-width: 42px; height: 40px; padding: 0 9px; border-radius: 999px; border: 0; background: var(--mf); color: #fff; font-weight: 800; font-size: 17px; cursor: pointer; display: inline-grid; place-items: center; transition: transform .15s, opacity .15s; }
.b-chip:hover { transform: translateY(-2px); }
.b-chip.ist-benutzt { background: #fff; color: var(--mf); box-shadow: inset 0 0 0 2px var(--mf); }
.b-chip.ist-unterwegs { opacity: .25; }
.b-chip-aus { background: #fff; color: var(--ink); box-shadow: inset 0 0 0 2px var(--mf); cursor: default; }
.b-chip-aus:hover { transform: none; }
.b-chip.ist-markiert { box-shadow: 0 0 0 3px var(--gold); transform: scale(1.08); }
.b-chip-aus.ist-neu { animation: plopp .35s ease-out; }
@keyframes plopp { from { transform: scale(.6); } to { transform: scale(1); } }
.b-leer { color: var(--muted); font-size: 13px; text-align: center; margin: 8px 0 0; }
.b-mitte { position: relative; display: grid; grid-template-columns: minmax(30px, .62fr) minmax(150px, 2.3fr) minmax(30px, .62fr); align-items: center; padding-top: 18px; }
/* Förderbänder: laufen, solange eine Zahl unterwegs ist */
.b-band { position: relative; height: 22px; border-radius: 999px; background: repeating-linear-gradient(115deg, #D6C8B7 0 8px, #EEE5D9 8px 16px); background-size: 34px 100%;
  box-shadow: inset 0 2px 4px rgba(0, 0, 0, .14), 0 3px 0 #CBBBA8; }
.buehne.laeuft .b-band { animation: band .5s linear infinite; }
@keyframes band { to { background-position: 34px 0; } }
/* Einfülltrichter über dem Anfang des ersten Bandes */
.b-trichter { position: absolute; left: -3px; bottom: calc(100% - 3px); width: 40px; height: 33px; transform-origin: 50% 100%; }
.b-trichter svg { width: 100%; height: 100%; display: block; overflow: visible; }
.b-trichter .tr-k { fill: #EDE3D6; stroke: #BFAF9C; stroke-width: 2; stroke-linejoin: round; }
.b-trichter .tr-r { stroke: var(--mf); stroke-width: 3.5; stroke-linecap: round; }
.b-koerper { position: relative; background: linear-gradient(180deg, #F7F0E6, #E8DDCF); border: 2px solid #D9CCBC; border-top: 7px solid var(--mf); border-radius: 18px; min-height: 128px; display: grid; place-items: center; padding: 22px 10px 16px; box-shadow: var(--schatten); }
.b-fenster { background: #fff; border-radius: 12px; padding: 8px 10px; display: flex; flex-wrap: wrap; gap: 5px; align-items: center; justify-content: center; min-height: 50px; max-width: 100%; box-shadow: inset 0 1px 3px rgba(0, 0, 0, .14); transition: box-shadow .2s; }
.b-koerper.arbeitet .b-fenster { box-shadow: inset 0 0 0 3px var(--mf); }
/* Ein- und Auslass an den Seiten, Lampe oben: grün = bereit, blinkt gelb = arbeitet, rot = nicht definiert */
.b-schlitz { position: absolute; top: 50%; width: 8px; height: 32px; margin-top: -16px; border-radius: 4px; background: #5B504A; box-shadow: inset 2px 0 3px rgba(0, 0, 0, .55); }
.b-schlitz-ein { left: -5px; }
.b-schlitz-aus { right: -5px; }
.b-lampe { position: absolute; top: 5px; left: 50%; width: 11px; height: 11px; margin-left: -5.5px; border-radius: 50%; background: #9FCDA6; box-shadow: inset 0 -2px 0 rgba(0, 0, 0, .14); transition: background .2s; }
.b-koerper.arbeitet .b-lampe { background: var(--gold); box-shadow: 0 0 10px 3px rgba(242, 176, 74, .85); animation: lampe .5s steps(2, jump-none) infinite; }
@keyframes lampe { 50% { background: #FBE3B5; box-shadow: 0 0 3px 1px rgba(242, 176, 74, .5); } }
.b-koerper.stoerung .b-lampe { background: var(--rot); box-shadow: 0 0 10px 3px rgba(217, 89, 79, .85); animation: none; }
.b-rad { position: absolute; color: #CDBFAE; }
.b-rad svg { width: 100%; height: 100%; fill: currentColor; display: block; }
.b-rad1 { top: 4px; left: 8px; width: 24px; height: 24px; }
.b-rad2 { bottom: 5px; right: 9px; width: 19px; height: 19px; }
.b-koerper.arbeitet .b-rad { color: #B9A994; }
.b-koerper.arbeitet .b-rad1 svg { animation: drehen .9s linear infinite; }
.b-koerper.arbeitet .b-rad2 svg { animation: drehen .9s linear infinite reverse; }
.b-koerper.presst .b-rad1 svg, .b-koerper.presst .b-rad2 svg { animation-duration: .28s; }
@keyframes drehen { to { transform: rotate(360deg); } }
.b-schloss { position: absolute; top: 5px; right: 10px; display: flex; gap: 4px; align-items: center; font-size: 11px; font-weight: 800; color: var(--geheim); text-transform: uppercase; letter-spacing: .05em; }
.b-schloss svg { width: 15px; height: 15px; fill: none; stroke: currentColor; stroke-width: 2.2; }
.b-flug { position: absolute; inset: 0; pointer-events: none; z-index: 3; }
/* Pfeile von D nach W */
.b-pfeile { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 2; overflow: visible; }
.b-pfeil path { fill: none; stroke: var(--mf); stroke-width: 2.2; opacity: .5; stroke-linecap: round; }
.b-pfeil text { font: 800 13px var(--font); fill: var(--ink); paint-order: stroke; stroke: #fff; stroke-width: 4px; stroke-linejoin: round; opacity: .75; }
.b-pfeil.ist-frisch path { opacity: .95; stroke-width: 2.8; }
.b-pfeil.ist-frisch text { opacity: 1; }
.b-pfeil.ist-neu path { stroke-dasharray: 1; stroke-dashoffset: 1; animation: pfeil-zeichnen .7s ease-out forwards; }
.b-pfeil.ist-neu text { animation: einblenden .7s ease-out; }
.b-pfeil.im-diagramm path { stroke-width: 1.8; opacity: .55; }
.b-schild { font: 800 16px var(--font); fill: var(--mf); paint-order: stroke; stroke: var(--karte); stroke-width: 6px; stroke-linejoin: round; }
.b-schild.ist-gewaehlt { fill: var(--gold-d); }
.b-pfeil.ist-gewaehlt path { stroke: var(--gold); stroke-width: 3.2; opacity: 1; }
.b-pfeil.ist-gewaehlt text { opacity: 1; font-size: 14px; }
@keyframes pfeil-zeichnen { to { stroke-dashoffset: 0; } }
@keyframes einblenden { from { opacity: 0; } }
.b-unter { grid-column: 1 / -1; display: flex; justify-content: center; margin-top: 12px; position: relative; z-index: 4; }
/* Zwischenwerte an den Bausteinen im Maschinenfenster */
.mf-chip { position: relative; transition: box-shadow .2s, background .2s; }
.mf-chip.ist-aktiv { background: #fff; box-shadow: 0 0 0 3px var(--mf); }
.mf-chip.ist-fertig { background: #fff; box-shadow: inset 0 0 0 2px var(--mf); }
.mf-chip.ist-fehler { background: var(--falsch-s); box-shadow: 0 0 0 3px var(--geheim); }
.mf-chip.ist-fehler[data-wert]::after { background: var(--geheim); }
.mf-chip[data-wert]::after { content: attr(data-wert); position: absolute; left: 50%; bottom: calc(100% + 5px); transform: translateX(-50%); background: var(--mf); color: #fff;
  font-size: 13px; font-weight: 800; padding: 1px 7px; border-radius: 999px; white-space: nowrap; animation: plopp .3s ease-out; }
.b-fenster { margin-top: 10px; }
.b-token { position: absolute; left: 0; top: 0; min-width: 40px; height: 40px; padding: 0 9px; border-radius: 999px; display: grid; place-items: center; background: var(--mf); color: #fff; font-weight: 800; font-size: 17px; box-shadow: 0 8px 16px -8px rgba(0, 0, 0, .45); white-space: nowrap; }
.b-token.raus { background: #fff; color: var(--ink); box-shadow: inset 0 0 0 2px var(--mf), 0 8px 16px -8px rgba(0, 0, 0, .45); }
.b-token.ist-nd { color: var(--geheim); box-shadow: inset 0 0 0 2px var(--geheim); font-size: 14px; }
.mf-name { font-style: italic; font-weight: 800; color: var(--mf); font-size: 20px; margin-right: 3px; }
.mf-chip { background: var(--soft); border-radius: 8px; padding: 3px 9px; font-weight: 800; white-space: nowrap; font-size: 17px; }
.mf-term { font-size: 19px; }
.mf-leer { color: var(--muted); font-size: 14px; }
.mf-geheim { font-size: 30px; font-weight: 800; color: var(--geheim); line-height: 1; }

/* ---------- Darstellungen, Legende ---------- */
.k-editor, .k-kette { overflow: auto; }
.m-name { font-style: italic; }
.darstellungen { margin: 0; display: grid; gap: 7px; border-top: 1px solid var(--linie); padding-top: 9px; }
.darstellungen > div { display: grid; grid-template-columns: 116px minmax(0, 1fr); gap: 10px; align-items: baseline; }
.darstellungen dt { font-size: 12px; font-weight: 800; text-transform: uppercase; color: var(--muted); letter-spacing: .04em; }
.darstellungen dd { margin: 0; font-size: 18px; min-width: 0; overflow-wrap: anywhere; }
.m-term, .vk-term { font-size: 23px; }
.rk-kette { display: inline-flex; flex-wrap: wrap; gap: 4px; align-items: center; margin-left: 14px; font-size: 15px; vertical-align: middle; }
.rk-wert { background: #fff; border: 2px solid var(--linie); border-radius: 999px; padding: 0 9px; font-weight: 800; }
.rk-schritt { color: var(--muted); font-size: 13px; font-weight: 800; white-space: nowrap; }
.rk-schritt::before { content: "→ "; }
.rk-schritt::after { content: " →"; }
.rk-hinweis { display: block; color: var(--falsch-d); font-size: 14px; font-weight: 700; margin-top: 3px; }
.legende { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 15px; align-items: center; min-height: 28px; }
.leg { display: inline-flex; align-items: center; gap: 7px; border: 0; background: transparent; padding: 2px 6px; border-radius: 8px; white-space: nowrap; }
button.leg { cursor: pointer; }
button.leg:hover { background: var(--soft); }
.leg.ist-aus { opacity: .4; text-decoration: line-through; }
.leg-strich { width: 24px; height: 4px; border-radius: 2px; display: inline-block; flex: none; }
.leg-strich.gestrichelt { background: repeating-linear-gradient(90deg, var(--lf, var(--vergleich)) 0 7px, transparent 7px 11px); }
.leg-strich.blass { background: var(--f); opacity: .3; }
.leg-punkt { width: 11px; height: 11px; border-radius: 50%; display: inline-block; }

/* ---------- Koordinatensystem ---------- */
.k-graph { padding: 10px; }
.graph-kasten { flex: 1; min-height: 220px; position: relative; }
svg.graph { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.graph-leiste { display: flex; align-items: center; gap: 8px; }
.g-zoom { position: absolute; top: 8px; right: 8px; z-index: 2; display: flex; gap: 4px; opacity: .55; transition: opacity .15s; }
.graph-kasten:hover .g-zoom, .graph-kasten.ist-gezoomt .g-zoom, .g-zoom:focus-within { opacity: 1; }
.g-zoom .knopf.rund { width: 32px; height: 32px; min-width: 0; padding: 0; font-size: 18px; line-height: 1; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.12); }
.g-zoom .knopf:disabled { opacity: .35; cursor: default; }
.g-papier { fill: #fff; }
.g-gitter-fein line { stroke: #F3EBE1; stroke-width: 1; }
.g-gitter line { stroke: #E3D8C9; stroke-width: 1; }
.g-achsen line { stroke: var(--ink); stroke-width: 1.7; }
.g-achsen path { fill: var(--ink); }
.g-skala text { font: 600 13px var(--font); fill: var(--leise); paint-order: stroke; stroke: #fff; stroke-width: 4px; stroke-linejoin: round; }
.g-strich { stroke: var(--ink); stroke-width: 1.4; }
.g-skala .g-achsname { font-weight: 800; font-style: italic; fill: var(--ink); font-size: 16px; }
.g-kurve { fill: none; stroke-linecap: round; stroke-linejoin: round; }
.g-linie { stroke: var(--vergleich); stroke-width: 1.7; stroke-dasharray: 6 5; }
.g-spiegel { stroke: var(--muted); }
.g-achse-sym { stroke: var(--f); opacity: .55; }
.g-asymptote { stroke: var(--rot); opacity: .5; stroke-dasharray: 3 5; }
.g-dreieck { fill: none; stroke: #C9871B; stroke-width: 2.6; stroke-dasharray: 5 4; }
.g-dreieck-t { font: 800 14px var(--font); fill: var(--gold-d); paint-order: stroke; stroke: #fff; stroke-width: 4px; }
.g-hilfe { fill: none; stroke: var(--gold); stroke-width: 2.2; stroke-dasharray: 4 4; }
.g-marke { stroke: #fff; stroke-width: 2; }
.g-marke-t { font: 700 13px var(--font); fill: var(--ink); paint-order: stroke; stroke: #fff; stroke-width: 4px; }
.g-punkt { cursor: pointer; }
.g-treffer { fill: transparent; }
.g-punkt circle:not(.g-treffer) { fill: var(--pf); stroke: #fff; stroke-width: 2.5; }
.g-punkt.ist-gewaehlt circle:not(.g-treffer) { stroke: var(--gold); stroke-width: 4; }
.g-punkt-t { font: 800 14px var(--font); fill: var(--ink); paint-order: stroke; stroke: #fff; stroke-width: 5px; }

/* ---------- Wertetabelle ---------- */
.k-tabelle { padding: 10px 14px; gap: 6px; }
.wt { overflow-x: auto; }
.wt table { border-collapse: separate; border-spacing: 0; font-variant-numeric: tabular-nums; }
.wt th { text-align: left; padding: 5px 14px 5px 2px; font-weight: 800; white-space: nowrap; position: sticky; left: 0; background: var(--karte); z-index: 1; font-size: 17px; }
.wt td { min-width: 54px; text-align: center; padding: 5px 9px; border-left: 1px solid var(--linie); cursor: pointer; font-weight: 700; font-size: 18px; white-space: nowrap; }
.wt tr:first-child td { border-bottom: 2px solid var(--ink); }
.wt tr:first-child th { border-bottom: 2px solid var(--ink); }
.wt tr.wt-zeile + tr.wt-zeile td, .wt tr.wt-zeile + tr.wt-zeile th { border-top: 1px solid var(--linie); }
.wt td.ist-gewaehlt { background: var(--noch-s); box-shadow: inset 0 0 0 2px var(--gold); }
.wt td.ist-nd { color: var(--geheim); font-size: 14px; }
.wt .wt-diff th { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .03em; }
.wt .wt-diff td { cursor: default; border-left-color: transparent; font-size: 13px; padding: 3px 4px; }
.wt .wt-diff span { display: inline-block; transform: translateX(-50%); background: var(--noch-s); color: var(--noch-d); border-radius: 7px; padding: 1px 6px; font-weight: 800; }
.wt-leer { color: var(--muted); margin: 4px 0; }

/* ---------- Regler ---------- */
.k-regler { overflow: auto; }
.familien { display: flex; flex-wrap: wrap; gap: 4px; }
.r-wahl { display: flex; flex-wrap: wrap; align-items: center; gap: 5px; }
.r-wahl-t { font-size: 12px; font-weight: 800; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; margin-right: 3px; }
.r-wahl .chip { min-width: 46px; font-size: 15px; padding: 4px 12px; }
.r-kopf { display: flex; align-items: baseline; gap: 10px; justify-content: space-between; }
.r-form { font-size: 20px; font-weight: 700; }
.r-jg { font-size: 13px; color: var(--muted); font-weight: 700; }
.r-regler { display: grid; gap: 4px; }
.regler { display: grid; grid-template-columns: 26px 30px minmax(0, 1fr) 30px 54px; align-items: center; gap: 6px; }
.regler label { font-size: 21px; font-weight: 800; }
.regler input[type="range"] { width: 100%; accent-color: var(--f); height: 30px; margin: 0; }
.r-wert { font-weight: 800; font-size: 19px; text-align: right; font-variant-numeric: tabular-nums; }
.r-term { font-size: 25px; padding: 6px 10px; background: var(--app); border-radius: 12px; text-align: center; overflow-x: auto; }
.r-term .bruch { font-size: .68em; }   /* π/2 im Term: die Zeile bleibt niedrig */
.r-schalter { display: flex; flex-wrap: wrap; gap: 5px; }
/* Maschinenkette im Regler: innen (auf x) blau, außen (auf den Funktionswert) warm */
.r-masch { display: grid; gap: 5px; }
.r-kette { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 3px; }
.r-chip { display: inline-flex; flex-direction: column; align-items: center; border: 2px solid var(--linie); background: #fff; border-radius: 12px; padding: 2px 7px 1px; font-weight: 800; font-size: 16px; white-space: nowrap; transition: box-shadow .2s, border-color .2s; }
.r-kette .bk-pfeil { font-size: 14px; }
.r-chip sup { font-size: .65em; vertical-align: .55em; line-height: 0; }
.r-par { font-size: 12px; font-style: italic; color: var(--muted); line-height: 1.1; }
.r-chip.innen { border-color: #A9C1DB; background: #EEF3F9; }
.r-chip.kern { border-color: var(--ink); }
.r-chip.aussen { border-color: #E5B98F; background: #FBF1E7; }
.r-chip.ist-aktiv { border-color: var(--gold); box-shadow: 0 0 0 3px var(--gold); }
/* Durchlauf einer Zahl durch die Kette (x antippen oder eine Tabellenspalte) */
.k-regler { position: relative; }
.r-flug { position: absolute; inset: 0; pointer-events: none; z-index: 3; }
.r-chip, .r-ende { position: relative; }
.r-chip.ist-lauf { border-color: var(--f); box-shadow: 0 0 0 3px var(--f), 0 0 14px 2px rgba(61, 106, 153, .45); }
.r-chip[data-wert]::after, .r-ende[data-wert]::after { content: attr(data-wert); position: absolute; left: 50%; bottom: calc(100% + 4px); transform: translateX(-50%); background: var(--f); color: #fff;
  font-size: 13px; font-weight: 800; font-style: normal; padding: 1px 7px; border-radius: 999px; white-space: nowrap; animation: plopp .3s ease-out; z-index: 2; }
.r-start { border: 0; background: var(--soft); border-radius: 999px; padding: 1px 6px 1px 8px; cursor: pointer; display: inline-flex; align-items: center; gap: 2px; color: inherit; }
.r-start:hover { background: #E9DFD2; }
.r-play { font-size: 9px; color: var(--rot); }
.r-kette-t { margin: 0; font-size: 14px; color: var(--leise); line-height: 1.4; }
.innen-t { color: #3D6A99; }
.aussen-t { color: #B5651D; }
.r-info { margin: 0; padding-left: 18px; font-size: 15px; display: grid; gap: 4px; line-height: 1.4; }
.r-frage { margin-top: auto; background: var(--noch-s); color: var(--noch-d); border-radius: 12px; padding: 8px 10px; display: flex; gap: 8px; align-items: center; font-weight: 700; font-size: 15px; }
.r-frage-t { flex: 1; }

/* ---------- Verknüpfen ---------- */
.vk-felder { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 10px; }
.vk-arten { display: flex; flex-wrap: wrap; gap: 4px; }
.vk-kette { display: flex; align-items: center; gap: 6px; overflow-x: auto; padding: 4px 0; }
.vk-zweige { display: flex; flex-direction: column; gap: 8px; }
.vk-zweig { display: flex; align-items: center; gap: 6px; }
.vk-blase { min-width: 64px; border-radius: 14px; background: var(--app); border: 2px solid var(--linie); padding: 3px 8px 4px; text-align: center; flex: none; }
.vk-blase .vk-l { display: block; font-size: 12px; color: var(--muted); font-weight: 700; white-space: nowrap; }
.vk-blase b { font-size: 21px; }
.vk-zw.vk-f { border-color: var(--f); } .vk-zw.vk-g { border-color: var(--g); }
.vk-erg { border-color: var(--h); background: #EEF6F0; }
.vk-x.ist-an { border-color: var(--gold); }
.vk-masch { --mf: var(--f); border-radius: 14px; background: linear-gradient(180deg, #F7F0E6, #E8DDCF); border: 2px solid #D9CCBC; border-top: 6px solid var(--mf); padding: 6px 9px; display: flex; align-items: center; gap: 6px; flex: none; transition: box-shadow .2s; }
.vk-masch .vk-t { background: #fff; border-radius: 8px; padding: 2px 8px; font-size: 17px; white-space: nowrap; }
.vk-masch.arbeitet { box-shadow: 0 0 0 4px var(--mf), 0 0 18px 2px var(--mf); }
.vk-masch .vk-t { position: relative; }
/* Flugschicht über der Karte: die Zahl fliegt von Blase zu Maschine zu Blase */
.k-kette { position: relative; }
.vk-flug { position: absolute; inset: 0; pointer-events: none; z-index: 3; }
.vk-chips .b-chip.ist-unterwegs { opacity: .25; }
.vk-op { width: 42px; height: 42px; border-radius: 50%; display: grid; place-items: center; background: var(--ink); color: #fff; font-weight: 800; font-size: 22px; flex: none; transition: background .2s; }
.vk-op.arbeitet { background: var(--h); }
.vk-pfeil { color: var(--muted); flex: none; }
.vk-beutel { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.vk-beutel .b-chips { justify-content: flex-start; }
.vk-chips .b-chip { --mf: var(--h); min-width: 38px; height: 38px; font-size: 16px; padding: 0 7px; }
.vk-beutel .b-chips { gap: 5px; }
.k-kette { overflow: auto; }

/* ---------- Rückwärts ---------- */
.rw-fragen { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.rw-feld { display: inline-flex; align-items: center; gap: 6px; font-weight: 700; }
.rw-spur { display: flex; align-items: center; gap: 6px; overflow-x: auto; padding: 4px 0; }
.rw-wert { min-width: 72px; text-align: center; border-radius: 14px; border: 2px solid var(--linie); background: var(--app); padding: 3px 8px 5px; flex: none; }
.rw-wert b { font-size: 20px; white-space: nowrap; }
.rw-l { display: block; font-size: 11px; font-weight: 800; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; min-height: 1.3em; }
.rw-ein { border-color: var(--h); }
.rw-aus { border-color: var(--f); }
.rw-wert.ist-neu { box-shadow: 0 0 0 3px var(--gold); }
.rw-schritt { display: flex; flex-direction: column; gap: 4px; align-items: center; flex: none; }
.rw-vor, .rw-zur { white-space: nowrap; border-radius: 10px; padding: 3px 9px; font-weight: 800; font-size: 16px; }
.rw-vor { background: var(--soft); color: var(--leise); }
.rw-zur { background: #E4EFE6; color: var(--gut-d); opacity: .45; }
.rw-schritt.ist-aktiv .rw-zur { opacity: 1; box-shadow: 0 0 0 2px var(--h); }
.rw-vor em, .rw-zur em { font-style: normal; color: var(--muted); margin: 0 3px; }
.rw-glg { list-style: none; margin: 0; padding: 8px 12px; display: grid; gap: 5px; font-size: 20px; overflow: auto; background: var(--app); border-radius: 14px; }
.rw-glg:empty { display: none; }
.rw-glg li { display: flex; gap: 16px; align-items: baseline; flex-wrap: wrap; animation: plopp .3s ease-out; }
.glg-op { color: var(--h); font-weight: 800; font-size: 16px; }
.glg-op sup, .glg-op sub { font-size: .65em; }
.glg-ende { font-weight: 800; }
.oder { font-size: 14px; color: var(--muted); margin: 0 6px; font-weight: 700; }
.rw-nie { font-size: 14px; color: var(--falsch-d); }
.k-rueck { overflow: auto; }
.k-umkehr { gap: 8px; }
.rw-umkehr { display: grid; gap: 4px; }
.rw-zeile { margin: 0; font-size: 21px; }
.rw-klein { margin: 0; font-size: 14px; color: var(--leise); line-height: 1.7; }
.rw-nicht { font-size: 15px; color: var(--noch-d); font-weight: 600; }

/* ---------- Blackbox ---------- */
.bb-jg-t { font-weight: 800; color: var(--muted); font-size: 14px; }
.bb-jg .chip { min-width: 38px; padding: 6px 10px; }
.bb-unten { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.bb-quelle { color: var(--muted); font-size: 13px; font-weight: 700; margin-right: auto; }
.bb-versuche { margin-left: auto; color: var(--muted); font-weight: 700; font-size: 14px; }
.k-vermutung { overflow: auto; }
.bb-hilfen { display: grid; gap: 6px; }
.bb-hilfen-t { font-size: 12px; font-weight: 800; text-transform: uppercase; color: var(--muted); letter-spacing: .04em; }
.bb-hilfe-text { background: var(--app); border-radius: 12px; padding: 8px 10px; font-size: 15px; line-height: 1.45; }
.bb-hilfe-text em { display: block; color: var(--noch-d); font-style: normal; font-weight: 700; margin-top: 4px; }
.bb-dialog { position: fixed; inset: 0; background: rgba(62, 54, 49, .38); display: grid; place-items: center; z-index: 20; padding: 20px; }
.bb-dialog-k { width: min(600px, 100%); }
.bb-dialog-k h2 { margin: 0; font-size: 20px; }
.bb-dialog-k p { margin: 0; color: var(--leise); }

/* ---------- Aufgaben ---------- */
.k-liste { overflow: hidden; }
.af-liste { list-style: none; margin: 0; padding: 0; overflow: auto; display: grid; gap: 2px; align-content: start; }
.af-eintrag { width: 100%; text-align: left; border: 0; background: transparent; border-radius: 12px; padding: 6px 8px; display: flex; gap: 8px; align-items: center; cursor: pointer; }
.af-eintrag:hover { background: var(--app); }
.af-eintrag.ist-an { background: var(--soft); }
.af-jg { font-size: 11px; font-weight: 800; background: var(--ink); color: #FFF4E6; border-radius: 999px; padding: 2px 8px; white-space: nowrap; flex: none; }
.af-titel { font-weight: 700; flex: 1; font-size: 15px; }
.af-haken { color: var(--gut-d); font-weight: 800; }
.k-aufgabe { overflow: auto; }
.af-karte { display: flex; flex-direction: column; gap: 10px; }
.af-kopf { display: flex; align-items: center; gap: 10px; }
.af-kopf h2 { margin: 0; font-size: 21px; }
.af-auftrag { font-size: 19px; line-height: 1.55; margin: 0; }
.af-antwort { display: flex; flex-direction: column; gap: 8px; align-items: flex-start; }
.af-antwort .termfeld { align-self: stretch; }
.af-tipp { margin: 0; background: var(--app); border-radius: 12px; padding: 8px 12px; line-height: 1.5; }

/* ---------- Einstellungen ---------- */
.einst { position: fixed; top: 0; right: 0; bottom: 0; width: min(360px, 92vw); border-radius: 0; z-index: 30; padding: 18px; gap: 12px; box-shadow: -24px 0 40px -24px rgba(0, 0, 0, .35); }
.einst h2 { margin: 0; }
.einst label { display: grid; gap: 4px; font-weight: 700; }
.einst select { border: 2px solid var(--linie); border-radius: 10px; padding: 6px; background: #fff; font-weight: 700; }
.einst-reihe { display: flex; gap: 12px; }
.einst-text { margin: 0; color: var(--leise); font-size: 14px; }
.einst-meldung { margin: 0; color: var(--falsch-d); font-weight: 700; min-height: 1em; }

/* ---------- Kleine Bildschirme (iPad hochkant, Fenster schmal): untereinander, dann scrollen ---------- */
@media (max-width: 1000px), (max-height: 600px) {
  .app { height: auto; min-height: 100vh; }
  .inhalt { overflow: visible; }
  .raster { height: auto; min-height: 0; grid-template-columns: minmax(0, 1fr) !important; grid-template-rows: none !important; }
  .raster-maschine, .raster-verkn { grid-template-areas: "a" "b" "graph" "tab" !important; }
  .raster-blackbox { grid-template-areas: "a" "b" "hilfe" "graph" "tab" !important; }
  .raster-regler { grid-template-areas: "a" "graph" "tab" !important; }
  .raster-rueck { grid-template-areas: "a" "b" "graph" !important; }
  .raster-aufgaben { grid-template-areas: "b" "graph" "a" !important; }
  .graph-kasten { min-height: 380px; }
  .af-liste { max-height: 320px; }
  .kopf { flex-wrap: wrap; }
  .kopf-einst, .kopf-hilfe { margin-left: auto; }
  .modi { order: 3; width: 100%; }
}
@media (max-width: 640px) {
  .buehne { grid-template-columns: 1fr 1fr; }
  .b-mitte { grid-column: 1 / -1; grid-row: 1; }
  .modi button span { display: none; }
  .vk-felder { grid-template-columns: 1fr; }
}
/* Ältere Beamer (1024 × 768) und kleine Fenster: dichter setzen statt scrollen */

<script >
/* Funktionswerkstatt · Rechenkern
   Terme in Schulschreibweise lesen (2x² − 3, √(x+1), |x|, 2^x, Komma als Dezimalzeichen, sin, cos, tan, ln, e, π),
   ohne eval berechnen, wie im Heft darstellen (HTML) oder als Text, in Maschinenschritte zerlegen, rückwärts rechnen
   und in Worte fassen. Winkel im Bogenmaß. */
(function (FW) {
  'use strict';
  const M = FW.mathe = {};

  // ---------------------------------------------------------------------------
  // Zahlen in deutscher Schreibweise
  // ---------------------------------------------------------------------------
  /** 2.5 → "2,5", −3 → "−3", höchstens drei Nachkommastellen; nicht definiert → "n. d." */
  M.zahl = function (v, stellen) {
    if (typeof v !== 'number' || !Number.isFinite(v)) return 'n. d.';
    const f = Math.pow(10, stellen == null ? 3 : stellen);
    let r = Math.round(v * f) / f;
    if (Object.is(r, -0) || Math.abs(r) < 1e-12) r = 0;
    let s = Math.abs(r) >= 1e15 ? r.toExponential(3) : String(r);
    if (/e/.test(s)) s = r.toPrecision(4);
    return s.replace('-', '−').replace('.', ',');
  };
  /** wie zahl, aber mit „≈“, wenn gerundet wurde */
  M.zahlCa = function (v, stellen) {
    const s = M.zahl(v, stellen);
    if (!Number.isFinite(v)) return s;
    const f = Math.pow(10, stellen == null ? 3 : stellen);
    return Math.abs(Math.round(v * f) / f - v) > 1e-9 ? '≈ ' + s : s;
  };
  M.gleich = (a, b) => Number.isFinite(a) && Number.isFinite(b) && Math.abs(a - b) <= 1e-7 * Math.max(1, Math.abs(a), Math.abs(b));
  /** Vielfaches von π als gekürzter Bruch [p, q] mit v = p/q · π, sonst null */
  M.piBruch = function (v) {
    if (!Number.isFinite(v) || v === 0) return null;
    const r = v / Math.PI;
    for (let q = 1; q <= 12; q++) {
      const p = Math.round(r * q);
      if (p !== 0 && Math.abs(p) <= 96 && Math.abs(r * q - p) < 1e-9) return [p, q];
    }
    return null;
  };
  const istE = (v) => Math.abs(v - Math.E) < 1e-12;
  /** wie zahl, aber e als „e“ und Vielfache von π als „π/2“, „−3π/4“, „2π“ (Maschinenschritte, Achse, Regler) */
  M.zahlSym = function (v, stellen) {
    if (Number.isFinite(v) && istE(v)) return 'e';
    const b = M.piBruch(v);
    if (!b) return M.zahl(v, stellen);
    const a = Math.abs(b[0]);
    return (b[0] < 0 ? '−' : '') + (a === 1 ? '' : a) + 'π' + (b[1] === 1 ? '' : '/' + b[1]);
  };

  // ---------------------------------------------------------------------------
  // Knoten
  // ---------------------------------------------------------------------------
  const K = M.k = {
    zahl: (v) => ({ t: 'num', v }),
    x: () => ({ t: 'x' }),
    plus: (a, b) => ({ t: 'add', a, b }),
    minus: (a, b) => ({ t: 'sub', a, b }),
    mal: (a, b) => ({ t: 'mul', a, b }),
    durch: (a, b) => ({ t: 'div', a, b }),
    hoch: (a, b) => ({ t: 'pow', a, b }),
    neg: (a) => ({ t: 'neg', a }),
    wurzel: (a) => ({ t: 'sqrt', a }),
    betrag: (a) => ({ t: 'abs', a }),
    kwurzel: (a) => ({ t: 'cbrt', a }),
    log: (b, a) => ({ t: 'log', b, a }),
    konst: (n) => ({ t: 'konst', n }),       // 'pi' oder 'e'
    fkt: (n, a) => ({ t: 'fkt', n, a }),     // 'sin', 'cos', 'tan', 'ln'
  };
  const KONST = { pi: Math.PI, e: Math.E }, KZEICHEN = { pi: 'π', e: 'e' };
  /** Zahl als Baum; e und Vielfache von π bleiben als Zeichen erhalten (π/2 statt 1,571) */
  M.zahlBaum = function (v) {
    if (Number.isFinite(v) && istE(v)) return K.konst('e');
    const b = M.piBruch(v);
    if (!b) return K.zahl(v);
    const a = Math.abs(b[0]);
    let t = a === 1 ? K.konst('pi') : K.mal(K.zahl(a), K.konst('pi'));
    if (b[1] !== 1) t = K.durch(t, K.zahl(b[1]));
    return b[0] < 0 ? K.neg(t) : t;
  };

  // ---------------------------------------------------------------------------
  // Lesen
  // ---------------------------------------------------------------------------
  class TermFehler extends Error {}
  M.TermFehler = TermFehler;
  const WOERTER = ['wurzel', 'betrag', 'sqrt', 'abs', 'sin', 'cos', 'tan', 'exp', 'ln', 'pi'];

  function zerlege(text, variable) {
    const s = String(text).replace(/\s+/g, '');
    const out = [];
    let i = 0;
    const ziffer = (c) => c >= '0' && c <= '9';
    while (i < s.length) {
      const c = s[i];
      if (ziffer(c) || ((c === ',' || c === '.') && ziffer(s[i + 1] || ''))) {
        let j = i;
        while (j < s.length && ziffer(s[j])) j++;
        if ((s[j] === ',' || s[j] === '.') && ziffer(s[j + 1] || '')) { j++; while (j < s.length && ziffer(s[j])) j++; }
        out.push({ t: 'zahl', v: parseFloat(s.slice(i, j).replace(',', '.')) });
        i = j; continue;
      }
      const rest = s.slice(i).toLowerCase();
      // Wörter vor einzelnen Buchstaben: so ist das e in „exp“ nicht die eulersche Zahl und das x nicht die Variable
      const wort = WOERTER.find((w) => rest.startsWith(w));
      if (wort) {
        if (wort === 'wurzel' || wort === 'sqrt') out.push({ t: 'wurzel' });
        else if (wort === 'betrag' || wort === 'abs') out.push({ t: 'betragf' });
        else if (wort === 'pi') out.push({ t: 'konst', n: 'pi' });
        else out.push({ t: 'fkt', n: wort });
        i += wort.length; continue;
      }
      if (c.toLowerCase() === variable) { out.push({ t: 'x' }); i++; continue; }
      if (c === 'x' || c === 'X') throw new TermFehler(`Hier heißt die Variable ${variable}, nicht x.`);
      if (c === 'π') { out.push({ t: 'konst', n: 'pi' }); i++; continue; }
      if (c === 'e') { out.push({ t: 'konst', n: 'e' }); i++; continue; }
      if (c === '√') { out.push({ t: 'wurzel' }); i++; continue; }
      if (c === '+') { out.push({ t: 'plus' }); i++; continue; }
      if ('-−–'.includes(c)) { out.push({ t: 'minus' }); i++; continue; }
      if ('*·×⋅'.includes(c)) { out.push({ t: 'mal' }); i++; continue; }
      if ('/:÷'.includes(c)) { out.push({ t: 'durch' }); i++; continue; }
      if (c === '^') { out.push({ t: 'hoch' }); i++; continue; }
      if ('²³⁴'.includes(c)) { out.push({ t: 'hochzahl', v: { '²': 2, '³': 3, '⁴': 4 }[c] }); i++; continue; }
      if ('([{'.includes(c)) { out.push({ t: 'auf' }); i++; continue; }
      if (')]}'.includes(c)) { out.push({ t: 'zu' }); i++; continue; }
      if (c === '|') { out.push({ t: 'strich' }); i++; continue; }
      if (/[a-zäöüß]/i.test(c)) {
        const lauf = /^[a-zäöüß]+/i.exec(s.slice(i))[0];
        if (lauf.length > 1 && !lauf.toLowerCase().includes(variable)) throw new TermFehler(`„${lauf}“ kenne ich nicht. Möglich sind sin, cos, tan, ln, e und π.`);
        throw new TermFehler(`„${c}“ geht nicht: Die Variable heißt ${variable}.`);
      }
      throw new TermFehler(`Das Zeichen „${c}“ kenne ich nicht.`);
    }
    return out;
  }

  /** Text → Baum. Wirft TermFehler mit einer verständlichen Meldung. opt.variable: anderer Name als x (etwa z) */
  M.lies = function (text, opt) {
    if (!String(text).trim()) throw new TermFehler('Hier steht noch kein Term.');
    const tk = zerlege(text, (opt && opt.variable) || 'x');
    let p = 0, betragTiefe = 0;
    const sieh = () => tk[p];
    const nimm = () => tk[p++];
    const erwarte = (t, meldung) => { if (!sieh() || sieh().t !== t) throw new TermFehler(meldung); nimm(); };
    const startetFaktor = (k) => k && (k.t === 'zahl' || k.t === 'x' || k.t === 'auf' || k.t === 'wurzel' || k.t === 'betragf' || k.t === 'konst' || k.t === 'fkt' || (k.t === 'strich' && betragTiefe === 0));

    function ausdruck() {
      let a = produkt();
      while (sieh() && (sieh().t === 'plus' || sieh().t === 'minus')) {
        const op = nimm().t;
        a = op === 'plus' ? K.plus(a, produkt()) : K.minus(a, produkt());
      }
      return a;
    }
    function produkt() {
      let a = vorzeichen();
      for (;;) {
        const k = sieh();
        if (k && (k.t === 'mal' || k.t === 'durch')) { nimm(); const b = vorzeichen(); a = k.t === 'mal' ? K.mal(a, b) : K.durch(a, b); }
        else if (startetFaktor(k)) a = K.mal(a, potenz());
        else return a;
      }
    }
    function vorzeichen() {
      const k = sieh();
      if (k && k.t === 'minus') { nimm(); return K.neg(vorzeichen()); }
      if (k && k.t === 'plus') { nimm(); return vorzeichen(); }
      return potenz();
    }
    function potenz() {
      const a = nachgestellt();
      if (sieh() && sieh().t === 'hoch') { nimm(); if (!sieh()) throw new TermFehler('Nach ^ fehlt die Hochzahl.'); return K.hoch(a, vorzeichen()); }
      return a;
    }
    function nachgestellt() {
      let a = grund();
      while (sieh() && sieh().t === 'hochzahl') a = K.hoch(a, K.zahl(nimm().v));

        if (Math.abs(x) < stx / 1000) return;
        s += `<line class="g-strich" x1="${sx(x).toFixed(1)}" y1="${(ay - 4).toFixed(1)}" x2="${sx(x).toFixed(1)}" y2="${(ay + 4).toFixed(1)}"/>`;
        const t = xText(x), halb = t.length * 3.6;   // breite π-Beschriftungen am Rand nicht anschneiden
        if (!d.piAchse || (sx(x) - halb > 0 && sx(x) + halb < W)) s += `<text x="${sx(x).toFixed(1)}" y="${unten.toFixed(1)}" text-anchor="middle">${t}</text>`;
      });
      const links = ax - 8 < pad.l + 22;
      my.forEach((y) => {
        if (Math.abs(y) < sty / 1000) return;
        s += `<line class="g-strich" x1="${(ax - 4).toFixed(1)}" y1="${sy(y).toFixed(1)}" x2="${(ax + 4).toFixed(1)}" y2="${sy(y).toFixed(1)}"/>`;
        s += `<text x="${(links ? ax + 8 : ax - 8).toFixed(1)}" y="${(sy(y) + 4.5).toFixed(1)}" text-anchor="${links ? 'start' : 'end'}">${beschrift(y, sty)}</text>`;
      });
      if (f.xmin < 0 && f.xmax > 0 && f.ymin < 0 && f.ymax > 0) s += `<text x="${(ax - 7).toFixed(1)}" y="${(ay + 17).toFixed(1)}" text-anchor="end">0</text>`;
      s += `<text class="g-achsname" x="${pad.l + pw + 4}" y="${(ay - 10).toFixed(1)}" text-anchor="end">x</text>`;
      s += `<text class="g-achsname" x="${(ax + 10).toFixed(1)}" y="${pad.o + 6}">y</text>`;
      s += '</g>';
      // Hilfslinien (y = x, Symmetrieachse …)
      s += `<g clip-path="url(#${this.id}-c)">`;
      (d.linien || []).forEach((l) => {
        const cls = `g-linie${l.klasse ? ' ' + l.klasse : ''}`;
        if (l.art === 'diagonale') s += `<line class="${cls}" x1="${sx(f.xmin)}" y1="${sy(f.xmin)}" x2="${sx(f.xmax)}" y2="${sy(f.xmax)}"/>`;
        if (l.art === 'senkrecht') s += `<line class="${cls}" x1="${sx(l.wert)}" y1="${pad.o}" x2="${sx(l.wert)}" y2="${pad.o + ph}"/>`;
        if (l.art === 'waagerecht') s += `<line class="${cls}" x1="${pad.l}" y1="${sy(l.wert)}" x2="${pad.l + pw}" y2="${sy(l.wert)}"/>`;
      });
      // Kurven
      (d.serien || []).forEach((sr) => {
        const n = Math.round(pw * 1.5);
        let pfad = '', stift = false, vorher = null, xv = null, yv = null;
        for (let i = 0; i <= n; i++) {
          const x = f.xmin + (f.xmax - f.xmin) * i / n;
          if (sr.ab != null && x < sr.ab) { stift = false; continue; }
          const y = sr.fn(x);
          if (!Number.isFinite(y)) { stift = false; vorher = null; continue; }
          const py = sy(y);
          // Sprung an einer Polstelle (z. B. 1/x, tan x): nicht verbinden
          if (vorher !== null && Math.abs(py - vorher) > ph * 1.5) stift = false;
          else if (vorher !== null && Math.abs(py - vorher) > ph * 0.25) {
            // steiles Stück: Liegt der Wert in der Mitte nicht zwischen den beiden Werten, ist dort eine Polstelle
            const ym = sr.fn((x + xv) / 2);
            if (!Number.isFinite(ym) || ym < Math.min(y, yv) || ym > Math.max(y, yv)) stift = false;
          }
          const pyk = Math.max(-ph * 3, Math.min(ph * 4, py));
          pfad += `${stift ? 'L' : 'M'}${sx(x).toFixed(1)},${pyk.toFixed(1)}`;
          stift = true; vorher = py; xv = x; yv = y;
        }
        if (pfad) {
          s += `<path class="g-kurve${sr.klasse ? ' ' + sr.klasse : ''}" d="${pfad}" style="stroke:${sr.farbe};stroke-width:${sr.breite || 3}px${sr.strich ? ';stroke-dasharray:' + sr.strich : ''}${sr.deckkraft != null ? ';opacity:' + sr.deckkraft : ''}"/>`;
        }
      });
      // Steigungsdreieck
      if (d.dreieck) {
        const { x0, fn } = d.dreieck, y0 = fn(x0), y1 = fn(x0 + 1);
        if (Number.isFinite(y0) && Number.isFinite(y1)) {
          s += `<path class="g-dreieck" d="M${sx(x0)},${sy(y0)} H${sx(x0 + 1)} V${sy(y1)}"/>`;
          s += `<text class="g-dreieck-t" x="${(sx(x0) + sx(x0 + 1)) / 2}" y="${sy(y0) + (y1 >= y0 ? 18 : -8)}" text-anchor="middle">1</text>`;
          s += `<text class="g-dreieck-t" x="${sx(x0 + 1) + 7}" y="${(sy(y0) + sy(y1)) / 2 + 5}">${d.dreieck.text || M.zahl(y1 - y0)}</text>`;
        }
      }
      // ausgewählter Punkt: Hilfslinien zu den Achsen
      const gewaehlt = (d.punkte || []).find((p) => p.id != null && String(p.id) === String(d.auswahl));
      if (gewaehlt && Number.isFinite(gewaehlt.y)) {
        s += `<path class="g-hilfe" d="M${sx(gewaehlt.x)},${ay} V${sy(gewaehlt.y)} H${ax}"/>`;
      }
      s += '</g>';
      // Punkte und Marken (nicht abgeschnitten, aber nur im Fenster)
      const drin = (x, y) => x >= f.xmin && x <= f.xmax && y >= f.ymin && y <= f.ymax;
      (d.marken || []).forEach((m) => {
        if (!drin(m.x, m.y)) return;
        s += `<circle class="g-marke" cx="${sx(m.x)}" cy="${sy(m.y)}" r="5" style="fill:${m.farbe || 'var(--ink)'}"/>`;
        if (m.text) {
          const rechts = sx(m.x) < pad.l + pw - 120;
          s += `<text class="g-marke-t" x="${sx(m.x) + (rechts ? 9 : -9)}" y="${sy(m.y) - 9}" text-anchor="${rechts ? 'start' : 'end'}">${m.text}</text>`;
        }
      });
      (d.punkte || []).forEach((p) => {
        if (!Number.isFinite(p.y) || !drin(p.x, p.y)) return;
        const sel = gewaehlt === p;
        const cls = `g-punkt${sel ? ' ist-gewaehlt' : ''}${p.hohl ? ' ist-hohl' : ''}${p.klasse ? ' ' + p.klasse : ''}`;
        s += `<g class="${cls}"${p.id != null ? ` data-pid="${p.id}"` : ''}><circle class="g-treffer" cx="${sx(p.x)}" cy="${sy(p.y)}" r="15"/>`;
        s += `<circle cx="${sx(p.x)}" cy="${sy(p.y)}" r="${sel ? 8 : 6}" style="--pf:${p.farbe}"/></g>`;
        if (sel) {
          const links = sx(p.x) > pad.l + pw - 110, unten = sy(p.y) < pad.o + 26;
          s += `<text class="g-punkt-t" x="${sx(p.x) + (links ? -12 : 12)}" y="${sy(p.y) + (unten ? 26 : -12)}" text-anchor="${links ? 'end' : 'start'}">(${d.piAchse ? M.zahlSym(p.x) : M.zahl(p.x)} | ${M.zahl(p.y)})</text>`;
        }
      });
      this.svg.innerHTML = s;
      this.svg.setAttribute('aria-label', 'Koordinatensystem' + (d.beschreibung ? ': ' + d.beschreibung : ''));
    }
  }
  FW.Graph = Graph;
  FW.graphSchritt = schritt;
  FW.graphZoom = Z;
})(window.FW = window.FW || {});

</script>
<script >
/* Funktionswerkstatt · Bausteine der Oberfläche
   Termfeld mit Tastenfeld, Baukasten für Maschinenschritte, Editor (beides umschaltbar), Bühne mit Beutel,
   Maschine und Wertemenge (mit Animation) und die waagerechte Wertetabelle wie im Heft. */
(function (FW) {
  'use strict';
  const M = FW.mathe;
  const U = FW.ui = {};

  U.esc = (s) => String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  U.el = (html) => { const t = document.createElement('template'); t.innerHTML = html.trim(); return t.content.firstElementChild; };
  U.$ = (s, r) => (r || document).querySelector(s);
  U.$$ = (s, r) => Array.from((r || document).querySelectorAll(s));
  U.zahlLesen = (t) => {
    const s = String(t).trim().replace(/\s+/g, '').replace(/[−–]/g, '-').replace(',', '.');
    return s === '' || !/^[-+]?(\d+\.?\d*|\.\d+)$/.test(s) ? NaN : parseFloat(s);
  };
  /** Zahl oder fester Term ohne x: „2,5“, „e“, „π/2“, „2π“ (Zahlen in Maschinenschritten) */
  U.wertLesen = (t) => {
    const v = U.zahlLesen(t);
    if (Number.isFinite(v)) return v;
    const b = M.versuche(t);
    return b && !M.hatX(b) ? M.wert(b, 0) : NaN;
  };
  U.tempo = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches ? 0 : 1;
  U.warte = (ms) => new Promise((r) => setTimeout(r, ms * U.tempo));
  U.ansage = (text) => { const a = U.$('#ansage'); if (a) { a.textContent = ''; setTimeout(() => { a.textContent = text; }, 30); } };
  U.farbe = { f: 'var(--f)', g: 'var(--g)', h: 'var(--h)', vermutung: 'var(--vermutung)', geheim: 'var(--geheim)' };

  /** Chip eines Maschinenschritts als HTML (□ steht für die Zahl, die hineinkommt) */
  U.chipHtml = function (s, umgekehrt) {
    const Z = M.zahlSym;   // e und Vielfache von π als Zeichen
    const z = (v) => (v < 0 ? `(${Z(v)})` : Z(v));
    const v = s.v;
    if (umgekehrt) {
      switch (s.op) {
        case 'quad': return '±√□';
        case 'kubik': return '∛□';
        case 'wurzel': return '□<sup>2</sup>';
        case 'betrag': return '±□';
        case 'kehr': return '1 : □';
        case 'basis': return Z(v) === 'e' ? 'ln □' : `log<sub>${M.zahl(v)}</sub>□`;
        case 'ln': return 'e<sup>□</sup>';
        case 'hoch': return Number.isInteger(v) && v % 2 === 0 ? `±<sup>${M.zahl(v)}</sup>√□` : `<sup>${M.zahl(v)}</sup>√□`;
        default: return U.esc(M.umkehrChip(s));
      }
    }
    switch (s.op) {
      case 'add': return v < 0 ? `− ${Z(-v)}` : `+ ${Z(v)}`;
      case 'sub': return v < 0 ? `+ ${Z(-v)}` : `− ${Z(v)}`;
      case 'mul': return `· ${z(v)}`;
      case 'div': return `: ${z(v)}`;
      case 'quad': return '□<sup>2</sup>';
      case 'kubik': return '□<sup>3</sup>';
      case 'hoch': return `□<sup>${Z(v)}</sup>`;
      case 'wurzel': return '√□';
      case 'betrag': return '|□|';
      case 'kehr': return '1 : □';
      case 'basis': return `${Z(v)}<sup>□</sup>`;
      case 'subvon': return `${Z(v)} − □`;
      case 'divvon': return `${Z(v)} : □`;
      case 'sin': case 'cos': case 'tan': case 'ln': return `${s.op} □`;
      default: return '?';
    }
  };

  // ---------------------------------------------------------------------------
  // Tastenfeld und Termfeld
  // ---------------------------------------------------------------------------
  const TASTEN = [
    { t: 'x', ein: 'x', titel: 'Variable x' },
    { t: '□²', ein: '²', titel: 'hoch 2' },
    { t: '□³', ein: '³', titel: 'hoch 3' },
    { t: '□ⁿ', ein: '^', titel: 'hoch …' },
    { t: '√', ein: '√()', zurueck: 1, titel: 'Wurzel' },
    { t: '| |', ein: '||', zurueck: 1, titel: 'Betrag' },
    { t: '(', ein: '(' }, { t: ')', ein: ')' },
    { t: '·', ein: '·', titel: 'mal' }, { t: ':', ein: ':', titel: 'geteilt durch' },
    { t: '⌫', loesche: true, titel: 'Zeichen löschen' },
    { t: 'π e sin …', mehr: true, titel: 'Weitere Tasten: π, e, sin, cos, tan, ln' },
    // zweite Reihe, aufklappbar: Konstanten und Funktionen (Jg. 10 und E); Winkel im Bogenmaß
    { t: 'π', ein: 'π', titel: 'Kreiszahl π', reihe2: true },
    { t: 'e<sup>□</sup>', ein: 'e^()', zurueck: 1, titel: 'e hoch … (eulersche Zahl)' },
    { t: 'sin', ein: 'sin()', zurueck: 1, titel: 'Sinus' },
    { t: 'cos', ein: 'cos()', zurueck: 1, titel: 'Kosinus' },
    { t: 'tan', ein: 'tan()', zurueck: 1, titel: 'Tangens' },
    { t: 'ln', ein: 'ln()', zurueck: 1, titel: 'natürlicher Logarithmus' },
  ];
  // Die Reihe mit π, e, sin, cos, tan, ln ist zugeklappt, bis jemand sie öffnet oder einen solchen Term eintippt;
  // dann bleibt sie in allen Tastenfeldern offen. So bleibt das Tastenfeld für Jg. 7 bis 9 so klein wie bisher.
  let fktOffen = false;
  const zeigeFkt = () => U.$$('.tasten').forEach((t) => {
    t.classList.toggle('mit-fkt', fktOffen);
    const m = U.$('.taste-mehr', t);
    if (m) m.setAttribute('aria-expanded', String(fktOffen));
  });
  U.fktTastenAuf = () => { if (!fktOffen) { fktOffen = true; zeigeFkt(); } };
  /** Tastenfeld; ziel() liefert das Eingabefeld, in das geschrieben wird */
  U.tastenfeld = function (wurzel, ziel, nachher) {
    const t = U.el(`<div class="tasten${fktOffen ? ' mit-fkt' : ''}">${TASTEN.map((k, i) => `${k.reihe2 ? '<span class="tasten-umbruch" aria-hidden="true"></span>' : ''}<button type="button" class="taste${k.loesche ? ' taste-weg' : ''}${k.mehr ? ' taste-mehr' : ''}${i > 11 ? ' taste-fkt' : ''}" data-i="${i}" title="${k.titel || k.t}" aria-label="${k.titel || k.t}"${k.mehr ? ` aria-expanded="${fktOffen}"` : ''}>${k.t}</button>`).join('')}</div>`);
    wurzel.appendChild(t);
    t.addEventListener('mousedown', (e) => e.preventDefault());   // Fokus und Schreibmarke im Feld lassen
    t.addEventListener('click', (e) => {
      const b = e.target.closest('.taste');
      if (b && TASTEN[+b.dataset.i].mehr) { fktOffen = !fktOffen; zeigeFkt(); return; }
      const ein = ziel();
      if (!b || !ein) return;
      const k = TASTEN[+b.dataset.i];
      const hatFokus = document.activeElement === ein;
      const a = hatFokus ? ein.selectionStart : ein.value.length, z = hatFokus ? ein.selectionEnd : a;
      if (k.loesche) {
        if (a !== z) ein.setRangeText('', a, z, 'end');
        else if (a > 0) ein.setRangeText('', a - 1, a, 'end');
      } else {
        ein.setRangeText(k.ein === 'x' ? ein.dataset.var || 'x' : k.ein, a, z, 'end');
        if (k.zurueck) { const p = ein.selectionStart - k.zurueck; ein.setSelectionRange(p, p); }
      }
      ein.focus();
      ein.dispatchEvent(new Event('input', { bubbles: true }));
      if (nachher) nachher();
    });
    t.setzeVariable = (v) => { const b = U.$('.taste[data-i="0"]', t); b.textContent = v; b.title = b.ariaLabel = 'Variable ' + v; };
    return t;
  };

  /** Termfeld: f(x) = [Eingabe], Fehlermeldung darunter. opt: name, text, beiAenderung(baum, text), tasten, verdeckt, beiEnter, variable */
  U.termFeld = function (wurzel, opt) {
    let variable = opt.variable || 'x';
    const f = U.el(`<div class="termfeld${opt.verdeckt ? ' ist-verdeckt' : ''}">
      <label class="tf-zeile"><span class="tf-name">${opt.links || U.esc(opt.name) + '(' + variable + ') ='}</span>
        <input class="tf-ein" type="text" spellcheck="false" autocomplete="off" autocorrect="off" autocapitalize="off"
          placeholder="${U.esc(opt.platzhalter || 'z. B. 2x + 1')}" aria-label="Term für ${U.esc(opt.name)}(x)"></label>
      <div class="tf-tastenplatz"></div>
      <div class="tf-meldung" aria-live="polite"></div></div>`);
    wurzel.appendChild(f);
    const ein = U.$('input', f), meld = U.$('.tf-meldung', f);
    ein.dataset.var = variable;
    const tasten = opt.tasten !== false ? U.tastenfeld(U.$('.tf-tastenplatz', f), () => ein) : null;
    if (tasten) tasten.setzeVariable(variable);
    let baum = null;
    function pruefe(still) {
      const text = ein.value;
      if (/[eπ]|sin|cos|tan|ln|pi/i.test(text) && !opt.verdeckt) U.fktTastenAuf();
      try { baum = M.lies(text, { variable }); meld.textContent = ''; f.classList.remove('ist-fehler'); }
      catch (e) { baum = null; meld.textContent = text.trim() ? e.message : ''; f.classList.toggle('ist-fehler', !!text.trim()); }
      if (!still && opt.beiAenderung) opt.beiAenderung(baum, text);
    }
    ein.addEventListener('input', () => pruefe());
    ein.addEventListener('keydown', (e) => { if (e.key === 'Enter' && opt.beiEnter) { e.preventDefault(); opt.beiEnter(baum); } });
    const api = {
      el: f, ein,
      setze(text, still) { ein.value = text; pruefe(still); },
      get baum() { return baum; },
      get text() { return ein.value; },
      get variable() { return variable; },
      fokus() { ein.focus(); },
      /** Variable wechseln (x ↔ z); der Term wird mit dem neuen Namen neu geschrieben */
      setzeVariable(v, text) {
        variable = v;
        ein.dataset.var = v;
        U.$('.tf-name', f).textContent = `${opt.name}(${v}) =`;
        ein.placeholder = opt.platzhalter || `z. B. 2${v} + 1`;
        if (tasten) tasten.setzeVariable(v);
        api.setze(text, true);
      },
    };
    if (opt.text != null) api.setze(opt.text, true);
    return api;
  };

  // ---------------------------------------------------------------------------
  // Baukasten: Kette von Schritten  x → [· 2] → [+ 1] → f(x)
  // ---------------------------------------------------------------------------
  const KNOPF = { add: '+', sub: '−', mul: '·', div: ':', quad: '□²', kubik: '□³', wurzel: '√□', betrag: '|□|', kehr: '1 : □', basis: 'a<sup>□</sup>' };
  const KNOPF_TITEL = { add: 'addieren', sub: 'subtrahieren', mul: 'multiplizieren', div: 'dividieren', quad: 'quadrieren', kubik: 'hoch 3', wurzel: 'Wurzel ziehen', betrag: 'Betrag', kehr: 'Kehrwert', basis: 'eine Zahl hoch …' };
  const START = { add: 1, sub: 1, mul: 2, div: 2, basis: 2, hoch: 2, subvon: 10, divvon: 12 };
  U.baukasten = function (wurzel, opt) {
    let schritte = (opt.schritte || []).map((s) => Object.assign({}, s));
    let wahl = -1;
    const max = opt.max || 5;
    const b = U.el('<div class="baukasten"><div class="bk-kette"></div><div class="bk-bearbeiten"></div></div>');
    wurzel.appendChild(b);
    const kette = U.$('.bk-kette', b), bearb = U.$('.bk-bearbeiten', b);
    const melde = () => opt.beiAenderung && opt.beiAenderung(schritte.map((s) => Object.assign({}, s)));

    function zeichne() {
      const name = opt.name || 'f';
      kette.innerHTML = '<span class="bk-ende"><i>x</i></span>' + schritte.map((s, i) =>
        `<span class="bk-pfeil">→</span><button type="button" class="bk-chip${i === wahl ? ' ist-gewaehlt' : ''}" data-i="${i}" aria-label="Schritt ${i + 1} bearbeiten">${U.chipHtml(s)}</button>`).join('') +
        (schritte.length < max ? '<span class="bk-pfeil">→</span><button type="button" class="bk-plus" aria-label="Schritt hinzufügen" title="Schritt hinzufügen">+</button>' : '') +
        `<span class="bk-pfeil">→</span><span class="bk-ende">${U.esc(name)}(<i>x</i>)</span>`;
      bearb.classList.toggle('ist-leer', wahl < 0 || !schritte[wahl]);
      if (wahl < 0 || !schritte[wahl]) {
        bearb.innerHTML = `<p class="bk-tipp">${schritte.length ? 'Tippe auf einen Schritt, um ihn zu ändern, oder auf +.' : 'Tippe auf +, um den ersten Schritt einzubauen.'}</p>`;
        return;
      }
      const s = schritte[wahl], mitWert = M.schritte[s.op] && M.schritte[s.op].mitWert;
      const ops = (opt.bausteine || M.bausteine);
      bearb.innerHTML = `<div class="bk-zeile"><span class="bk-nr">Schritt ${wahl + 1}</span>
        <div class="bk-ops">${ops.map((op) => `<button type="button" class="bk-op${s.op === op ? ' ist-an' : ''}" data-op="${op}" title="${KNOPF_TITEL[op]}" aria-label="${KNOPF_TITEL[op]}">${KNOPF[op]}</button>`).join('')}</div></div>
        <div class="bk-zeile">${mitWert ? `<span class="bk-nr">Zahl</span><div class="bk-wert"><button type="button" class="bk-pm" data-d="-1" aria-label="kleiner">−</button>
          <input type="text" inputmode="decimal" value="${M.zahlSym(s.v)}" aria-label="Zahl für Schritt ${wahl + 1}"><button type="button" class="bk-pm" data-d="1" aria-label="größer">+</button></div>` : ''}
          ${s.op === 'basis' ? `<button type="button" class="bk-e${M.zahlSym(s.v) === 'e' ? ' ist-an' : ''}" title="eulersche Zahl e als Basis" aria-label="Basis e (eulersche Zahl)">Basis e</button>` : ''}
          <span class="bk-hinweis"></span>
          <button type="button" class="bk-weg">Schritt entfernen</button></div>`;
      const ein = U.$('input', bearb);
      if (ein) {
        ein.addEventListener('input', () => {
          const v = U.wertLesen(ein.value);
          setzeWert(v, false);
        });
        ein.addEventListener('blur', () => { ein.value = M.zahlSym(schritte[wahl] ? schritte[wahl].v : 0); });
      }
    }
    function gueltig(op, v) {
      if (!Number.isFinite(v)) return 'Bitte eine Zahl eintragen.';
      if (op === 'div' && v === 0) return 'Durch 0 kann man nicht teilen.';
      if (op === 'basis' && (v <= 0 || v === 1)) return 'Die Basis muss positiv und ungleich 1 sein.';
      return '';
    }
    function setzeWert(v, neuZeichnen) {
      const s = schritte[wahl];
      const fehler = gueltig(s.op, v);
      const h = U.$('.bk-hinweis', bearb);
      if (h) h.textContent = fehler;
      if (fehler) return;
      s.v = v;
      const chip = U.$(`.bk-chip[data-i="${wahl}"]`, kette);
      if (chip) chip.innerHTML = U.chipHtml(s);
      if (neuZeichnen) zeichne();
      melde();
    }
    b.addEventListener('click', (e) => {
      const chip = e.target.closest('.bk-chip');
      if (chip) { wahl = +chip.dataset.i === wahl ? -1 : +chip.dataset.i; zeichne(); return; }
      if (e.target.closest('.bk-plus')) {
        schritte.push({ op: 'add', v: 1 });
        wahl = schritte.length - 1;
        zeichne(); melde(); return;
      }
      const op = e.target.closest('.bk-op');
      if (op) {
        const s = schritte[wahl];
        s.op = op.dataset.op;
        if (M.schritte[s.op].mitWert) { if (gueltig(s.op, s.v)) s.v = START[s.op]; if (s.v === undefined) s.v = START[s.op]; }
        else delete s.v;
        zeichne(); melde(); return;
      }
      if (e.target.closest('.bk-e')) { setzeWert(Math.E, true); return; }
      const pm = e.target.closest('.bk-pm');
      if (pm) {
        const s = schritte[wahl];
        let v = (Number.isFinite(s.v) ? s.v : 0) + Number(pm.dataset.d);
        // von e oder einem Vielfachen von π aus zur nächsten ganzen Zahl
        if (Number.isFinite(s.v) && M.zahlSym(s.v) !== M.zahl(s.v)) v = Number(pm.dataset.d) > 0 ? Math.floor(s.v) + 1 : Math.ceil(s.v) - 1;
        if (s.op === 'div' && v === 0) v += Number(pm.dataset.d);
        if (s.op === 'basis' && v <= 1 && Number(pm.dataset.d) < 0) v = 0.5;
        if (s.op === 'basis' && v === 1.5 && Number(pm.dataset.d) > 0) v = 2;
        setzeWert(Math.round(v * 1000) / 1000, true); return;
      }
      if (e.target.closest('.bk-weg')) { schritte.splice(wahl, 1); wahl = Math.min(wahl, schritte.length - 1); zeichne(); melde(); }
    });
    zeichne();
    return {
      el: b,
      get schritte() { return schritte.map((s) => Object.assign({}, s)); },
      setze(neu) { schritte = neu.map((s) => Object.assign({}, s)); wahl = -1; zeichne(); },
    };
  };

  // ---------------------------------------------------------------------------
  // Editor: Baukasten oder Term
  // ---------------------------------------------------------------------------

    function ausBaukasten() { zustand.schritte = bk.schritte; zustand.baum = M.ausSchritten(zustand.schritte); zustand.text = M.text(zustand.baum); }

  // ---------------------------------------------------------------------------
  // Bewegung: Taktgeber (Tempo, Überspringen) und Zahlenplättchen (Bühne, Verknüpfen, Regler)
  // ---------------------------------------------------------------------------
  /** Taktgeber für Animationen. Richtet sich nach U.tempo (0 = sofort, so auch bei „Bewegung reduzieren“);
      eile() beendet alles, was gerade läuft, und alles Weitere geschieht sofort, bis ruhe() kommt (Überspringen). */
  U.takt = function () {
    const laufende = new Set(), wartende = new Set();
    let eilig = false;
    const faktor = () => (eilig ? 0 : U.tempo);
    return {
      get faktor() { return faktor(); },
      get eilig() { return eilig; },
      /** Web-Animation; der Endzustand bleibt stehen, bis der Aufrufer ihn festschreibt. null, wenn sofort. */
      async spiele(el, frames, ms, o) {
        const f = faktor();
        if (!f || !el || !el.animate) return null;
        const a = el.animate(frames, Object.assign({ duration: Math.max(1, ms * f), fill: 'forwards' }, o));
        laufende.add(a);
        try { await a.finished; } catch (e) { /* abgebrochen */ }
        laufende.delete(a);
        return a;
      },
      /** kurze Wirkung ohne Warten (Rattern, Stempeln, Aufblitzen) */
      effekt(el, frames, ms, o) {
        const f = faktor();
        if (!f || !el || !el.animate) return;
        const a = el.animate(frames, Object.assign({ duration: Math.max(1, ms * f) }, o));
        laufende.add(a);
        a.onfinish = a.oncancel = () => laufende.delete(a);
      },
      warte(ms) {
        const f = faktor();
        if (!f) return Promise.resolve();
        return new Promise((r) => { const w = { r, id: setTimeout(() => { wartende.delete(w); r(); }, ms * f) }; wartende.add(w); });
      },
      eile() {
        eilig = true;
        laufende.forEach((a) => { try { a.finish(); } catch (e) { a.cancel(); } });
        wartende.forEach((w) => { clearTimeout(w.id); w.r(); });
        wartende.clear();
      },
      ruhe() { eilig = false; },
    };
  };

  /** Zahl als Plättchen in einer Flugschicht. Punkte in px relativ zur Schicht: x, y, s (Größe), sx/sy (stauchen), o */
  U.plaettchen = function (schicht, takt, text, klasse) {
    const t = U.el(`<span class="b-token${klasse ? ' ' + klasse : ''}">${U.esc(text)}</span>`);
    schicht.appendChild(t);
    let pos = { x: 0, y: 0, s: 1, sx: 1, sy: 1, o: 1 };
    const voll = (p) => Object.assign({}, pos, { sx: 1, sy: 1 }, p);
    const tr = (p) => `translate(${p.x}px, ${p.y}px) translate(-50%, -50%) scale(${p.s * p.sx}, ${p.s * p.sy})`;
    const bild = (p) => ({ transform: tr(p), opacity: p.o });
    const fest = (p) => { pos = p; t.style.transform = tr(p); t.style.opacity = p.o; };
    const api = {
      el: t,
      get pos() { return pos; },
      setze(p) { fest(voll(p)); },
      /** auf geradem Weg */
      async zu(p, ms, easing) {
        const z = voll(p);
        const a = await takt.spiele(t, [bild(pos), bild(z)], ms, { easing: easing || 'cubic-bezier(.45,.05,.35,1)' });
        fest(z);
        if (a) a.cancel();
      },
      /** über mehrere Punkte in gleichen Zeitabständen */
      async bahn(punkte, ms, easing) {
        let p = pos;
        const ps = punkte.map((q) => (p = Object.assign({}, p, { sx: 1, sy: 1 }, q)));
        const a = await takt.spiele(t, [bild(pos)].concat(ps.map(bild)), ms, { easing: easing || 'linear' });
        fest(ps[ps.length - 1]);
        if (a) a.cancel();
      },
      /** im Bogen werfen: der höchste Punkt liegt h px über der höheren der beiden Stellen */
      wurf(p, ms, h) {
        const a = pos, z = voll(p), n = 16, pts = [];
        const scheitel = Math.min(a.y, z.y) - (h == null ? 50 : h);
        const cy = 2 * scheitel - (a.y + z.y) / 2;   // Kontrollpunkt der Bézierkurve, damit der Scheitel passt
        for (let i = 1; i <= n; i++) {
          const u = i / n;
          pts.push({ x: a.x + (z.x - a.x) * u, y: (1 - u) * (1 - u) * a.y + 2 * (1 - u) * u * cy + u * u * z.y, s: a.s + (z.s - a.s) * u, o: a.o + (z.o - a.o) * u });
        }
        return api.bahn(pts, ms);
      },
      /** stauchen und zurückfedern (Landen, Stempeln) */
      async federn(staerke, ms) {
        const k = staerke || 0.35, p = pos;
        const a = await takt.spiele(t, [bild(p), bild(Object.assign({}, p, { sx: 1 + k * 0.6, sy: 1 - k })),
          bild(Object.assign({}, p, { sx: 1 - k * 0.2, sy: 1 + k * 0.3 })), bild(p)], ms || 260, { easing: 'ease-out' });
        fest(p);
        if (a) a.cancel();
      },
      /** neue Zahl, mit kurzem Aufblitzen */
      text(s, klasse) {
        t.textContent = s;
        t.className = 'b-token' + (klasse ? ' ' + klasse : '');
        takt.effekt(t, [{ boxShadow: '0 0 0 9px rgba(242, 176, 74, .9)' }, { boxShadow: '0 0 0 0 rgba(242, 176, 74, 0)' }], 450, { easing: 'ease-out' });
      },
      weg() { t.remove(); },
    };
    return api;
  };
  /** Mitte eines Elements relativ zu einem Bezugselement (für Flugschichten) */
  U.mitteIn = function (el, bezug) {
    const r = el.getBoundingClientRect(), o = bezug.getBoundingClientRect();
    return { x: r.left - o.left + r.width / 2, y: r.top - o.top + r.height / 2, h: r.height, w: r.width };
  };
  /** kurz aufploppen lassen (Blase, Chip) */
  U.ploppen = (takt, el) => takt.effekt(el, [{ transform: 'scale(1)' }, { transform: 'scale(1.18)' }, { transform: 'scale(.96)' }, { transform: 'scale(1)' }], 340, { easing: 'ease-out' });
  /** Baustein stempelt: drückt nach unten und federt zurück; die Maschine rattert dabei */
  U.stempeln = (takt, chip, koerper) => {
    takt.effekt(chip, [{ transform: 'translateY(0)' }, { transform: 'translateY(7px) scale(1.06)', offset: 0.45 }, { transform: 'translateY(0)' }], 300, { easing: 'ease-in-out' });
    if (koerper) takt.effekt(koerper, [{ transform: 'translate(0, 0)' }, { transform: 'translate(1.6px, -1px) rotate(.5deg)' }, { transform: 'translate(-1.6px, 1px) rotate(-.5deg)' }, { transform: 'translate(0, 0)' }], 130, { iterations: 2 });
  };

  // ---------------------------------------------------------------------------
  // Bühne: Beutel (Definitionsmenge) → Trichter → Band → Maschine → Band → Wertemenge
  // ---------------------------------------------------------------------------
  const ZAHNRAD = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15.2a3.2 3.2 0 1 0 0-6.4 3.2 3.2 0 0 0 0 6.4Zm7.4-1.9 1.9 1.5-1.8 3.1-2.3-.8a7.6 7.6 0 0 1-2 1.2L14.8 21h-3.6l-.4-2.4a7.6 7.6 0 0 1-2-1.2l-2.3.8-1.8-3.1 1.9-1.5a7.7 7.7 0 0 1 0-2.4L4.7 9.6l1.8-3.1 2.3.8a7.6 7.6 0 0 1 2-1.2L11.2 3h3.6l.4 2.4a7.6 7.6 0 0 1 2 1.2l2.3-.8 1.8 3.1-1.9 1.5a7.7 7.7 0 0 1 0 2.4Z"/></svg>';
  const TRICHTER = '<svg viewBox="0 0 44 36" aria-hidden="true"><path class="tr-k" d="M3 4h38L27 21v12H17V21Z"/><path class="tr-r" d="M3 4h38"/></svg>';
  /** opt: rechne(x) → y, kette() → Schritte oder null, beiFertig(x, y), beiChip(x), beiLauf(laeuft), titelD, titelW, ohneW.
      Mehrere Zahlen laufen wie am Fließband: Die nächste fliegt schon in den Trichter, während die vorige in der Maschine
      ist; in der Maschine ist immer nur eine Zahl. */
  U.buehne = function (wurzel, opt) {
    const b = U.el(`<div class="buehne${opt.ohneW ? ' ohne-w' : ''}">
      <div class="b-sp"><div class="b-titel">${opt.titelD || 'Definitionsmenge <i>D</i>'}</div><div class="b-beutel"><div class="b-chips b-ein"></div></div></div>
      <div class="b-mitte">
        <div class="b-band b-band-ein"><span class="b-trichter">${TRICHTER}</span></div>
        <div class="b-koerper"><span class="b-lampe" aria-hidden="true"></span><span class="b-rad b-rad1">${ZAHNRAD}</span><span class="b-rad b-rad2">${ZAHNRAD}</span>
          <span class="b-schlitz b-schlitz-ein" aria-hidden="true"></span><span class="b-schlitz b-schlitz-aus" aria-hidden="true"></span>
          <div class="b-schloss" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="10.5" width="14" height="10" rx="2.5"/><path d="M8.5 10.5V8a3.5 3.5 0 0 1 7 0v2.5"/></svg>geheim</div>
          <div class="b-fenster"></div></div>
        <div class="b-band b-band-aus"><span></span></div>
      </div>
      <div class="b-sp"><div class="b-titel">${opt.titelW || 'Wertemenge <i>W</i>'}</div><div class="b-beutel b-beutel-aus"><div class="b-chips b-aus"></div><p class="b-leer">Noch nichts ausgegeben.</p></div></div>
      <svg class="b-pfeile" aria-hidden="true"></svg>
      <div class="b-flug" aria-hidden="true"></div></div>`);
    wurzel.appendChild(b);
    const ein = U.$('.b-ein', b), aus = U.$('.b-aus', b), flug = U.$('.b-flug', b), koerper = U.$('.b-koerper', b), fenster = U.$('.b-fenster', b);
    const bandEin = U.$('.b-band-ein', b), bandAus = U.$('.b-band-aus', b), trichter = U.$('.b-trichter', b);
    const pfeilSvg = U.$('.b-pfeile', b);
    const takt = U.takt();
    let einlass = Promise.resolve(), ausgang = Promise.resolve(), laufend = 0;
    const unterwegs = new Set();
    let werteAus = new Map();   // y-Text → Chip
    let fensterHtml = '', verdeckt = false;
    let paare = [], diagramm = false, gewaehlt = null;
    const frisch = new Map();   // x → { bis: Zeitpunkt des Ausblendens, gezeichnet: schon einmal gezeigt? }

    const mitte = (el) => U.mitteIn(el, b);
    function chipAus(y) {
      const text = M.zahl(y);
