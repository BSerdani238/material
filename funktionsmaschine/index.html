      U.$('.b-leer', b).hidden = true;
      if (werteAus.has(text)) return werteAus.get(text);
      const c = U.el(`<span class="b-chip b-chip-aus ist-neu" data-y="${U.esc(text)}">${text}</span>`);
      const nach = Array.from(aus.children).find((k) => U.zahlLesen(k.dataset.y) > y);
      aus.insertBefore(c, nach || null);
      werteAus.set(text, c);
      return c;
    }

    // ---- Pfeile von D nach W (Pfeildiagramm) ----
    function zeichnePfeile() {
      if (opt.ohneW) return;
      const jetzt = Date.now();
      const istFrisch = (x) => frisch.has(x) && frisch.get(x).bis > jetzt;
      const liste = paare.filter(([x, y]) => Number.isFinite(y) && (diagramm || istFrisch(x) || gewaehlt === x));
      const spitze = (id, farbe) => `<marker id="${id}" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M0,0 L11,5.5 L0,11 Z" style="fill:${farbe}"/></marker>`;
      let h = '<defs>' + spitze(PID, 'var(--mf)') + spitze(PID + 'g', 'var(--gold)') + '</defs>';
      liste.forEach(([x, y]) => {
        const c1 = U.$(`.b-chip[data-x="${x}"]`, ein), c2 = werteAus.get(M.zahl(y));
        if (!c1 || !c2 || c2.style.visibility === 'hidden') return;
        // vom rechten Rand der Zahl in D im Bogen zum linken Rand ihres Werts in W
        const a = mitte(c1), z = mitte(c2);
        const xa = a.x + a.w / 2 - 2, xz = z.x - z.w / 2 - 3;
        const oben = Math.max(4, Math.min(a.y, z.y) - 46);
        const mx = (xa + xz) / 2;
        const sel = gewaehlt === x, f = frisch.get(x), neu = f && f.bis > jetzt && !f.gezeichnet;
        if (neu) f.gezeichnet = true;
        h += `<g class="b-pfeil${sel ? ' ist-gewaehlt' : ''}${istFrisch(x) ? ' ist-frisch' : ''}${neu ? ' ist-neu' : ''}${diagramm ? ' im-diagramm' : ''}"><path d="M${xa.toFixed(1)},${a.y.toFixed(1)} Q${mx.toFixed(1)},${oben.toFixed(1)} ${xz.toFixed(1)},${z.y.toFixed(1)}" marker-end="url(#${PID}${sel ? 'g' : ''})" pathLength="1"/>` +
          '</g>';
      });
      // eine Beschriftung über der Maschine: das gewählte Paar, sonst das zuletzt abgebildete
      const zuletzt = liste.filter(([x]) => istFrisch(x)).sort((p, q) => frisch.get(q[0]).bis - frisch.get(p[0]).bis)[0];
      const schild = liste.find(([x]) => x === gewaehlt) || zuletzt;
      if (schild) {
        const m = mitte(koerper);
        h += `<text class="b-schild${schild[0] === gewaehlt ? ' ist-gewaehlt' : ''}" x="${m.x.toFixed(1)}" y="${(m.y - m.h / 2 - 12).toFixed(1)}" text-anchor="middle">${M.zahl(schild[0])} ↦ ${M.zahl(schild[1])}</text>`;
      }
      pfeilSvg.innerHTML = h;
    }
    const PID = 'pf' + Math.random().toString(36).slice(2, 7);
    if (window.ResizeObserver) new ResizeObserver(() => zeichnePfeile()).observe(b);

    function meldeLauf() {
      b.classList.toggle('laeuft', laufend > 0);
      if (opt.beiLauf) opt.beiLauf(laufend > 0);
    }

    // ---- Ein Durchlauf: Beutel → Trichter → Band → Einlass → Baustein für Baustein → Auswurf → Band → Wertemenge ----
    async function durchlauf(x, warteBand, warteMaschine, gibBand, gibMaschine) {
      const y = opt.rechne(x);
      let tok = null, inMaschine = false;
      try {
        await warteBand;                     // die Zahl davor ist schon in der Maschine
        const chip = U.$(`.b-chip[data-x="${x}"]`, ein);
        unterwegs.add(x);
        if (chip) chip.classList.add('ist-unterwegs');
        const be = mitte(bandEin), ke = mitte(koerper), tr = mitte(trichter);
        const bandY = be.y - be.h / 2 - 13;  // Mitte des Plättchens, wenn es auf dem Band liegt
        tok = U.plaettchen(flug, takt, M.zahl(x));
        tok.setze(Object.assign({ s: 1 }, chip ? mitte(chip) : mitte(U.$('.b-beutel', b))));
        // 1. im Bogen über den Trichter, hineinfallen (der Trichter wackelt), unten aufs Band
        await tok.wurf({ x: tr.x, y: tr.y - tr.h / 2 - 8, s: 0.85 }, 560, 42);
        takt.effekt(trichter, [{ transform: 'rotate(0)' }, { transform: 'rotate(-8deg)' }, { transform: 'rotate(6deg)' }, { transform: 'rotate(-2deg)' }, { transform: 'rotate(0)' }], 420);
        await tok.zu({ x: be.x - be.w / 2 + 16, y: bandY, s: 0.8 }, 280, 'cubic-bezier(.55, 0, 1, .45)');
        await tok.federn(0.32, 220);
        // 2. auf dem Band bis vor den Einlass; dort warten, bis die Maschine frei ist
        await tok.zu({ x: ke.x - ke.w / 2 - 14, y: bandY, s: 0.8 }, 420, 'linear');
        await warteMaschine;
        // 3. durch den Schlitz hinein
        await tok.zu({ x: ke.x - ke.w / 2 + 2, y: bandY + 6, s: 0.8, sx: 0.2, o: 0.3 }, 170, 'ease-in');
        inMaschine = true;
        gibBand();                           // die nächste Zahl darf schon in den Trichter
        koerper.classList.add('arbeitet');
        const schritte = !verdeckt && opt.kette ? opt.kette() : null;
        const chips = U.$$('.mf-chip', fenster);
        chips.forEach((c) => { c.removeAttribute('data-wert'); c.classList.remove('ist-aktiv', 'ist-fertig', 'ist-fehler'); });
        const fe = mitte(fenster);
        tok.setze({ x: fe.x - fe.w / 2 + 8, y: fe.y + fe.h / 2 - 2, s: 0.5, o: 0 });
        let ok = true;
        if (schritte && schritte.length && chips.length === schritte.length) {
          // 4. von Baustein zu Baustein: Der Baustein stempelt, die Zahl wird umgewandelt, darüber bleibt ihr neuer Wert stehen
          let v = x;
          for (let i = 0; i < schritte.length; i++) {
            const c = mitte(chips[i]);
            await tok.wurf({ x: c.x, y: c.y + c.h / 2 + 13, s: 0.8, o: 1 }, i ? 280 : 220, 14);
            chips[i].classList.add('ist-aktiv');
            koerper.classList.add('presst');
            U.stempeln(takt, chips[i], koerper);
            await takt.warte(140);           // der Stempel trifft
            v = M.schrittWert(schritte[i], v);
            const t = Number.isFinite(v) ? M.zahl(v) : 'n. d.';
            tok.text(t, Number.isFinite(v) ? '' : 'ist-nd');
            await tok.federn(0.42, 260);
            koerper.classList.remove('presst');
            chips[i].dataset.wert = t;
            chips[i].classList.remove('ist-aktiv');
            chips[i].classList.add(Number.isFinite(v) ? 'ist-fertig' : 'ist-fehler');
            if (!Number.isFinite(v)) { ok = false; break; }
            await takt.warte(110);
          }
        } else {
          // geheime Maschine oder Term: Die Zahl verschwindet im Inneren, die Maschine rattert, heraus kommt das Ergebnis
          await tok.zu({ x: fe.x, y: fe.y, s: verdeckt ? 0.4 : 0.7, o: verdeckt ? 0.6 : 1 }, 280);
          koerper.classList.add('presst');
          for (let i = 0; i < (verdeckt ? 4 : 3); i++) { U.stempeln(takt, null, koerper); await takt.warte(170); }
          koerper.classList.remove('presst');
        }
        if (!Number.isFinite(y)) ok = false;
        if (!ok) { koerper.classList.add('stoerung'); setTimeout(() => koerper.classList.remove('stoerung'), 900); }
        // 5. Auswurf auf der anderen Seite
        await tok.zu({ x: ke.x + ke.w / 2 - 2, y: bandY + 6, s: 0.8, sx: 0.2, o: 0.3 }, 220, 'ease-in');
        koerper.classList.remove('arbeitet', 'presst');
        inMaschine = false;
        gibMaschine();                       // die nächste Zahl darf hinein
        const ba = mitte(bandAus);
        tok.text(Number.isFinite(y) ? M.zahl(y) : 'n. d.', 'raus' + (Number.isFinite(y) ? '' : ' ist-nd'));
        await tok.zu({ x: ke.x + ke.w / 2 + 16, y: bandY, s: 0.8, o: 1 }, 170, 'ease-out');
        await tok.zu({ x: ba.x + ba.w / 2 - 10, y: bandY, s: 0.8 }, 380, 'linear');
        // 6. in die Wertemenge fallen und dort aufploppen (nicht definiert: fällt vom Band und verschwindet)
        let ziel = null;
        if (Number.isFinite(y) && !opt.ohneW) { ziel = chipAus(y); ziel.style.visibility = 'hidden'; }
        if (ziel) {
          await tok.wurf(Object.assign({ s: 1 }, mitte(ziel)), 460, 30);
          ziel.style.visibility = '';
          ziel.classList.remove('ist-neu'); void ziel.offsetWidth; ziel.classList.add('ist-neu');
        } else {
          await tok.zu({ x: ba.x + ba.w / 2 + 18, y: bandY + 60, s: 0.7, o: 0 }, 460, 'cubic-bezier(.55, 0, 1, .45)');
        }
      } finally {
        if (tok) tok.weg();
        gibBand();
        if (inMaschine) koerper.classList.remove('arbeitet', 'presst');
        gibMaschine();
        unterwegs.delete(x);
      }
      // der Beutel kann inzwischen neu gezeichnet worden sein
      const chipNeu = U.$(`.b-chip[data-x="${x}"]`, ein);
      if (chipNeu) { chipNeu.classList.remove('ist-unterwegs'); chipNeu.classList.add('ist-benutzt'); }
      if (Number.isFinite(y)) {
        frisch.set(x, { bis: Date.now() + 4000, gezeichnet: false });
        setTimeout(zeichnePfeile, 4050);
      }
      if (opt.beiFertig) opt.beiFertig(x, y);
      zeichnePfeile();
      return y;
    }
    ein.addEventListener('click', (e) => {
      const c = e.target.closest('.b-chip');
      if (!c) return;
      const x = Number(c.dataset.x);
      if (opt.beiChip && opt.beiChip(x) === false) return;
      api.einwerfen(x);
    });
    const api = {
      el: b,
      setzeBeutel(werte, benutzt) {
        ein.innerHTML = werte.map((x) => `<button type="button" class="b-chip${benutzt && benutzt.has(x) ? ' ist-benutzt' : ''}${unterwegs.has(x) ? ' ist-unterwegs' : ''}" data-x="${x}" aria-label="${M.zahl(x)} einwerfen">${M.zahl(x)}</button>`).join('');
      },
      setzeAusgaben(ys) {
        if (opt.ohneW) return;
        aus.innerHTML = ''; werteAus = new Map();
        ys.filter(Number.isFinite).sort((p, q) => p - q).forEach((y) => { const c = chipAus(y); c.classList.remove('ist-neu'); });
        U.$('.b-leer', b).hidden = aus.children.length > 0;
      },
      /** Wertepaare für das Pfeildiagramm: [[x, y], …]; diagramm = alle Pfeile dauerhaft zeigen */
      setzePaare(neu, alle) { paare = neu; diagramm = !!alle; zeichnePfeile(); },
      setzeMaschine(html, geheim) {
        // nur neu schreiben, wenn sich etwas ändert: so bleiben die Zwischenwerte des letzten Durchlaufs stehen
        if (html !== fensterHtml) { fenster.innerHTML = html; fensterHtml = html; }
        verdeckt = !!geheim;
        U.$('.b-schloss', b).hidden = !geheim;
        koerper.classList.toggle('ist-verdeckt', !!geheim);
      },
      setzeFarbe(farbe) { b.style.setProperty('--mf', farbe); },
      markiere(x, y) {
        U.$$('.b-chip', b).forEach((c) => c.classList.remove('ist-markiert'));
        gewaehlt = x == null ? null : x;
        if (x != null) {
          const c = U.$(`.b-chip[data-x="${x}"]`, ein);
          if (c) c.classList.add('ist-markiert');
          if (Number.isFinite(y)) { const d = werteAus.get(M.zahl(y)); if (d) d.classList.add('ist-markiert'); }
        }
        zeichnePfeile();
      },
      /** Zahl einwerfen. Mehrere Aufrufe laufen wie am Fließband; das Versprechen erfüllt sich, wenn diese Zahl angekommen ist. */
      einwerfen(x) {
        const warteBand = einlass, warteMaschine = ausgang;
        let gibBand, gibMaschine;
        einlass = new Promise((r) => { gibBand = r; });
        ausgang = new Promise((r) => { gibMaschine = r; });
        laufend++;
        meldeLauf();
        return durchlauf(x, warteBand, warteMaschine, gibBand, gibMaschine).finally(() => {
          laufend--;
          if (!laufend) takt.ruhe();
          meldeLauf();
        });
      },
      /** alle laufenden Zahlen sofort ankommen lassen */
      ueberspringen() { if (laufend) takt.eile(); },
      get beschaeftigt() { return laufend > 0; },
    };
    return api;
  };

  // ---------------------------------------------------------------------------
  // Wertetabelle (waagerecht wie im Heft)
  // ---------------------------------------------------------------------------
  /** opt: beiAuswahl(x, zeile) ; setze({ xs, zeilen: [{ name, farbe, wert(x) → y|undefined, klasse(x) }], auswahl: { x, zeile }, diff, quot, leer }) */
  U.tabelle = function (wurzel, opt) {
    const t = U.el('<div class="wt"><div class="wt-roll"></div></div>');
    wurzel.appendChild(t);
    const roll = U.$('.wt-roll', t);
    let d = null;
    roll.addEventListener('click', (e) => {
      const td = e.target.closest('td[data-x]');
      if (td && opt.beiAuswahl) opt.beiAuswahl(Number(td.dataset.x), td.dataset.z ? Number(td.dataset.z) : 0);
    });
    function zelle(v) { return v === undefined ? '' : M.zahl(v); }
    const api = {
      setze(neu) {
        d = neu;
        if (!d.xs.length) { roll.innerHTML = `<p class="wt-leer">${d.leer || 'Noch keine Zahl eingeworfen.'}</p>`; return; }
        const aw = d.auswahl || {};
        const xText = d.xText || M.zahl;   // xText: etwa π/2 statt 1,571 bei Sinus & Co.
        let h = '<table><tbody><tr><th scope="row"><i>x</i></th>' + d.xs.map((x) => `<td data-x="${x}" class="wt-x${aw.x === x ? ' ist-gewaehlt' : ''}">${xText(x)}</td>`).join('') + '</tr>';
        d.zeilen.forEach((z, zi) => {
          h += `<tr class="wt-zeile"><th scope="row" style="color:${z.farbe}">${z.name}</th>` + d.xs.map((x) => {
            const v = z.wert(x);
            const kl = (z.klasse && z.klasse(x)) || '';
            return `<td data-x="${x}" data-z="${zi}" class="${kl}${aw.x === x && (aw.zeile || 0) === zi ? ' ist-gewaehlt' : ''}${v !== undefined && !Number.isFinite(v) ? ' ist-nd' : ''}">${zelle(v)}</td>`;
          }).join('') + '</tr>';
        });
        // Differenzen und Quotienten der ersten Zeile bei aufeinanderfolgenden x
        const z0 = d.zeilen[0];
        const reihe = (name, rechne, titel) => {
          h += `<tr class="wt-diff"><th scope="row" title="${titel}">${name}</th>` + d.xs.map((x, i) => {
            if (i === 0) return '<td></td>';
            const v = rechne(i);
            return `<td>${v === null ? '' : `<span>${v}</span>`}</td>`;
          }).join('') + '</tr>';
        };
        const wert = (i) => (z0 ? z0.wert(d.xs[i]) : undefined);
        const nachbar = (i) => i > 0 && M.gleich(d.xs[i] - d.xs[i - 1], 1) && Number.isFinite(wert(i)) && Number.isFinite(wert(i - 1));
        const d1 = (i) => (nachbar(i) ? wert(i) - wert(i - 1) : null);
        if (d.diff && z0) {
          const mitZeichen = (v) => (v > 1e-12 ? '+' : '') + M.zahl(v);
          reihe('1. Diff.', (i) => { const v = d1(i); return v === null ? null : mitZeichen(v); }, 'Unterschied zum linken Nachbarn');
          reihe('2. Diff.', (i) => { if (i < 2) return null; const a = d1(i), c = d1(i - 1); return a === null || c === null ? null : mitZeichen(a - c); }, 'Unterschied der 1. Differenzen');
        }
        if (d.quot && z0) reihe('Quotient', (i) => (nachbar(i) && wert(i - 1) !== 0 ? '· ' + M.zahl(wert(i) / wert(i - 1)) : null), 'Faktor zum linken Nachbarn');
        h += '</tbody></table>';
        roll.innerHTML = h;
        const sel = U.$('.ist-gewaehlt', roll);
        if (sel) sel.scrollIntoView({ block: 'nearest', inline: 'nearest' });
      },
    };
    return api;
  };

  /** Kleine Ein/Aus-Schalter (Checkbox im Chip-Stil) */
  U.schalter = (id, text, an) => `<label class="schalter"><input type="checkbox" id="${id}"${an ? ' checked' : ''}><span>${text}</span></label>`;
})(window.FW = window.FW || {});

</script>
<script >
/* Funktionswerkstatt · Modus „Maschine“
   Zahlen aus dem Beutel (Definitionsmenge) durch die Maschine schicken. Vorschrift im Baukasten oder als Term; zwei
   Vorschriften f und g. Wortvorschrift, Term, Wertetabelle und Graph zeigen dieselbe Funktion; ein angetipptes
   Wertepaar leuchtet überall auf und wird vorgerechnet. */
(function (FW) {
  'use strict';
  const M = FW.mathe, U = FW.ui;
  FW.modi = FW.modi || {};

  /** Maschinenfenster: Name und Schritte als Chips, sonst der Term */
  FW.maschinenFenster = function (name, baum, schritte) {
    const k = schritte || (baum ? M.kette(baum) : null);
    if (k && k.length) return `<span class="mf-name">${name}</span>` + k.map((s) => `<span class="mf-chip">${U.chipHtml(s)}</span>`).join('');
    if (k && !k.length) return `<span class="mf-name">${name}</span><span class="mf-leer">gibt x unverändert aus</span>`;
    return `<span class="mf-name">${name}</span><span class="mf-term">${baum ? M.html(baum) : '?'}</span>`;
  };
  /** „f(3) = 2 · 3 + 1 = 7“ und die Kette 3 → 6 → 7 */
  FW.rechnung = function (name, baum, x) {
    const y = M.wert(baum, x);
    const ergebnis = Number.isFinite(y) ? M.zahlCa(y) : 'nicht definiert';
    const ein = M.eingesetzt(baum, x, true);
    const mitte = !M.hatX(baum) || M.text(M.ersetze(baum, M.k.zahl(x))) === M.zahl(x) ? '' : ` = ${ein}`;
    let h = `<span class="term">${name}(${M.zahl(x)})</span>${mitte} = <b>${ergebnis}</b>`;
    const k = M.kette(baum);
    if (k && k.length > 1) {
      let v = x;
      h += '<span class="rk-kette">' + `<span class="rk-wert">${M.zahl(v)}</span>` + k.map((s) => {
        v = M.schrittWert(s, v);
        return `<span class="rk-schritt">${U.chipHtml(s)}</span><span class="rk-wert">${Number.isFinite(v) ? M.zahl(v) : 'n. d.'}</span>`;
      }).join('') + '</span>';
    }
    if (!Number.isFinite(y)) h += `<span class="rk-hinweis">${FW.warumNichtDefiniert(baum, x)}</span>`;
    return h;
  };
  /** „Alle einwerfen“ wie am Fließband: die Zahlen laufen dicht hintereinander, etwas schneller als einzeln */
  FW.alleEinwerfen = async function (buehne, liste) {
    const tempo = U.tempo;
    U.tempo = tempo * 0.55;
    try { await Promise.all(liste.map((x) => buehne.einwerfen(x))); } finally { U.tempo = tempo; }
  };
  /** Beschriftung des Knopfs „Alle einwerfen“ während eines Laufs */
  FW.alleKnopf = function (knopf, laeuft, kurz) {
    if (!knopf) return;
    if (!knopf.dataset.text) knopf.dataset.text = knopf.textContent;
    const an = laeuft && U.tempo > 0;
    knopf.textContent = an ? (kurz ? '⏭' : 'Überspringen ⏭') : knopf.dataset.text;
    knopf.title = an ? 'Überspringen: die Zahlen sofort ankommen lassen' : '';
    if (an) knopf.setAttribute('aria-label', 'Überspringen'); else knopf.removeAttribute('aria-label');
    knopf.classList.toggle('ist-sprung', an);
  };
  FW.warumNichtDefiniert = function (baum, x) {
    let grund = 'Für diese Zahl gibt die Maschine nichts aus.';
    (function such(n) {
      if (!n || typeof n !== 'object') return;
      if (n.t === 'sqrt' && M.wert(n.a, x) < 0) grund = 'Unter der Wurzel stünde eine negative Zahl.';
      if (n.t === 'div' && Math.abs(M.wert(n.b, x)) < 1e-12) grund = 'Man müsste durch 0 teilen.';
      if ((n.t === 'log' || (n.t === 'fkt' && n.n === 'ln')) && !(M.wert(n.a, x) > 0)) grund = 'Den Logarithmus gibt es nur von positiven Zahlen.';
      if (n.t === 'fkt' && n.n === 'tan' && Math.abs(Math.cos(M.wert(n.a, x))) < 1e-12) grund = 'Dort ist cos = 0: Der Tangens hat hier eine Polstelle.';
      such(n.a); such(n.b);
    })(baum);
    return grund;
  };

  FW.modi.maschine = {
    titel: 'Maschine',
    baue(wurzel) {
      wurzel.innerHTML = `<div class="raster raster-maschine">
        <section class="karte k-buehne">
          <header class="k-kopf"><h2>Funktionsmaschine</h2>
            <div class="slots" role="group" aria-label="Welche Vorschrift rechnet?">
              <button type="button" class="slot" data-fn="f" style="--sf:var(--f)">f</button>
              <button type="button" class="slot" data-fn="g" style="--sf:var(--g)">g</button></div>
            <div class="k-aktionen"><button type="button" class="knopf haupt" data-akt="alle">Alle einwerfen</button>
              <button type="button" class="knopf" data-akt="neu">Neue Zahlen</button><button type="button" class="knopf" data-akt="leeren">Leeren</button></div>
          </header>
          <div class="m-buehne"></div>
        </section>
        <section class="karte k-editor">
          <header class="k-kopf"><h2>Vorschrift von <span class="m-name">f</span></h2></header>
          <div class="m-editor"></div>
          <dl class="darstellungen">
            <div><dt>In Worten</dt><dd class="m-worte"></dd></div>
            <div><dt>Term</dt><dd class="m-term"></dd></div>
            <div class="m-rechnung-z"><dt>Rechnung</dt><dd class="m-rechnung"></dd></div>
          </dl>
        </section>
        <section class="karte k-graph"><div class="graph-kasten m-graph"></div><div class="legende m-legende"></div></section>
        <section class="karte k-tabelle"><header class="k-kopf"><h2>Wertetabelle</h2><span class="k-tipp">Tippe auf ein Wertepaar: Es leuchtet in Tabelle, Graph und Maschine auf.</span></header><div class="m-tabelle"></div></section>
      </div>`;
      const $ = (s) => U.$(s, wurzel);
      const fns = {
        f: { name: 'f', farbe: U.farbe.f, def: { art: 'baukasten', schritte: [{ op: 'mul', v: 2 }, { op: 'add', v: 1 }] }, benutzt: true, sichtbar: true, xs: new Set() },
        g: { name: 'g', farbe: U.farbe.g, def: { art: 'baukasten', schritte: [{ op: 'mul', v: -1 }, { op: 'add', v: 4 }] }, benutzt: false, sichtbar: true, xs: new Set() },
      };
      Object.values(fns).forEach((F) => { F.baum = M.ausSchritten(F.def.schritte); });
      let aktiv = 'f', rechnet = 'f', beutel = FW.zieheZahlen(), auswahl = null, gewaehltZahl = 0;

      const ed = U.editor($('.m-editor'), {
        name: 'f', schritte: fns.f.def.schritte,
        beiAenderung(z) {
          const F = fns[aktiv];
          F.def = z.art === 'term' ? { art: 'term', text: z.text } : { art: 'baukasten', schritte: z.schritte };
          if (z.baum) F.baum = z.baum;
          aktualisiere();
        },
      });
      const buehne = U.buehne($('.m-buehne'), {
        rechne(x) { rechnet = aktiv; return M.fn(fns[aktiv].baum)(x); },
        kette() { const F = fns[aktiv]; return F.def.art === 'baukasten' ? F.def.schritte : M.kette(F.baum); },
        beiFertig(x, y) {
          fns[rechnet].xs.add(x);
          auswahl = { x, fn: rechnet };
          U.ansage(`${rechnet}(${M.zahl(x)}) = ${Number.isFinite(y) ? M.zahl(y) : 'nicht definiert'}`);
          aktualisiere();
        },
        // solange Zahlen unterwegs sind, wird aus „Alle einwerfen“ „Überspringen“
        beiLauf(an) { FW.alleKnopf(U.$('[data-akt="alle"]', wurzel), an); },
      });
      // Schalter für das Pfeildiagramm unter der Maschine, wo die Bühne Platz hat
      U.$('.b-mitte', buehne.el).insertAdjacentHTML('beforeend', `<div class="b-unter" title="Alle Pfeile von D nach W zeigen">${U.schalter('m-pfeile', 'Pfeildiagramm', false)}</div>`);
      const graph = new FW.Graph($('.m-graph'), { beiPunkt(id) { const [fn, x] = id.split(':'); auswahl = { x: Number(x), fn }; gewaehltZahl++; aktualisiere(); } });
      let zeilenSchluessel = [];
      const tabelle = U.tabelle($('.m-tabelle'), { beiAuswahl(x, z) { auswahl = { x, fn: zeilenSchluessel[z] || aktiv }; gewaehltZahl++; aktualisiere(); } });

      function aktualisiere() {
        const F = fns[aktiv];
        U.$$('.slot', wurzel).forEach((b) => b.setAttribute('aria-pressed', b.dataset.fn === aktiv ? 'true' : 'false'));
        $('.m-name').textContent = aktiv;
        $('.m-name').style.color = F.farbe;
        buehne.setzeFarbe(F.farbe);
        buehne.setzeMaschine(FW.maschinenFenster(aktiv, F.baum, F.def.art === 'baukasten' ? F.def.schritte : null));
        buehne.setzeBeutel(beutel, F.xs);
        const fF = M.fn(F.baum);
        buehne.setzeAusgaben([...F.xs].map(fF));
        buehne.setzePaare([...F.xs].map((x) => [x, fF(x)]), $('#m-pfeile').checked);
        $('.m-term').innerHTML = `<span class="term">${aktiv}(<i class="var">x</i>) = </span>${M.html(F.baum)}`;
        $('.m-worte').textContent = M.inWorten(F.baum);
        const A = auswahl && fns[auswahl.fn];
        $('.m-rechnung-z').hidden = !A;
        if (A) $('.m-rechnung').innerHTML = FW.rechnung(auswahl.fn, A.baum, auswahl.x);
        buehne.markiere(A && auswahl.fn === aktiv ? auswahl.x : null, A ? M.wert(A.baum, auswahl.x) : NaN);
        // Graph
        const serien = [], punkte = [];
        ['f', 'g'].forEach((k) => {
          const G = fns[k];
          if (!G.benutzt || !G.sichtbar) return;
          const fn = M.fn(G.baum);
          serien.push({ fn, farbe: G.farbe, breite: k === aktiv ? 3.5 : 2.5 });
          G.xs.forEach((x) => punkte.push({ x, y: fn(x), farbe: G.farbe, id: `${k}:${x}` }));
        });
        const trig = ['f', 'g'].some((k) => fns[k].benutzt && fns[k].sichtbar && M.hatTrig(fns[k].baum));
        graph.zeichne({ serien, punkte, xWerte: beutel, auswahl: auswahl ? `${auswahl.fn}:${auswahl.x}` : null, piAchse: trig });
        $('.m-legende').innerHTML = ['f', 'g'].filter((k) => fns[k].benutzt).map((k) => `<button type="button" class="leg${fns[k].sichtbar ? '' : ' ist-aus'}" data-leg="${k}" aria-pressed="${fns[k].sichtbar}">
          <span class="leg-strich" style="background:${fns[k].farbe}"></span><span class="term">${k}(<i class="var">x</i>) = </span>${M.html(fns[k].baum)}</button>`).join('');
        // Tabelle
        zeilenSchluessel = ['f', 'g'].filter((k) => fns[k].benutzt && (fns[k].xs.size || k === aktiv));
        const xs = [...new Set(zeilenSchluessel.flatMap((k) => [...fns[k].xs]))].sort((a, b) => a - b);
        tabelle.setze({
          xs,
          zeilen: zeilenSchluessel.map((k) => ({ name: `${k}(<i>x</i>)`, farbe: fns[k].farbe, wert: (x) => (fns[k].xs.has(x) ? M.wert(fns[k].baum, x) : undefined) })),
          auswahl: auswahl ? { x: auswahl.x, zeile: zeilenSchluessel.indexOf(auswahl.fn) } : null,
          leer: 'Noch keine Zahl eingeworfen. Tippe im Beutel auf eine Zahl.',
        });
        wurzel.dispatchEvent(new CustomEvent('fw-stand', { bubbles: true }));
      }

      wurzel.addEventListener('change', (e) => { if (e.target.id === 'm-pfeile') aktualisiere(); });
      wurzel.addEventListener('click', async (e) => {
        const slot = e.target.closest('.slot');
        if (slot && slot.dataset.fn !== aktiv) {
          aktiv = slot.dataset.fn;
          fns[aktiv].benutzt = true;
          fns[aktiv].sichtbar = true;
          ed.setze(fns[aktiv].def);
          ed.umbenennen(aktiv);
          aktualisiere();
          U.ansage(`Die Maschine rechnet jetzt mit ${aktiv}.`);
          return;
        }
        const leg = e.target.closest('[data-leg]');
        if (leg) { fns[leg.dataset.leg].sichtbar = !fns[leg.dataset.leg].sichtbar; aktualisiere(); return; }
        const akt = e.target.closest('[data-akt]');
        if (!akt) return;
        if (akt.dataset.akt === 'alle') {
          if (buehne.beschaeftigt) { buehne.ueberspringen(); return; }
          await FW.alleEinwerfen(buehne, beutel.filter((x) => !fns[aktiv].xs.has(x)));
        }
        if (akt.dataset.akt === 'neu') { beutel = FW.zieheZahlen(); Object.values(fns).forEach((F) => F.xs.clear()); auswahl = null; aktualisiere(); }
        if (akt.dataset.akt === 'leeren') { Object.values(fns).forEach((F) => F.xs.clear()); auswahl = null; aktualisiere(); }
      });
      this.neueZahlen = () => { beutel = FW.zieheZahlen(); Object.values(fns).forEach((F) => F.xs.clear()); auswahl = null; aktualisiere(); };
      // Für die Einführung (js/einfuehrung-maschine.js): festen Anfang herstellen, Stand lesen, Schritte vormachen
      this.einfuehrung = {
        zuruecksetzen() {
          aktiv = 'f'; rechnet = 'f'; auswahl = null; beutel = [-2, -1, 0, 1, 2, 3, 4, 5];
          fns.f.def = { art: 'baukasten', schritte: [{ op: 'mul', v: 2 }, { op: 'add', v: 1 }] };
          fns.g.def = { art: 'baukasten', schritte: [{ op: 'mul', v: -1 }, { op: 'add', v: 4 }] };
          Object.values(fns).forEach((F) => { F.baum = M.ausSchritten(F.def.schritte); F.xs.clear(); F.sichtbar = true; });
          fns.g.benutzt = false;
          $('#m-pfeile').checked = false;
          ed.setze(fns.f.def);
          ed.umbenennen('f');
          aktualisiere();
        },
        get stand() {
          const F = fns[aktiv];
          return { aktiv, xs: [...F.xs], auswahl, art: F.def.art, schritte: F.def.art === 'baukasten' ? F.def.schritte : null, baum: F.baum, pfeile: $('#m-pfeile').checked, gewaehlt: gewaehltZahl };
        },
        einwerfen: (x) => buehne.einwerfen(x),
        /** offenen Baustein im Baukasten schließen, damit die Karte wieder ohne Scrollen passt */
        bausteinZu() { if (fns[aktiv].def.art === 'baukasten') ed.setze(fns[aktiv].def); },
        waehle(x) { auswahl = { x, fn: aktiv }; gewaehltZahl++; aktualisiere(); },
        pfeile(an) { $('#m-pfeile').checked = an; aktualisiere(); },
        setzeSchritte(schritte) {
          const F = fns[aktiv];
          F.def = { art: 'baukasten', schritte };
          F.baum = M.ausSchritten(schritte);
          ed.setze(F.def);
          aktualisiere();
        },
      };
      aktualisiere();
    },
  };
})(window.FW = window.FW || {});

</script>
<script >
/* Funktionswerkstatt · Modus „Regler“
   Parameter einer Funktionenfamilie mit Schiebereglern verändern: Graph, Term, Wertetabelle und Eigenschaften
   ändern sich sofort. Spur zeigt frühere Graphen, ein Vergleichsgraph gibt Orientierung, Leitfragen lenken den Blick.
   Die Maschinenkette zeigt, an welcher Stelle jeder Parameter rechnet: vor dem Kernschritt (innen, auf x, waagerecht)
   oder danach (außen, auf den Funktionswert, senkrecht). Exponentiell mit Basis b oder e, trigonometrisch mit sin, cos
   oder tan (Bogenmaß, c in Vielfachen von π, x-Achse in Vielfachen von π). */
(function (FW) {
  'use strict';
  const M = FW.mathe, U = FW.ui, K = M.k;
  FW.modi = FW.modi || {};

  // Summe aus Gliedern, Nullen weglassen; c·Baum mit 1 → Baum, −1 → −Baum
  const mal = (c, b) => (c === 1 ? b : c === -1 ? K.neg(b) : K.mal(K.zahl(c), b));
  function summe(glieder) {
    const g = glieder.filter((t) => !(t.t === 'num' && t.v === 0));
    if (!g.length) return K.zahl(0);
    return g.slice(1).reduce((a, t) => K.plus(a, t), g[0]);
  }
  const zahl = M.zahl;
  const S = (x, y) => `(${zahl(x)} | ${zahl(y)})`;
  function nullstellenQuad(a, b, c) {   // ax² + bx + c = 0
    if (a === 0) return b === 0 ? [] : [-c / b];
    const D = b * b - 4 * a * c;
    if (D < -1e-12) return [];
    if (Math.abs(D) < 1e-12) return [-b / (2 * a)];
    const w = Math.sqrt(D);
    return [(-b - w) / (2 * a), (-b + w) / (2 * a)].sort((p, q) => p - q);
  }
  const PI = Math.PI, Z = M.zahlSym;
  const SZ = (x, y) => `(${Z(x)} | ${zahl(y)})`;   // Punkt mit x in Vielfachen von π
  const mitCa = (v) => (Z(v) === zahl(v) ? M.zahlCa(v) : `${Z(v)} ≈ ${zahl(v)}`);
  // x − c, bei negativem c als x + |c|; c bleibt als Vielfaches von π stehen (x − π/2)
  const verschoben = (c) => (c === 0 ? K.x() : c > 0 ? K.minus(K.x(), M.zahlBaum(c)) : K.plus(K.x(), M.zahlBaum(-c)));
  /** a · sin(b(x − c)) + d mit c in Vielfachen von π */
  function trigBaum(name, p) {
    const c = p.c * PI;
    const innen = p.b === 1 ? verschoben(c) : K.mal(K.zahl(p.b), verschoben(c));
    return summe([p.a === 0 ? K.zahl(0) : mal(p.a, K.fkt(name, innen)), K.zahl(p.d)]);
  }
  const TRIG_NAME = { sin: 'Sinus', cos: 'Kosinus', tan: 'Tangens' };
  function trigFamilie(name) {
    const sinCos = name !== 'tan';
    return {
      titel: 'Trigonometrisch', wahl: name, speicher: 'trig', piAchse: true, jg: 'Jg. 10 und E',
      form: `<i>a</i> · ${name}(<i>b</i>(<i>x</i> − <i>c</i>)) + <i>d</i>`,
      par: [{ n: 'a', min: -3, max: 3, st: 0.5, v: 1 }, { n: 'b', min: 0.5, max: 4, st: 0.5, v: 1 },
        { n: 'c', min: -2, max: 2, st: 0.25, v: 0, pi: true, knopf: 0.25 }, { n: 'd', min: -3, max: 3, st: 0.5, v: 0 }],
      baum: (p) => trigBaum(name, p),
      vergleich: { text: `<i>y</i> = ${name}(<i>x</i>)`, baum: K.fkt(name, K.x()) },
      info(p) {
        const c = p.c * PI, per = (sinCos ? 2 * PI : PI) / p.b, A = Math.abs(p.a);
        const periode = `Periode <b>p = ${sinCos ? '2π' : 'π'} : b = ${mitCa(per)}</b>.`;
        if (p.a === 0) return ['Mit a = 0 bleibt nur die waagerechte Gerade y = d übrig.'];
        if (!sinCos) {
          return [`${periode} <b>a = ${zahl(p.a)}</b> streckt senkrecht${p.a < 0 ? ' und spiegelt' : ''} (keine Amplitude).`,
            `Polstellen (gestrichelt) bei x = ${Z(c + PI / (2 * p.b))} + k · ${Z(per)}, dort ist cos = 0.`];
        }
        return [
          `Amplitude <b>|a| = ${zahl(A)}</b>: Werte von ${zahl(p.d - A)} bis ${zahl(p.d + A)}, Mittellinie y = ${zahl(p.d)}${p.a < 0 ? ', gespiegelt' : ''}.`,
          periode];
      },
      marken: (p) => {
        if (p.a === 0) return [];
        const c = p.c * PI, y = name === 'cos' ? p.a + p.d : p.d;
        return [{ x: c, y, text: SZ(c, y) }];
      },
      linien: (p) => {
        if (p.a === 0) return [];
        if (sinCos) return [{ art: 'waagerecht', wert: p.d, klasse: 'g-achse-sym' }];
        const out = [], c = p.c * PI, per = PI / p.b;
        for (let k = -40; k <= 40; k++) { const x = c + per / 2 + k * per; if (Math.abs(x) < 30) out.push({ art: 'senkrecht', wert: x, klasse: 'g-asymptote' }); }
        return out;
      },
      kette: (p) => [{ op: 'sub', v: p.c * PI, par: 'c' }, { op: 'mul', v: p.b, par: 'b' }, { op: name }, { op: 'mul', v: p.a, par: 'a' }, { op: 'add', v: p.d, par: 'd' }], kern: 2,
      ketteText: `<b class="innen-t">Innen</b>, vor dem ${TRIG_NAME[name]}, wirken c und b auf x: c verschiebt waagerecht, b ändert die Periode. <b class="aussen-t">Außen</b>, danach, streckt a senkrecht und d verschiebt senkrecht.`,
      fenster: { xmin: -7, xmax: 7, ymin: -4, ymax: 4 },
      tabelle: { xs: sinCos ? [-PI, -PI / 2, 0, PI / 2, PI, 3 * PI / 2, 2 * PI] : [-PI / 2, -PI / 4, 0, PI / 4, PI / 2, 3 * PI / 4, PI], xText: Z },
      fragen: {
        sin: ['Verändere nur b. Wie hängt die Periode von b ab?', 'Stelle c auf π/2 und wechsle dann zu cos. Was fällt dir auf?', 'Was bewirkt ein negatives a?', 'Für welches d berührt der Graph die x-Achse, ohne sie zu schneiden?'],
        cos: ['Verändere nur a. Wo liegen jetzt Hoch- und Tiefpunkte?', 'Stelle c auf π/2. Welche Funktion siehst du jetzt? Prüfe mit sin.', 'Welche Periode hat der Graph für b = 2? Lies sie am Graphen ab.', 'Zu welcher Achse ist der Graph von cos(x) symmetrisch?'],
        tan: ['Wo liegen die Polstellen? Wie verändern sie sich, wenn du b änderst?', 'Welche Periode hat der Tangens? Vergleiche mit dem Sinus.', 'Was bewirkt a beim Tangens, wenn es keine Amplitude gibt?', 'Verschiebe mit c um π. Was fällt dir auf?'],
      }[name],
    };
  }
  const xGleich = (v) => { const s = M.zahlCa(v); return s[0] === '≈' ? 'x ' + s : 'x = ' + s; };
  const nsText = (ns) => (ns.length ? ns.map(xGleich).join(' und ') : 'keine');
  const oeffnung = (a) => (a > 0 ? 'nach oben geöffnet' : 'nach unten geöffnet') +
    (Math.abs(a) > 1 ? ', gestreckt (schmaler als die Normalparabel)' : Math.abs(a) < 1 ? ', gestaucht (breiter als die Normalparabel)' : ', so weit wie die Normalparabel');

  const FAMILIEN = {
    linear: {
      titel: 'Linear', form: '<i>m</i> · <i>x</i> + <i>b</i>', jg: 'ab Jg. 8',
      par: [{ n: 'm', min: -5, max: 5, st: 0.5, v: 1 }, { n: 'b', min: -6, max: 6, st: 0.5, v: 1 }],
      baum: (p) => summe([mal(p.m, K.x()), K.zahl(p.b)]),
      vergleich: { text: '<i>y</i> = <i>x</i>', baum: K.x() },
      info(p) {
        return [
          `Steigung <b>m = ${zahl(p.m)}</b>: ${p.m > 0 ? 'Der Graph steigt' : p.m < 0 ? 'Der Graph fällt' : 'Der Graph ist waagerecht'}${p.m ? `, pro Schritt nach rechts um ${zahl(Math.abs(p.m))} ${p.m > 0 ? 'nach oben' : 'nach unten'}` : ''}.`,
          `y-Achsenabschnitt <b>b = ${zahl(p.b)}</b>: Der Graph schneidet die y-Achse in ${S(0, p.b)}.`,
          `Nullstelle: ${p.m ? xGleich(-p.b / p.m) : p.b ? 'keine' : 'jede Zahl'}.`,
        ];
      },
      marken: (p) => [{ x: 0, y: p.b, text: S(0, p.b) }],
      kette: (p) => [{ op: 'mul', v: p.m, par: 'm' }, { op: 'add', v: p.b, par: 'b' }], kern: null,
      ketteText: 'Erst mal m, dann plus b: m legt die Steigung fest, b verschiebt den Graphen senkrecht.',
      dreieck: (p, fn) => ({ x0: 1, fn, text: 'm = ' + zahl(p.m) }),
      fragen: ['Was passiert mit dem Graphen, wenn du nur b veränderst?', 'Stelle m auf 0. Was für ein Graph entsteht?', 'Wann fällt der Graph? Formuliere eine Regel für m.', 'Finde zwei Geraden, die parallel sind. Was haben sie gemeinsam?'],
    },
    scheitel: {
      titel: 'Scheitelpunktform', form: '<i>a</i>(<i>x</i> − <i>d</i>)<sup>2</sup> + <i>e</i>', jg: 'ab Jg. 9',
      par: [{ n: 'a', min: -3, max: 3, st: 0.1, v: 1 }, { n: 'd', min: -5, max: 5, st: 0.5, v: 0 }, { n: 'e', min: -5, max: 5, st: 0.5, v: 0 }],
      baum: (p) => summe([mal(p.a, K.hoch(p.d === 0 ? K.x() : K.minus(K.x(), K.zahl(p.d)), K.zahl(2))), K.zahl(p.e)]),
      vergleich: { text: 'Normalparabel <i>y</i> = <i>x</i><sup>2</sup>', baum: K.hoch(K.x(), K.zahl(2)) },
      info(p) {
        if (p.a === 0) return ['Mit a = 0 ist es keine Parabel mehr, sondern eine waagerechte Gerade.'];
        return [
          `Scheitelpunkt <b>S${S(p.d, p.e)}</b>: d verschiebt nach ${p.d >= 0 ? 'rechts' : 'links'}, e nach ${p.e >= 0 ? 'oben' : 'unten'}.`,
          `<b>a = ${zahl(p.a)}</b>: ${oeffnung(p.a)}.`,
          `Symmetrieachse x = ${zahl(p.d)}. Nullstellen: ${nsText(nullstellenQuad(p.a, -2 * p.a * p.d, p.a * p.d * p.d + p.e))}.`,
        ];
      },
      marken: (p) => (p.a ? [{ x: p.d, y: p.e, text: 'S' + S(p.d, p.e) }] : []),
      kette: (p) => [{ op: 'sub', v: p.d, par: 'd' }, { op: 'quad' }, { op: 'mul', v: p.a, par: 'a' }, { op: 'add', v: p.e, par: 'e' }], kern: 1,
      ketteText: '<b class="innen-t">Innen</b>, vor dem Quadrieren, wirkt d auf x: Der Graph verschiebt sich waagerecht, und zwar um +d nach rechts, weil x − d erst bei x = d null wird. <b class="aussen-t">Außen</b>, danach, wirken a und e auf den Funktionswert: strecken und senkrecht verschieben.',
      linien: (p) => (p.a ? [{ art: 'senkrecht', wert: p.d, klasse: 'g-achse-sym' }] : []),
      fragen: ['Verändere nur d. Wohin wandert der Scheitelpunkt?', 'Was bewirkt ein negatives a?', 'Für welche a ist die Parabel schmaler als die Normalparabel?', 'Stelle die Parabel so ein, dass sie keine Nullstellen hat. Was gilt dann für a und e?'],
    },
    normal: {
      titel: 'Normalform', form: '<i>a</i><i>x</i><sup>2</sup> + <i>b</i><i>x</i> + <i>c</i>', jg: 'ab Jg. 9',
      par: [{ n: 'a', min: -3, max: 3, st: 0.1, v: 1 }, { n: 'b', min: -6, max: 6, st: 0.5, v: 0 }, { n: 'c', min: -6, max: 6, st: 0.5, v: 0 }],
      baum: (p) => summe([mal(p.a, K.hoch(K.x(), K.zahl(2))), mal(p.b, K.x()), K.zahl(p.c)]),
      vergleich: { text: 'Normalparabel <i>y</i> = <i>x</i><sup>2</sup>', baum: K.hoch(K.x(), K.zahl(2)) },
      info(p) {
        if (p.a === 0) return ['Mit a = 0 bleibt b · x + c übrig: eine Gerade.'];
        const xs = -p.b / (2 * p.a), ys = p.c - p.b * p.b / (4 * p.a);
        return [
          `y-Achsenabschnitt <b>c = ${zahl(p.c)}</b>: Schnittpunkt mit der y-Achse ${S(0, p.c)}.`,
          `Scheitelpunkt S(${M.zahlCa(xs)} | ${M.zahlCa(ys)}), <b>a = ${zahl(p.a)}</b>: ${oeffnung(p.a)}.`,
          `Nullstellen: ${nsText(nullstellenQuad(p.a, p.b, p.c))}.`,
        ];
      },
      kette: null,
      ersatz: (p) => (p.a ? [{ op: 'sub', v: Math.round(-p.b / (2 * p.a) * 1000) / 1000 }, { op: 'quad' }, { op: 'mul', v: p.a }, { op: 'add', v: Math.round((p.c - p.b * p.b / (4 * p.a)) * 1000) / 1000 }] : null),
      ketteText: 'Keine Kette: x kommt zweimal vor (in ax² und in bx). Umgeformt in die Scheitelpunktform wird daraus wieder eine Maschine:',
      marken: (p) => [{ x: 0, y: p.c, text: S(0, p.c) }].concat(p.a ? [{ x: -p.b / (2 * p.a), y: p.c - p.b * p.b / (4 * p.a), text: 'S' }] : []),
      fragen: ['Verändere nur c. Was bleibt gleich, was ändert sich?', 'Verändere nur b. Auf welcher Kurve wandert der Scheitelpunkt?', 'Stelle eine Parabel mit genau einer Nullstelle ein.', 'Vergleiche mit der Scheitelpunktform: Welcher Regler entspricht dort a?'],
    },
    exp: {
      titel: 'Exponentiell', wahl: '<i>b</i>', form: '<i>a</i> · <i>b</i><sup><i>x</i></sup>', jg: 'ab Jg. 10',
      par: [{ n: 'a', min: 0.5, max: 10, st: 0.5, v: 1 }, { n: 'b', min: 0.1, max: 3, st: 0.1, v: 2 }],
      baum: (p) => mal(p.a, K.hoch(K.zahl(p.b), K.x())),
      vergleich: { text: '<i>y</i> = 2<sup><i>x</i></sup>', baum: K.hoch(K.zahl(2), K.x()) },
      info(p) {
        const proz = Math.round((p.b - 1) * 1000) / 10;
        return [
          `Startwert <b>a = ${zahl(p.a)}</b>: f(0) = ${zahl(p.a)}, der Graph schneidet die y-Achse in ${S(0, p.a)}.`,
          `Wachstumsfaktor <b>b = ${zahl(p.b)}</b>: ${p.b > 1 ? `Wachstum um ${zahl(proz)} % pro Schritt` : p.b < 1 ? `Abnahme um ${zahl(-proz)} % pro Schritt` : 'keine Veränderung'}.`,
          'Die x-Achse ist Asymptote: Der Graph kommt ihr beliebig nahe, berührt sie aber nie.',
        ];
      },
      marken: (p) => [{ x: 0, y: p.a, text: S(0, p.a) }, { x: 1, y: p.a * p.b, text: S(1, p.a * p.b) }],
      kette: (p) => [{ op: 'basis', v: p.b, par: 'b' }, { op: 'mul', v: p.a, par: 'a' }], kern: 0,
      ketteText: 'Der Kernschritt ist b hoch x. <b class="aussen-t">Außen</b>, danach, streckt a den Graphen senkrecht.',
      fenster: { xmin: -4, xmax: 6, ymin: -2, ymax: 12 },
      fragen: ['Woran erkennst du am Graphen, ob b größer oder kleiner als 1 ist?', 'Was passiert bei b = 1?', 'Verdopple a. Wie verändern sich alle Funktionswerte?', 'Vergleiche f(1) und f(0). Wie hängt der Quotient mit b zusammen?'],
    },
    // natürliche Exponentialfunktion: Basis e (eulersche Zahl), Wachstumskonstante k
    efkt: {
      titel: 'Exponentiell', wahl: 'e', form: '<i>a</i> · e<sup><i>k</i><i>x</i></sup> + <i>d</i>', jg: 'E-Phase',
      par: [{ n: 'a', min: -4, max: 6, st: 0.5, v: 1 }, { n: 'k', min: -2, max: 2, st: 0.1, v: 1 }, { n: 'd', min: -4, max: 4, st: 0.5, v: 0 }],
      baum: (p) => {
        const hz = p.k === 1 ? K.x() : p.k === -1 ? K.neg(K.x()) : p.k === 0 ? K.zahl(0) : K.mal(K.zahl(p.k), K.x());
        return summe([p.a === 0 ? K.zahl(0) : mal(p.a, K.hoch(K.konst('e'), hz)), K.zahl(p.d)]);
      },
      vergleich: { text: '<i>y</i> = e<sup><i>x</i></sup>', baum: K.hoch(K.konst('e'), K.x()) },
      info(p) {
        const f = Math.exp(p.k);
        return [
          `Startwert f(0) = a + d = <b>${zahl(p.a + p.d)}</b>: Schnittpunkt mit der y-Achse ${S(0, p.a + p.d)}.`,
          `<b>k = ${zahl(p.k)}</b>: ${p.k > 0 ? 'Wachstum' : p.k < 0 ? 'Abnahme' : 'keine Veränderung, e<sup>0</sup> = 1'}${p.k ? `, pro Schritt mal e<sup>k</sup> ≈ ${zahl(f)} (e ≈ 2,718)` : ''}.`,
          p.a && p.k ? `Asymptote <b>y = ${zahl(p.d)}</b>: Der Graph kommt ihr ${p.k > 0 ? 'nach links' : 'nach rechts'} beliebig nahe.` : 'Ohne a oder k ist der Graph eine waagerechte Gerade.',
        ];
      },
      marken: (p) => [{ x: 0, y: p.a + p.d, text: S(0, p.a + p.d) }],
      linien: (p) => (p.d ? [{ art: 'waagerecht', wert: p.d, klasse: 'g-asymptote' }] : []),
      kette: (p) => [{ op: 'mul', v: p.k, par: 'k' }, { op: 'basis', v: Math.E }, { op: 'mul', v: p.a, par: 'a' }, { op: 'add', v: p.d, par: 'd' }], kern: 1,
      ketteText: 'Der Kernschritt ist e hoch die Zahl. <b class="innen-t">Innen</b>, davor, wirkt k auf x und bestimmt das Wachstum. <b class="aussen-t">Außen</b>, danach, streckt a senkrecht, und d verschiebt samt Asymptote.',
      fenster: { xmin: -5, xmax: 5, ymin: -4, ymax: 10 },
      fragen: ['Was passiert mit dem Graphen, wenn k negativ wird?', 'Verschiebe mit d. Was passiert mit der Asymptote?', 'Stelle d = 0 ein. Vergleiche f(1) : f(0) mit e<sup>k</sup>.', 'Wechsle zur Basis b und stelle b ≈ 2,7 ein. Was fällt dir auf?'],
    },
    potenz: {
      titel: 'Potenz', form: '<i>a</i> · <i>x</i><sup><i>n</i></sup>', jg: 'Jg. 10 und E',
      par: [{ n: 'a', min: -3, max: 3, st: 0.5, v: 1 }, { n: 'n', min: -3, max: 5, st: 1, v: 3, ohneNull: true }],
      baum: (p) => mal(p.a, p.n === 1 ? K.x() : K.hoch(K.x(), K.zahl(p.n))),
      vergleich: { text: '<i>y</i> = <i>x</i><sup>2</sup>', baum: K.hoch(K.x(), K.zahl(2)) },
      info(p) {
        return [
          `Exponent <b>n = ${zahl(p.n)}</b>: ${p.n % 2 === 0 ? 'gerade, der Graph ist symmetrisch zur y-Achse' : 'ungerade, der Graph ist punktsymmetrisch zum Ursprung'}.`,
          p.n < 0 ? 'n ist negativ: Für x = 0 ist die Funktion nicht definiert; die Achsen sind Asymptoten.' : `Der Graph geht durch ${S(0, 0)} und ${S(1, p.a)}.`,
          `<b>a = ${zahl(p.a)}</b> streckt ${p.a < 0 ? 'und spiegelt an der x-Achse' : 'in y-Richtung'}.`,
        ];
      },
      marken: (p) => [{ x: 1, y: p.a, text: S(1, p.a) }],
      kette: (p) => [{ op: 'hoch', v: p.n, par: 'n' }, { op: 'mul', v: p.a, par: 'a' }], kern: 0,
      ketteText: 'Der Kernschritt ist x hoch n. <b class="aussen-t">Außen</b>, danach, streckt a den Graphen senkrecht (und spiegelt ihn bei negativem a).',
      fragen: ['Vergleiche n = 2 und n = 4. Was ist gleich, was anders?', 'Vergleiche gerade und ungerade n. Was fällt dir an der Symmetrie auf?', 'Was passiert bei negativem n in der Nähe von x = 0?', 'Durch welche Punkte gehen alle Graphen mit a = 1?'],
    },
    sin: trigFamilie('sin'),
    cos: trigFamilie('cos'),
    tan: trigFamilie('tan'),
  };
  // Reiter oben; Familien mit gleichem Titel teilen sich einen Reiter und werden darunter gewählt (Basis b oder e; sin, cos, tan)
  const REITER = [];
  Object.entries(FAMILIEN).forEach(([k, F]) => {
    const r = REITER.find((q) => q.titel === F.titel);
    if (r) r.fams.push(k); else REITER.push({ titel: F.titel, fams: [k] });
  });
  const WAHL_TITEL = { Exponentiell: 'Basis', Trigonometrisch: 'Funktion' };
  const STANDARD = { xmin: -6, xmax: 6, ymin: -6, ymax: 8 };

  FW.modi.regler = {
    titel: 'Regler',
    baue(wurzel) {
      wurzel.innerHTML = `<div class="raster raster-regler">
        <section class="karte k-regler">
          <div class="familien" role="tablist">${REITER.map((R, i) => `<button type="button" role="tab" class="fam" data-reiter="${i}" data-fam="${R.fams[0]}">${R.titel}</button>`).join('')}</div>
          <div class="r-wahl" hidden></div>
          <div class="r-kopf"><span class="r-form"></span><span class="r-jg"></span></div>
          <div class="r-regler"></div>
          <div class="r-term"></div>
          <div class="r-masch"></div>
          <div class="r-schalter">${U.schalter('r-spur', 'Spur', false)}${U.schalter('r-vergleich', 'Vergleichsgraph', true)}${U.schalter('r-diff', 'Differenzen', false)}</div>
          <ul class="r-info"></ul>
          <div class="r-frage"><span class="r-frage-t"></span><button type="button" class="knopf klein" data-akt="frage">Nächste Frage</button></div>
          <div class="r-flug" aria-hidden="true"></div>
        </section>
        <section class="karte k-graph"><div class="graph-kasten r-graph"></div>
          <div class="graph-leiste"><span class="legende r-legende"></span></div></section>
        <section class="karte k-tabelle"><div class="r-tabelle"></div></section>
      </div>`;
      const $ = (s) => U.$(s, wurzel);
      let fam = 'linear', werte = {}, spur = [], frageNr = 0, aktivPar = null, aktivZeit = null;
      const graph = new FW.Graph($('.r-graph'));
      const tabelle = U.tabelle($('.r-tabelle'), { beiAuswahl(x) { kettenLauf(x); } });
      // Werte je Familie; sin, cos und tan teilen sich ihre Werte (speicher: 'trig'), damit man sie vergleichen kann
      const ablage = (k) => FAMILIEN[k].speicher || k;
      function startwerte() {
        werte = {};
        Object.entries(FAMILIEN).forEach(([k, F]) => { werte[ablage(k)] = werte[ablage(k)] || {}; F.par.forEach((p) => { werte[ablage(k)][p.n] = p.v; }); });
      }
      startwerte();
      const pw = () => werte[ablage(fam)];
      const anzeige = (p, v) => (p.pi ? Z(v * PI) : zahl(v));   // c zählt in Vielfachen von π
      const zuletzt = {};   // zuletzt gewählte Familie je Reiter
      const reiterVon = (k) => REITER.find((R) => R.fams.includes(k));
      // Eine Zahl durch die Kette schicken: Tippen auf x am Anfang der Kette oder auf eine Spalte der Tabelle
      const takt = U.takt();
      let laufX = null, laufNr = 0, laufZeit = null;
      const tabellenXs = () => (FAMILIEN[fam].tabelle ? FAMILIEN[fam].tabelle.xs : [-3, -2, -1, 0, 1, 2, 3]);
      function stoppeLauf() {
        laufNr++;
        clearTimeout(laufZeit);
        takt.eile();
        U.$$('.r-flug .b-token', wurzel).forEach((t) => t.remove());
        takt.ruhe();
      }
      async function kettenLauf(x0) {
        laufX = x0;
        zeichne();                         // Punkt im Graphen und Spalte in der Tabelle; Kette ohne alte Werte
        const nr = ++laufNr, lebt = () => nr === laufNr;
        const F = FAMILIEN[fam], k = F.kette ? F.kette(pw()) : F.ersatz ? F.ersatz(pw()) : null;
        const chips = U.$$('.r-kette .r-chip', wurzel), start = $('.r-start'), ende = $('.r-ende'), flug = $('.r-flug');
        if (!k || !start || !ende || chips.length !== k.length) return;
        const pos = (el) => U.mitteIn(el, flug);
        const ueber = (el) => { const c = pos(el); return { x: c.x, y: c.y - c.h / 2 - 15, s: 0.72, o: 1 }; };
        const tok = U.plaettchen(flug, takt, Z(x0));
        tok.setze(Object.assign({}, ueber(start), { o: 0 }));
        U.ploppen(takt, start);
        let v = x0;
        try {
          await tok.zu(ueber(start), 160);
          for (let i = 0; i < k.length && lebt(); i++) {
            // über den Baustein, eintauchen (der Baustein stempelt), mit neuem Wert wieder auftauchen
            const oben = ueber(chips[i]);
            await tok.wurf(oben, 300, 14);
            if (!lebt()) return;
            chips[i].classList.add('ist-lauf');
            await tok.zu(Object.assign({}, oben, { y: oben.y + 14 }), 130, 'ease-in');
            U.stempeln(takt, chips[i]);
            v = M.schrittWert(k[i], v);
            const t = Number.isFinite(v) ? Z(v) : 'n. d.';
            tok.text(t, Number.isFinite(v) ? '' : 'ist-nd');
            await tok.federn(0.35, 220);
            await tok.zu(oben, 150, 'ease-out');
            chips[i].classList.remove('ist-lauf');
            chips[i].dataset.wert = t;
            if (!Number.isFinite(v)) break;
          }
          if (!lebt()) return;
          await tok.wurf(ueber(ende), 300, 14);
          ende.dataset.wert = Number.isFinite(v) ? Z(v) : 'n. d.';
          U.ploppen(takt, ende);
          await tok.zu(Object.assign({}, tok.pos, { s: 0.3, o: 0 }), 220, 'ease-in');
          // die Zwischenwerte bleiben eine Weile stehen
          laufZeit = setTimeout(() => { if (lebt()) U.$$('.r-kette [data-wert]', wurzel).forEach((c) => c.removeAttribute('data-wert')); }, 8000);
        } finally {
          tok.weg();
        }
      }

      function regler() {
        const F = FAMILIEN[fam], R = reiterVon(fam);
        zuletzt[R.titel] = fam;
        U.$$('.fam', wurzel).forEach((b) => b.setAttribute('aria-selected', REITER[b.dataset.reiter] === R ? 'true' : 'false'));
        const wahl = $('.r-wahl');
        wahl.hidden = R.fams.length < 2;
        wahl.innerHTML = R.fams.length < 2 ? '' : `<span class="r-wahl-t">${WAHL_TITEL[R.titel] || 'Art'}</span>` +
          R.fams.map((k) => `<button type="button" class="chip" data-wahl="${k}" aria-pressed="${k === fam}">${FAMILIEN[k].wahl}</button>`).join('');
        $('.r-form').innerHTML = `<span class="term"><i>f</i>(<i>x</i>) = ${F.form}</span>`;
        $('.r-jg').textContent = F.jg;
        $('.r-regler').innerHTML = F.par.map((p) => `<div class="regler" data-p="${p.n}"><label for="r-${p.n}"><i>${p.n}</i></label>
          <button type="button" class="knopf rund klein" data-pm="-1" aria-label="${p.n} kleiner">−</button>
          <input type="range" id="r-${p.n}" min="${p.min}" max="${p.max}" step="${p.st}" value="${pw()[p.n]}">
          <button type="button" class="knopf rund klein" data-pm="1" aria-label="${p.n} größer">+</button>
          <output class="r-wert">${anzeige(p, pw()[p.n])}</output></div>`).join('');
        frageNr = 0;
        $('.r-frage-t').innerHTML = F.fragen[0];
        spur = [];
        graph.zoom = FW.graphZoom.START;   // neue Familie: Grundansicht (Zoom sitzt seit 20.11.2026 im Koordinatensystem)
        laufX = null;
        zeichne();
      }
      function setze(n, v, merken) {
        const p = FAMILIEN[fam].par.find((q) => q.n === n);
        v = Math.min(p.max, Math.max(p.min, Math.round(v / p.st) * p.st));
        v = Math.round(v * 1000) / 1000;
        if (p.ohneNull && v === 0) v = pw()[n] < 0 ? 1 : -1;
        if (merken && v !== pw()[n] && $('#r-spur').checked) merkeSpur();
        pw()[n] = v;
        aktivPar = n;
        clearTimeout(aktivZeit);
        aktivZeit = setTimeout(() => { aktivPar = null; U.$$('.r-chip.ist-aktiv', wurzel).forEach((c) => c.classList.remove('ist-aktiv')); }, 900);
        const r = U.$(`.regler[data-p="${n}"]`, wurzel);
        U.$('input', r).value = v;
        U.$('output', r).textContent = anzeige(p, v);
        zeichne();
      }
      function merkeSpur() {
        spur.push(FAMILIEN[fam].baum(Object.assign({}, pw())));
        if (spur.length > 8) spur.shift();
      }
      function zeichne() {
        stoppeLauf();                      // die Kette wird neu geschrieben: ein laufender Durchlauf endet hier
        const F = FAMILIEN[fam], p = pw(), baum = F.baum(p), fn = M.fn(baum);
        $('.r-term').innerHTML = `<span class="term"><i class="var">f</i>(<i class="var">x</i>) = </span>${M.html(baum)}`;
        $('.r-info').innerHTML = F.info(p).map((t) => `<li>${t}</li>`).join('');
        $('.r-masch').innerHTML = maschine(F, p);
        const serien = [];
        if ($('#r-vergleich').checked) serien.push({ fn: M.fn(F.vergleich.baum), farbe: 'var(--vergleich)', breite: 2, strich: '7 6' });
        spur.forEach((b, i) => serien.push({ fn: M.fn(b), farbe: 'var(--f)', breite: 2, deckkraft: 0.15 + 0.35 * (i + 1) / spur.length }));
        serien.push({ fn, farbe: 'var(--f)', breite: 4 });
        const fenster = Object.assign({}, F.fenster || STANDARD);
        graph.zeichne({
          serien, fenster, quadratisch: true,
          marken: F.marken ? F.marken(p).filter((m) => Number.isFinite(m.y)) : [],
          linien: F.linien ? F.linien(p) : [],
          dreieck: F.dreieck ? F.dreieck(p, fn) : null,
          piAchse: !!F.piAchse,
          punkte: laufX != null && Number.isFinite(fn(laufX)) ? [{ x: laufX, y: fn(laufX), farbe: 'var(--f)', id: 'lauf' }] : [],
          auswahl: laufX != null ? 'lauf' : null,
          beschreibung: M.text(baum),
        });
        $('.r-legende').innerHTML = `<span class="leg"><span class="leg-strich" style="background:var(--f)"></span>f</span>` +
          ($('#r-vergleich').checked ? `<span class="leg"><span class="leg-strich gestrichelt"></span><span>${F.vergleich.text}</span></span>` : '') +
          (spur.length ? '<span class="leg"><span class="leg-strich blass"></span>Spur</span>' : '');
        const xs = F.tabelle ? F.tabelle.xs : [-3, -2, -1, 0, 1, 2, 3];
        tabelle.setze({ xs, xText: F.tabelle && F.tabelle.xText, zeilen: [{ name: '<i>f</i>(<i>x</i>)', farbe: 'var(--f)', wert: fn }], auswahl: laufX != null ? { x: laufX, zeile: 0 } : null, diff: $('#r-diff').checked, quot: (fam === 'exp' || fam === 'efkt') && $('#r-diff').checked });
        wurzel.dispatchEvent(new CustomEvent('fw-stand', { bubbles: true }));
      }
      /** Maschinenkette der Familie: jeder Parameter an seinem Schritt, innen (auf x) und außen (auf den Funktionswert) */
      function maschine(F, p) {
        const k = F.kette ? F.kette(p) : F.ersatz ? F.ersatz(p) : null;
        const chips = (k || []).map((st, i) => {
          const lage = F.kern == null ? '' : i < F.kern ? ' innen' : i === F.kern ? ' kern' : ' aussen';
          return `<span class="bk-pfeil">→</span><span class="r-chip${lage}${st.par && st.par === aktivPar ? ' ist-aktiv' : ''}" data-par="${st.par || ''}">` +
            `<span class="r-op">${U.chipHtml(st)}</span>${st.par ? `<span class="r-par">${st.par}</span>` : ''}</span>`;
        }).join('');
        const kette = k ? `<div class="r-kette"><button type="button" class="bk-ende r-start" data-akt="kette" title="Eine Zahl durch die Kette schicken (oder in der Tabelle auf eine Spalte tippen)" aria-label="Eine Zahl durch die Kette schicken"><i>x</i><span class="r-play" aria-hidden="true">▶</span></button>${chips}<span class="bk-pfeil">→</span><span class="bk-ende r-ende"><i>f</i>(<i>x</i>)</span></div>` : '';
        return `<p class="r-kette-t">${F.ketteText}</p>${kette}`;
      }
      wurzel.addEventListener('input', (e) => {
        const r = e.target.closest('.regler input');
        if (r) setze(r.closest('.regler').dataset.p, Number(r.value), false);
        if (e.target.closest('.r-schalter')) { if (e.target.id === 'r-spur' && !e.target.checked) spur = []; zeichne(); }
      });
      // Spur: beim Anfassen eines Reglers den Graphen davor merken
      wurzel.addEventListener('pointerdown', (e) => { if (e.target.closest('.regler input') && $('#r-spur').checked) merkeSpur(); });
      wurzel.addEventListener('keydown', (e) => { if (e.target.closest('.regler input') && $('#r-spur').checked && /Arrow|Page|Home|End/.test(e.key)) merkeSpur(); });
      wurzel.addEventListener('click', (e) => {
        const f = e.target.closest('.fam');
        if (f) { const R = REITER[f.dataset.reiter]; fam = zuletzt[R.titel] || R.fams[0]; regler(); return; }
        const w = e.target.closest('[data-wahl]');
        if (w) { if (w.dataset.wahl !== fam) { fam = w.dataset.wahl; regler(); } return; }
        const pm = e.target.closest('[data-pm]');
        if (pm) { const n = pm.closest('.regler').dataset.p, P = FAMILIEN[fam].par.find((q) => q.n === n); setze(n, pw()[n] + Number(pm.dataset.pm) * (P.knopf || (P.st < 0.5 ? P.st * 5 : P.st)), true); return; }
        if (e.target.closest('[data-akt="kette"]')) {
          // nächste Zahl aus der Tabelle; beim ersten Mal die fünfte (1 bzw. π)
          const xs = tabellenXs(), i = xs.findIndex((x) => M.gleich(x, laufX));
          kettenLauf(xs[i < 0 ? 4 : (i + 1) % xs.length]);
          return;
        }
        if (e.target.closest('[data-akt="frage"]')) { const F = FAMILIEN[fam]; frageNr = (frageNr + 1) % F.fragen.length; $('.r-frage-t').innerHTML = F.fragen[frageNr]; }
      });
      // Für die Einführung (js/einfuehrung-regler.js): festen Anfang herstellen, Stand lesen, Schritte vormachen
      this.einfuehrung = {
        zuruecksetzen() {
          fam = 'linear';
          startwerte();
          Object.keys(zuletzt).forEach((k) => delete zuletzt[k]);
          $('#r-spur').checked = false; $('#r-vergleich').checked = true; $('#r-diff').checked = false;
          regler();
        },
        get stand() { return { fam, werte: Object.assign({}, pw()), spur: $('#r-spur').checked, spurLaenge: spur.length, diff: $('#r-diff').checked }; },
        setze: (n, v) => setze(n, v, true),
        schalter(id, an) { $('#' + id).checked = an; if (id === 'r-spur' && !an) spur = []; zeichne(); },
      };
      regler();
    },
  };
})(window.FW = window.FW || {});

</script>
<script >
/* Funktionswerkstatt · Modus „Verknüpfen“
   Zwei Maschinen f und g hintereinander (g nach f, f nach g) oder nebeneinander mit +, − oder ·. Jede Zahl läuft
   sichtbar durch beide Maschinen; Term, Rechnung, Tabelle und Graph zeigen f, g und die neue Funktion h.
   Bei der Verkettung bekommt die äußere Maschine nicht x, sondern das Ergebnis der inneren: Ihre Variable heißt z. */
(function (FW) {
  'use strict';
  const M = FW.mathe, U = FW.ui, K = M.k;
  FW.modi = FW.modi || {};

  const ARTEN = {
    gf: { knopf: '<i>g</i> nach <i>f</i>', name: 'g(f(x))', reihe: ['f', 'g'], baum: (f, g) => M.ersetze(g, f) },
    fg: { knopf: '<i>f</i> nach <i>g</i>', name: 'f(g(x))', reihe: ['g', 'f'], baum: (f, g) => M.ersetze(f, g) },
    plus: { knopf: '<i>f</i> + <i>g</i>', name: 'f(x) + g(x)', zeichen: '+', baum: (f, g) => K.plus(f, g), rechne: (a, b) => a + b },
    minus: { knopf: '<i>f</i> − <i>g</i>', name: 'f(x) − g(x)', zeichen: '−', baum: (f, g) => K.minus(f, g), rechne: (a, b) => a - b },
    mal: { knopf: '<i>f</i> · <i>g</i>', name: 'f(x) · g(x)', zeichen: '·', baum: (f, g) => K.mal(f, g), rechne: (a, b) => a * b },
  };
  const kursiv = (s) => s.replace(/\b([fghx])\b/g, '<i>$1</i>');

  FW.modi.verknuepfen = {
    titel: 'Verknüpfen',
    baue(wurzel) {
      wurzel.innerHTML = `<div class="raster raster-verkn">
        <section class="karte k-def">
          <header class="k-kopf"><h2>Zwei Maschinen</h2><button type="button" class="knopf" data-akt="tauschen">f und g tauschen</button></header>
          <div class="vk-felder"><div class="vk-f"></div><div class="vk-g"></div></div>
          <div class="vk-tasten"></div>
          <div class="vk-arten" role="tablist">${Object.entries(ARTEN).map(([k, A]) => `<button type="button" role="tab" class="fam" data-art="${k}">${A.knopf}</button>`).join('')}</div>
        </section>
        <section class="karte k-kette">
          <div class="vk-kette"></div>
          <div class="vk-beutel"><span class="b-titel">Einwerfen</span><div class="b-chips vk-chips"></div><button type="button" class="knopf haupt" data-akt="alle">Alle</button><button type="button" class="knopf" data-akt="leeren">Leeren</button></div>
          <dl class="darstellungen"><div class="vk-einsetzen-z"><dt>Einsetzen</dt><dd class="vk-einsetzen"></dd></div><div><dt>Neue Funktion</dt><dd class="vk-term"></dd></div><div class="vk-rechnung-z"><dt>Rechnung</dt><dd class="vk-rechnung"></dd></div></dl>
          <div class="vk-flug" aria-hidden="true"></div>
        </section>
        <section class="karte k-graph"><div class="graph-kasten vk-graph"></div><div class="legende vk-legende"></div></section>
        <section class="karte k-tabelle"><div class="vk-tabelle"></div></section>
      </div>`;
      const $ = (s) => U.$(s, wurzel);
      let art = 'gf', beutel = FW.zieheZahlen(), xs = new Set(), auswahl = null, letztes = null;
      const baum = { f: M.lies('x + 2'), g: M.lies('x²') };
      // Variable je Maschine: bei der Verkettung heißt sie in der äußeren Maschine z
      const aussen = () => (ARTEN[art].reihe ? ARTEN[art].reihe[1] : null);
      const vari = (k) => (k === aussen() ? 'z' : 'x');
      const felder = {};
      ['f', 'g'].forEach((k) => {
        felder[k] = U.termFeld($('.vk-' + k), { name: k, variable: vari(k), text: M.text(baum[k], { variable: vari(k) }), tasten: false, beiAenderung(b) { if (b) { baum[k] = b; aktualisiere(); } } });
        felder[k].ein.addEventListener('focus', () => { letztes = k; tasten.setzeVariable(felder[k].variable); });
      });
      letztes = 'f';
      const tasten = U.tastenfeld($('.vk-tasten'), () => felder[letztes].ein);
      function variablenAnpassen() {
        ['f', 'g'].forEach((k) => { if (felder[k].variable !== vari(k)) felder[k].setzeVariable(vari(k), M.text(baum[k], { variable: vari(k) })); });
        tasten.setzeVariable(felder[letztes].variable);
      }
      const graph = new FW.Graph($('.vk-graph'), { beiPunkt(id) { auswahl = Number(id.split(':')[1]); aktualisiere(); } });
      const tabelle = U.tabelle($('.vk-tabelle'), { beiAuswahl(x) { auswahl = x; aktualisiere(); } });

      const fn = (k) => M.fn(baum[k]);
      const hBaum = () => ARTEN[art].baum(baum.f, baum.g);
      const hWert = (x) => M.wert(hBaum(), x);

      function kette() {
        const A = ARTEN[art];
        const masch = (k) => `<div class="vk-masch" data-m="${k}" style="--mf:var(--${k})"><span class="mf-name">${k}</span><span class="vk-t">${M.html(baum[k], { variable: vari(k) })}</span></div>`;
        const blase = (cls, l) => `<div class="vk-blase ${cls}"><span class="vk-l">${l}</span><b>·</b></div>`;
        if (A.reihe) {
          const [a, b] = A.reihe;
          $('.vk-kette').className = 'vk-kette vk-reihe';
          $('.vk-kette').innerHTML = blase('vk-x', '<i>x</i>') + '<span class="vk-pfeil">→</span>' + masch(a) + '<span class="vk-pfeil">→</span>' +
            blase('vk-zw vk-' + a, '<i>z</i> = ' + kursiv(`${a}(x)`)) + '<span class="vk-pfeil">→</span>' + masch(b) + '<span class="vk-pfeil">→</span>' +
            blase('vk-erg', kursiv(`h(x) = ${A.name}`));
        } else {
          $('.vk-kette').className = 'vk-kette vk-parallel';
          $('.vk-kette').innerHTML = blase('vk-x', '<i>x</i>') +
            `<div class="vk-zweige"><div class="vk-zweig"><span class="vk-pfeil">→</span>${masch('f')}<span class="vk-pfeil">→</span>${blase('vk-zw vk-f', '<i>f</i>(<i>x</i>)')}</div>
             <div class="vk-zweig"><span class="vk-pfeil">→</span>${masch('g')}<span class="vk-pfeil">→</span>${blase('vk-zw vk-g', '<i>g</i>(<i>x</i>)')}</div></div>
             <div class="vk-op">${A.zeichen}</div><span class="vk-pfeil">→</span>` + blase('vk-erg', kursiv(`h(x) = ${A.name}`));
        }
      }
      const setzeBlase = (sel, v) => { const b = U.$(sel + ' b', wurzel); if (b) b.textContent = v === null ? '·' : Number.isFinite(v) ? M.zahl(v) : 'n. d.'; };
      // Bewegung: Die Zahl fliegt als Plättchen von Blase zu Maschine zu Blase (Flugschicht über der Karte)
      const takt = U.takt();
      const flug = $('.vk-flug');
      const pos = (el) => U.mitteIn(el, flug);
      let laufend = 0;
      const meldeLauf = () => FW.alleKnopf(U.$('.vk-beutel [data-akt="alle"]', wurzel), laufend > 0, true);
      const zahlText = (v) => (Number.isFinite(v) ? M.zahl(v) : 'n. d.');
      /** in die Blase fliegen; dort erscheint der Wert */
      async function inBlase(tok, sel, v) {
        const bl = U.$(sel, wurzel);
        if (!bl) return;
        await tok.wurf(Object.assign({ s: 0.8, o: 1 }, pos(bl)), 320, 18);
        setzeBlase(sel, v);
        U.ploppen(takt, bl);
      }
      /** durch eine Maschine: links hinein, die Maschine rattert und stempelt, rechts kommt der neue Wert heraus */
      async function durchMaschine(tok, k, ein) {
        const m = U.$(`.vk-masch[data-m="${k}"]`, wurzel);
        const v = fn(k)(ein);
        if (!m) return v;
        const p = pos(m);
        await tok.wurf({ x: p.x - p.w / 2 - 10, y: p.y, s: 0.8, o: 1 }, 260, 14);
        await tok.zu({ x: p.x - p.w / 2 + 4, y: p.y, s: 0.8, sx: 0.2, o: 0.3 }, 160, 'ease-in');
        tok.setze({ x: p.x, y: p.y, s: 0.5, o: 0 });
        m.classList.add('arbeitet');
        for (let i = 0; i < 2; i++) { U.stempeln(takt, U.$('.vk-t', m), m); await takt.warte(190); }
        m.classList.remove('arbeitet');
        tok.el.style.setProperty('--mf', `var(--${k})`);
        tok.text(zahlText(v), Number.isFinite(v) ? '' : 'ist-nd');
        tok.setze({ x: p.x + p.w / 2 - 4, y: p.y, s: 0.8, sx: 0.2, o: 0.3 });
        await tok.zu({ x: p.x + p.w / 2 + 16, y: p.y, s: 0.8, o: 1 }, 170, 'ease-out');
        await tok.federn(0.3, 200);
        return v;
      }
      const neuesPlaettchen = (x, von) => {
        const t = U.plaettchen(flug, takt, M.zahl(x));
        t.el.style.setProperty('--mf', 'var(--h)');
        t.setze(Object.assign({ s: 1 }, pos(von)));
        return t;
      };
      async function durchlauf(x) {
        const A = ARTEN[art];
        auswahl = x;
        setzeBlase('.vk-x', null); setzeBlase('.vk-zw.vk-f', null); setzeBlase('.vk-zw.vk-g', null); setzeBlase('.vk-erg', null);
        const xBlase = U.$('.vk-x', wurzel);
        xBlase.classList.add('ist-an');
        const chip = U.$(`.vk-chips .b-chip[data-x="${x}"]`, wurzel);
        if (chip) chip.classList.add('ist-unterwegs');
        const tok = neuesPlaettchen(x, chip || xBlase);
        const weitere = [];
        try {
          // aus dem Beutel in die Blase x
          await tok.wurf(Object.assign({ s: 0.8 }, pos(xBlase)), 420, 34);
          setzeBlase('.vk-x', x);
          U.ploppen(takt, xBlase);
          if (A.reihe) {
            // hintereinander: x → erste Maschine → Blase z → zweite Maschine → Ergebnis
            const [a, b] = A.reihe;
            const za = await durchMaschine(tok, a, x);
            await inBlase(tok, '.vk-zw.vk-' + a, za);
            const zb = Number.isFinite(za) ? await durchMaschine(tok, b, za) : NaN;
            if (!Number.isFinite(za)) { tok.text('n. d.', 'ist-nd'); }
            await inBlase(tok, '.vk-erg', zb);
          } else {
            // nebeneinander: Die Zahl teilt sich, beide Maschinen rechnen gleichzeitig, das Rechenzeichen fügt zusammen
            const t2 = neuesPlaettchen(x, xBlase);
            t2.setze(Object.assign({}, tok.pos));
            weitere.push(t2);
            const zweig = async (t, k) => { const v = await durchMaschine(t, k, x); await inBlase(t, '.vk-zw.vk-' + k, v); return v; };
            await Promise.all([zweig(tok, 'f'), zweig(t2, 'g')]);
            const op = U.$('.vk-op', wurzel), po = pos(op);
            await Promise.all([tok.wurf({ x: po.x, y: po.y, s: 0.55 }, 300, 16), t2.wurf({ x: po.x, y: po.y, s: 0.55 }, 300, 16)]);
            t2.weg();
            op.classList.add('arbeitet');
            takt.effekt(op, [{ transform: 'rotate(0) scale(1)' }, { transform: 'rotate(180deg) scale(1.15)' }, { transform: 'rotate(360deg) scale(1)' }], 420, { easing: 'ease-in-out' });
            await takt.warte(400);
            op.classList.remove('arbeitet');
            tok.el.style.setProperty('--mf', 'var(--h)');
            tok.text(zahlText(hWert(x)), Number.isFinite(hWert(x)) ? '' : 'ist-nd');
            await tok.federn(0.3, 200);
            await inBlase(tok, '.vk-erg', hWert(x));
          }
          await tok.zu(Object.assign({}, tok.pos, { s: 0.3, o: 0 }), 200, 'ease-in');
        } finally {
          tok.weg();
          weitere.forEach((t) => t.weg());
          setzeBlase('.vk-erg', hWert(x));
          xBlase.classList.remove('ist-an');
        }
        xs.add(x);
        aktualisiere(true);
      }
      /** Zahl einwerfen; mehrere laufen nacheinander */
      function einwerfen(x) {
        laufend++;
        meldeLauf();
        laeuft = laeuft.then(() => durchlauf(x)).catch(() => {}).finally(() => { laufend--; if (!laufend) takt.ruhe(); meldeLauf(); });
        return laeuft;
      }
      function blasenFuer(x) {
        const A = ARTEN[art];
        if (x == null) { ['.vk-x', '.vk-zw.vk-f', '.vk-zw.vk-g', '.vk-erg'].forEach((s) => setzeBlase(s, null)); return; }
        setzeBlase('.vk-x', x);
        if (A.reihe) setzeBlase('.vk-zw.vk-' + A.reihe[0], fn(A.reihe[0])(x));
        else { setzeBlase('.vk-zw.vk-f', fn('f')(x)); setzeBlase('.vk-zw.vk-g', fn('g')(x)); }
        setzeBlase('.vk-erg', hWert(x));
      }
      function rechnung(x) {
        const A = ARTEN[art], z = (v) => (Number.isFinite(v) ? M.zahl(v) : 'nicht definiert');
        if (A.reihe) {
          const [a, b] = A.reihe, za = fn(a)(x), zb = fn(b)(za);
          return `<i>z</i> = <i>${a}</i>(${M.zahl(x)}) = ${z(za)}, dann <i>${b}</i>(<i>z</i>) = <i>${b}</i>(${z(za)}) = ${z(zb)}. Also <i>h</i>(${M.zahl(x)}) = <b>${z(zb)}</b>` +
            (Number.isFinite(za) && !Number.isFinite(zb) ? `<span class="rk-hinweis">${z(za)} lässt sich nicht in ${b} einsetzen: ${FW.warumNichtDefiniert(baum[b], za)}</span>` : '');
        }
        const zf = fn('f')(x), zg = fn('g')(x);
        const zgT = Number.isFinite(zg) && zg < 0 ? `(${z(zg)})` : z(zg);
        return `<i>f</i>(${M.zahl(x)}) ${A.zeichen} <i>g</i>(${M.zahl(x)}) = ${z(zf)} ${A.zeichen} ${zgT} = <b>${z(hWert(x))}</b>`;
      }
      function aktualisiere(ohneKette) {
        const A = ARTEN[art];
        U.$$('.vk-arten .fam', wurzel).forEach((b) => b.setAttribute('aria-selected', b.dataset.art === art ? 'true' : 'false'));
        if (!ohneKette) kette();
        if (!ohneKette) blasenFuer(auswahl);
        U.$$('.vk-masch', wurzel).forEach((m) => { U.$('.vk-t', m).innerHTML = M.html(baum[m.dataset.m], { variable: vari(m.dataset.m) }); });
        $('.vk-einsetzen-z').hidden = !A.reihe;
        if (A.reihe) {
          const [a, b] = A.reihe;
          $('.vk-einsetzen').innerHTML = `${b} bekommt nicht <i>x</i>, sondern das Ergebnis von ${a}: <span class="term"><i>z</i> = <i>${a}</i>(<i>x</i>) = </span>${M.html(baum[a])}` +
            ` wird in <span class="term"><i>${b}</i>(<i>z</i>) = </span>${M.html(baum[b], { variable: 'z' })} eingesetzt.`;
        }
        $('.vk-chips').innerHTML = beutel.map((x) => `<button type="button" class="b-chip${xs.has(x) ? ' ist-benutzt' : ''}${auswahl === x ? ' ist-markiert' : ''}" data-x="${x}">${M.zahl(x)}</button>`).join('');
        const h = hBaum();
        $('.vk-term').innerHTML = `<span class="term">${kursiv(`h(x) = ${A.name}`)} = </span>${M.html(h)}`;
        $('.vk-rechnung-z').hidden = auswahl == null;
        if (auswahl != null) $('.vk-rechnung').innerHTML = rechnung(auswahl);
        const ff = fn('f'), fg = fn('g'), fh = M.fn(h);
        const punkte = [...xs].map((x) => ({ x, y: fh(x), farbe: 'var(--h)', id: 'h:' + x }));
        graph.zeichne({
          serien: [{ fn: ff, farbe: 'var(--f)', breite: 2.2 }, { fn: fg, farbe: 'var(--g)', breite: 2.2 }, { fn: fh, farbe: 'var(--h)', breite: 4 }],
          punkte, xWerte: beutel, auswahl: auswahl != null ? 'h:' + auswahl : null,
          piAchse: M.hatTrig(baum.f) || M.hatTrig(baum.g),
        });
        $('.vk-legende').innerHTML = [['f', baum.f], ['g', baum.g], ['h', h]].map(([k, b]) => { const v = k === 'h' ? 'x' : vari(k);
          return `<span class="leg"><span class="leg-strich" style="background:var(--${k})"></span><span class="term"><i>${k}</i>(<i>${v}</i>) = </span>${M.html(b, { variable: v })}</span>`; }).join('');
        const sorted = [...xs].sort((a, b) => a - b);
        tabelle.setze({
          xs: sorted,
          zeilen: (A.reihe ? [A.reihe[0]] : ['f', 'g']).map((k) => ({ name: (A.reihe ? '<i>z</i> = ' : '') + `<i>${k}</i>(<i>x</i>)`, farbe: `var(--${k})`, wert: k === 'f' ? ff : fg }))
            .concat([{ name: A.reihe ? `<i>h</i>(<i>x</i>) = <i>${A.reihe[1]}</i>(<i>z</i>)` : kursiv(`h(x) = ${A.name}`), farbe: 'var(--h)', wert: fh }]),
          auswahl: auswahl != null ? { x: auswahl, zeile: A.reihe ? 1 : 2 } : null,
          leer: 'Noch keine Zahl eingeworfen.',
        });
        wurzel.dispatchEvent(new CustomEvent('fw-stand', { bubbles: true }));
      }
      let laeuft = Promise.resolve();
      /** alle Zahlen aus dem Beutel nacheinander, etwas schneller als einzeln */
      async function alle() {
        const tempo = U.tempo;
        U.tempo = tempo * 0.5;
        try { await Promise.all(beutel.map((x) => einwerfen(x))); } finally { U.tempo = tempo; }
      }
      wurzel.addEventListener('click', async (e) => {
        const a = e.target.closest('.vk-arten .fam');
        if (a) { art = a.dataset.art; variablenAnpassen(); aktualisiere(); return; }
        const c = e.target.closest('.vk-chips .b-chip');
        if (c) { einwerfen(Number(c.dataset.x)); return; }
        const akt = e.target.closest('[data-akt]');
        if (!akt) return;
        if (akt.dataset.akt === 'tauschen') {
          const t = baum.f; baum.f = baum.g; baum.g = t;
          felder.f.setze(M.text(baum.f, { variable: vari('f') }), true); felder.g.setze(M.text(baum.g, { variable: vari('g') }), true);
          aktualisiere();
        }
        if (akt.dataset.akt === 'alle') {
          if (laufend) { takt.eile(); return; }
          await alle();
        }
        if (akt.dataset.akt === 'leeren') { xs.clear(); auswahl = null; aktualisiere(); }
      });
      this.neueZahlen = () => { beutel = FW.zieheZahlen(); xs.clear(); auswahl = null; aktualisiere(); };
      // Für die Einführung (js/einfuehrung-verknuepfen.js)
      this.einfuehrung = {
        zuruecksetzen() {
          art = 'gf'; baum.f = M.lies('x + 2'); baum.g = M.lies('x²');
          beutel = [-3, -2, -1, 0, 1, 2, 3, 4]; xs.clear(); auswahl = null; letztes = 'f';
          variablenAnpassen();
          ['f', 'g'].forEach((k) => felder[k].setze(M.text(baum[k], { variable: vari(k) }), true));
          aktualisiere();
        },
        get stand() { return { art, xs: [...xs], auswahl, f: baum.f, g: baum.g, h: hBaum() }; },
        einwerfen: (x) => einwerfen(x),
        waehleArt(k) { art = k; variablenAnpassen(); aktualisiere(); },
        alle: () => alle(),
      };
      aktualisiere();
    },
  };
})(window.FW = window.FW || {});

</script>
<script >
/* Funktionswerkstatt · Modus „Rückwärts“
   Die Ausgabe ist bekannt, die Eingabe gesucht. Die Maschine läuft rückwärts: jeder Schritt wird umgekehrt (aus + 1
   wird − 1, aus · 2 wird : 2, aus □² wird ±√□), daneben entsteht die Lösung der Gleichung Zeile für Zeile.
   Rechts die Umkehrmaschine f⁻¹ mit ihrem Graphen, gespiegelt an y = x. */
(function (FW) {
  'use strict';
  const M = FW.mathe, U = FW.ui;
  FW.modi = FW.modi || {};
  const zufall = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
  const wahl = (liste) => liste[Math.floor(Math.random() * liste.length)];

  /** Zufällige Maschine mit ganzzahligen Zwischenwerten für eine Startzahl */
  function zufallsMaschine() {
    const x0 = zufall(-4, 9);
    const n = zufall(2, 3);
    const schritte = [];
    let v = x0;
    for (let i = 0; i < n; i++) {
      let op = wahl(i === 0 && Math.random() < 0.25 ? ['quad', 'add', 'mul'] : ['add', 'sub', 'mul', 'div', 'add', 'mul']);
      if (op === 'quad' && Math.abs(v) > 6) op = 'add';
      if (op === 'div') {
        const teiler = [2, 3, 4, 5].filter((t) => v !== 0 && v % t === 0);
        if (!teiler.length) op = 'mul'; else { schritte.push({ op, v: wahl(teiler) }); v /= schritte[i].v; continue; }
      }
      if (op === 'add' || op === 'sub') schritte.push({ op, v: zufall(1, 9) });
      else if (op === 'mul') schritte.push({ op, v: wahl([2, 3, 4, 5, -2, -3]) });
      else schritte.push({ op: 'quad' });
      v = M.schrittWert(schritte[i], v);
    }
    return { schritte, x0, y: v };
  }

  FW.modi.rueckwaerts = {
    titel: 'Rückwärts',
    baue(wurzel) {
      wurzel.innerHTML = `<div class="raster raster-rueck">
        <section class="karte k-masch">
          <header class="k-kopf"><h2>Maschine</h2><button type="button" class="knopf" data-akt="zufall">Zufällige Maschine</button></header>
          <div class="rw-editor"></div>
        </section>
        <section class="karte k-rueck">
          <header class="k-kopf"><h2>Welche Zahl wurde eingeworfen?</h2></header>
          <div class="rw-fragen">
            <label class="rw-feld">Die Maschine gibt aus: <input class="rw-y zahlfeld" type="text" inputmode="decimal" aria-label="Ausgabe"></label>
            <button type="button" class="knopf" data-akt="neueAusgabe">Andere Ausgabe</button>
            <label class="rw-feld">Eingeworfen wurde: <input class="rw-x zahlfeld" type="text" inputmode="decimal" aria-label="Deine Vermutung für die Eingabe"></label>
            <button type="button" class="knopf" data-akt="pruefen">Prüfen</button>
            <button type="button" class="knopf haupt" data-akt="rueck">Rückwärts laufen lassen</button>
          </div>
          <p class="rueckmeldung rw-meldung" hidden></p>
          <div class="rw-spur"></div>
          <ol class="rw-glg" aria-label="Gleichung lösen"></ol>
        </section>
        <section class="karte k-graph k-umkehr">
          <header class="k-kopf"><h2>Umkehrmaschine</h2>${U.schalter('rw-achse', 'Spiegelachse <i>y</i> = <i>x</i>', true)}</header>
          <div class="rw-umkehr"></div>
          <div class="graph-kasten rw-graph"></div>
          <div class="legende rw-legende"></div>
        </section>
      </div>`;
      const $ = (s) => U.$(s, wurzel);
      const start = { schritte: [{ op: 'mul', v: 2 }, { op: 'add', v: 1 }] };
      let schritte = start.schritte, y = 13, loesung = null, laeuft = false, pruefZahl = 0, rueckZahl = 0, letzteRichtig = false;
      const melde = () => wurzel.dispatchEvent(new CustomEvent('fw-stand', { bubbles: true }));
      const ed = U.editor($('.rw-editor'), { name: 'f', nurBaukasten: true, schritte, max: 4, beiAenderung(z) { schritte = z.schritte; neu(); } });
      const graph = new FW.Graph($('.rw-graph'));

      function spur(werte, ab) {   // werte[k]: Liste der Werte an Station k (oder null); Umkehrschritte ab Index ab leuchten
        const st = (k) => {
          const w = werte && werte[k];
